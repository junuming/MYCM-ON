/* ==== src/native.js ==== */
/* 설치형 앱(안드로이드)과 휴대폰 웹앱: 파일 저장·공유, 사용자 이름, AI 키, 뒤로 가기 버튼, 화면 켜 두기 */
(function () {
  'use strict';
  const PWA = window.MYCM_TARGET === 'pwa';
  if (window.MYCM_TARGET !== 'apk' && !PWA) return;
  const Cap = window.Capacitor;
  const native = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
  const reg = (n) => (native && Cap.registerPlugin ? Cap.registerPlugin(n) : null);
  const FS = reg('Filesystem'), Share = reg('Share'), AppP = reg('App'), Awake = reg('KeepAwake'), Stt = reg('OfflineStt'), Gal = reg('Gallery'), Cam = reg('FieldCamera');
  const FOLDER = 'MooyoungCM';

  function toB64(blob) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => { const s = String(r.result); res(s.slice(s.indexOf(',') + 1)); };
      r.onerror = () => rej(r.error || new Error('파일을 읽지 못했습니다'));
      r.readAsDataURL(blob);
    });
  }
  const splitName = (n) => { const k = n.lastIndexOf('.'); return k > 0 ? [n.slice(0, k), n.slice(k)] : [n, '']; };

  // 문서 폴더에 저장한 뒤, 카톡·메일로 보낼 수 있게 묻는다
  async function saveNative(filename, blob) {
    const data = await toB64(blob);
    let uri = null, where = '', name = filename;
    const [base, ext] = splitName(filename);
    for (let i = 0; i < 6 && !uri; i++) {
      name = i ? `${base} (${i + 1})${ext}` : filename;
      try {
        const r = await FS.writeFile({ path: `${FOLDER}/${name}`, data, directory: 'DOCUMENTS', recursive: true });
        uri = r.uri; where = `내 파일 › 문서(Documents) › ${FOLDER}`;
      } catch (e) { /* 같은 이름의 남의 파일이 있으면 이름을 바꿔 다시 */ }
    }
    if (!uri) {
      const r = await FS.writeFile({ path: filename, data, directory: 'CACHE' });
      uri = r.uri; where = '';
    }
    const v = await window.App.sheet({
      title: where ? '저장했습니다' : '보낼 준비가 됐습니다',
      body: `<p style="margin:0"><b>${window.App.esc(name)}</b></p>${where ? `<p style="margin:0;color:var(--muted);font-size:15px">${window.App.esc(where)} 폴더에 있습니다.</p>` : '<p style="margin:0;color:var(--muted);font-size:15px">기기 문서 폴더에 저장하지 못해, 바로 보내기만 할 수 있습니다.</p>'}`,
      actions: [{ label: '닫기' }, { label: '카톡·메일로 보내기', kind: 'primary', value: 'share' }]
    });
    if (v === 'share') {
      try { await Share.share({ title: name, files: [uri], dialogTitle: '보낼 곳 고르기' }); }
      catch (e) { if (!/cancel/i.test(String(e && (e.message || e)))) window.App.toast('보내기 창을 열지 못했습니다.', true); }
    }
    return { status: 'saved', shown: true };
  }

  // 휴대폰 웹앱: [저장·보내기]는 공유 창(아이폰은 '파일에 저장', 카톡·메일), [내려받기]는 다운로드 폴더
  function saveWeb(filename, blob) {
    const A = window.App;
    const ios = window.MYCM_PWA && window.MYCM_PWA.ios;
    const file = new File([blob], filename, { type: blob.type || 'application/octet-stream' });
    let canShare = false;
    try { canShare = !!(navigator.share && navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) { canShare = false; }
    const dl = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 120000);
    };
    return A.sheet({
      title: '파일이 준비됐습니다',
      body: `<p style="margin:0"><b>${A.esc(filename)}</b></p><p style="margin:0;color:var(--muted);font-size:15px">${canShare ? (ios ? '[저장·보내기]에서 <b>파일에 저장</b>을 고르면 아이폰 파일 앱에, 카톡·메일을 고르면 바로 보냅니다.' : '[보내기]는 카톡·메일 등으로 보내고, [내려받기]는 휴대폰의 다운로드 폴더에 저장합니다.') : '[내려받기]를 누르면 다운로드 폴더에 저장됩니다.'}${A.sync && A.sync.configured ? '<br>현장 PC에도 자동으로 올라갑니다.' : ''}</p>
        <div class="ws-acts">${!ios || !canShare ? '<button class="btn" type="button" data-ws="dl">내려받기</button>' : ''}${canShare ? `<button class="btn primary" type="button" data-ws="share">${ios ? '저장·보내기' : '보내기'}</button>` : ''}</div>`,
      actions: [{ label: '닫기' }],
      onMount(b, close) {
        b.addEventListener('click', (e) => {
          const t = e.target.closest('[data-ws]'); if (!t) return;
          if (t.dataset.ws === 'dl') { dl(); close(); return; }
          // 누른 그 순간에 공유 창을 연다 (나중에 열면 브라우저가 막는다)
          navigator.share({ files: [file], title: filename }).then(() => close()).catch((err) => { if (err && err.name !== 'AbortError') { A.toast('공유 창을 열지 못했습니다. 내려받기를 써 주세요.', true); } });
        });
      }
    }).then(() => ({ status: 'saved', shown: true }));
  }

  const downloads = {
    async save({ filename, data }) {
      const blob = data instanceof Blob ? data : new Blob([data]);
      if (native && FS) return saveNative(filename, blob);
      if (PWA) return saveWeb(filename, blob);
      // 컴퓨터 브라우저로 시험할 때
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
      return { status: 'saved' };
    }
  };

  // AI 정리: 회사 Anthropic API 키를 넣었을 때만
  function sampleNS() {
    const key = window.App.store.get('aiKey', '');
    if (!key) return null;
    const call = async () => { throw { code: 'not_declared' }; };
    call.json = async (prompt, opts) => {
      if (navigator.onLine === false) throw { code: 'offline' };
      let r;
      try {
        r = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          signal: opts && opts.signal,
          headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
          body: JSON.stringify({ model: window.App.store.get('aiModel', 'claude-sonnet-5-5'), max_tokens: 4096, messages: [{ role: 'user', content: prompt }] })
        });
      } catch (e) {
        if (e && e.name === 'AbortError') throw { code: 'cancelled' };
        throw { code: 'upstream_error' };
      }
      if (r.status === 401 || r.status === 403) throw { code: 'bad_key' };
      if (r.status === 429) throw { code: 'rate_limited' };
      if (!r.ok) {
        let msg = '';
        try { msg = ((await r.json()).error || {}).message || ''; } catch (e) { /* 무시 */ }
        if (r.status === 413 || /too long|too large/i.test(msg)) throw { code: 'prompt_too_large' };
        if (r.status === 404 || /model/i.test(msg)) throw { code: 'bad_model', message: msg };
        throw { code: 'upstream_error', message: msg };
      }
      const j = await r.json();
      const text = (j.content || []).filter(c => c.type === 'text').map(c => c.text).join('');
      const m = text.match(/\{[\s\S]*\}/);
      if (!m) throw { code: 'invalid_json', text };
      try { return JSON.parse(m[0]); } catch (e) { throw { code: 'invalid_json', text }; }
    };
    return call;
  }

  const user = { async me() { return { name: window.App.store.get('userName', '') }; }, async id() { return 'local'; } };

  // 오프라인 글로 바꾸기: 녹음을 앱 임시 폴더에 옮긴 뒤 안드로이드 쪽 인식기(OfflineStt)에 넘긴다
  const stt = {
    async info() { if (!Stt) return null; try { return await Stt.info(); } catch (e) { return null; } },
    cancel() { if (Stt) Stt.cancel().catch(() => {}); },
    async transcribe(blob, ext, onProgress, onCopy, terms) {
      const path = 'stt-input.' + (ext || 'm4a');
      const CH = 3 * 1024 * 1024;
      let uri = null;
      for (let o = 0; o < blob.size || o === 0; o += CH) {
        const data = await toB64(blob.slice(o, o + CH));
        if (o === 0) uri = (await FS.writeFile({ path, data, directory: 'CACHE' })).uri;
        else await FS.appendFile({ path, data, directory: 'CACHE' });
        if (onCopy) onCopy(Math.min(1, (o + CH) / Math.max(1, blob.size)));
        if (blob.size === 0) break;
      }
      const h = await Stt.addListener('progress', (ev) => { try { onProgress(ev); } catch (e) { /* 화면 갱신 실패는 무시 */ } });
      try { return await Stt.transcribe({ path: uri, terms: terms || '' }); }
      finally {
        try { await h.remove(); } catch (e) { /* 무시 */ }
        FS.deleteFile({ path, directory: 'CACHE' }).catch(() => {});
      }
    }
  };

  // 앱에서 찍은 사진을 기기 갤러리(사진/MYCM-ON)에도: 원본을 임시 폴더에 옮긴 뒤 안드로이드가 복사
  async function toGallery(blob, name, takenAt) {
    if (!Gal || !FS) return false;
    const path = 'gallery-' + Date.now() + '.jpg';
    const CH = 3 * 1024 * 1024;
    let uri = null;
    try {
      for (let o = 0; o < blob.size; o += CH) {
        const data = await toB64(blob.slice(o, o + CH));
        if (o === 0) uri = (await FS.writeFile({ path, data, directory: 'CACHE' })).uri;
        else await FS.appendFile({ path, data, directory: 'CACHE' });
      }

  }

  // 빠른 사진 찍기: 안드로이드가 찍고·갤러리에 원본 복사·줄이기까지 하고, 줄인 파일만 받아 온다
  async function takePhoto(o) {
    const r = await Cam.take({ maxSide: 2400, thumbSide: 480, quality: 86, gallery: !!o.gallery, album: 'MYCM-ON', name: o.name || '' });
    if (!r || r.cancelled) return null;
    const get = async (p) => { const res = await fetch(Cap.convertFileSrc('file://' + p)); if (!res.ok) throw new Error('사진을 읽지 못했습니다'); return res.blob(); };
    try {

    } finally { Cam.cleanup({ paths: [r.full, r.thumb] }).catch(() => {}); }
  }

  window.MYCM_NATIVE = {
    stt,
    takePhoto: Cam ? takePhoto : null,
    toGallery: Gal ? toGallery : null,
    native,
    use(name) {
      if (name === 'downloads') return downloads;
      if (name === 'sample') return null;   // 돈 드는 AI는 쓰지 않는다
      if (name === 'user') return user;
      return null;
    },
    keepAwake(on) { if (Awake) { (on ? Awake.keepAwake() : Awake.allowSleep()).catch(() => {}); return; } wakeLock(on); },
    async version() { if (PWA) return (window.MYCM_VERSION || '') + ' · 웹앱'; try { const i = await AppP.getInfo(); return i.version + ' (' + i.build + ')'; } catch (e) { return '1.0.0'; } }
  };

  // 녹음하는 동안 화면이 꺼지지 않게 (웹: Screen Wake Lock)

  if (PWA) {
    try { history.replaceState({ mycm: 'base' }, ''); history.pushState({ mycm: 'top' }, ''); } catch (e) { /* 무시 */ }
    window.addEventListener('popstate', () => {
      const A = window.App;
      let done = false;
      if (A) {
        const qr = document.querySelector('.qrscan [data-q="x"]');

        else if (A.closeTopSheet && A.closeTopSheet()) done = true;
        else if (document.querySelector('.lightbox')) { document.querySelector('.lightbox').remove(); done = true; }
        else if (A.view !== 'home') { A.go('home'); done = true; }
      }
      if (done) { try { history.pushState({ mycm: 'top' }, ''); } catch (e) { /* 무시 */ } }
      else history.back();
    });
  }

  // 안드로이드 뒤로 가기: 열린 창 → 큰 사진 → 홈 → 앱 내리기
  if (AppP) {

      if (lb) { lb.remove(); return; }
      if (A.view !== 'home') { A.go('home'); return; }

    });
  }
})();


/* ==== src/pwa.js ==== */
/* 휴대폰 웹앱(아이폰 Safari·갤럭시 삼성 인터넷·크롬): 홈 화면에 추가, 인터넷 없이 열기(서비스 워커), 새 판 알림 */
(function () {
  'use strict';
  if (window.MYCM_TARGET !== 'pwa') return;

  let installEvt = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; showInstall(); });
  window.addEventListener('appinstalled', () => { installEvt = null; hideBanner(); });

  // ---------------- 서비스 워커 ----------------
  let reloading = false;
  function registerSW() {
    if (!('serviceWorker' in navigator)) return;

      if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg);

    }).catch((e) => console.warn('sw', e));
    // 처음 설치될 때(전에 관리자가 없던 화면)는 다시 열지 않는다: 쓰던 화면이 갑자기 새로 고쳐지지 않게

      if (v === 'go' && reg.waiting) reg.waiting.postMessage('skipWaiting');
    });
  }
  // 앱 파일 보관이 끝날 때까지 (오프라인 준비가 앱 파일을 다 받은 뒤에 엔진을 받게)
  function ready(ms) {

      new Promise((res) => { if (navigator.serviceWorker.controller) return res(true); navigator.serviceWorker.addEventListener('controllerchange', () => res(true), { once: true }); }),

  let bannerEl = null;
  function hideBanner() { if (bannerEl) { bannerEl.remove(); bannerEl = null; } }
  function banner(kind, html, acts, cb) {
    hideBanner();
    const el = document.createElement('div');
    el.className = 'pwa-banner ' + kind;
    el.innerHTML = `<div class="tx">${html}</div><div class="acts">${acts.map(([l, v, p]) => `<button class="btn sm${p ? ' primary' : ''}" type="button" data-v="${v}">${l}</button>`).join('')}</div>`;
    el.addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (!b) return; hideBanner(); cb(b.dataset.v); });
    document.body.appendChild(el);
    bannerEl = el;
  }
  const SHARE_IC = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px"><path d="M12 3v12M8 7l4-4 4 4M5 12v8h14v-8"/></svg>';
  function showInstall() {
    if (standalone()) return;
    const A = window.App;
    const later = A ? A.store.get('pwa.later', 0) : 0;
    if (Date.now() - later < 3 * 864e5) return;
    const keep = '<span class="warn">브라우저 창에서 넣은 자료는 홈 화면 앱으로 옮겨지지 않으니, 먼저 설치하고 쓰세요.</span>';
    if (IOS) {
      banner('install', `<b>홈 화면에 추가해서 쓰세요</b><span>아래 ${SHARE_IC} 공유 단추 › <b>홈 화면에 추가</b>를 누르면 앱처럼 열리고, 인터넷이 없어도 켜집니다.</span>${keep}`, [['나중에', 'later']], (v) => { if (A) A.store.set('pwa.later', Date.now()); });
    } else if (installEvt) {
      banner('install', `<b>앱으로 설치하세요</b><span>홈 화면에 MYCM-ON이 생기고, 인터넷이 없어도 켜집니다.</span>${keep}`, [['나중에', 'later'], ['설치', 'install', true]], async (v) => {
        if (v === 'install' && installEvt) { installEvt.prompt(); try { await installEvt.userChoice; } catch (e) { /* 무시 */ } installEvt = null; }
        else if (A) A.store.set('pwa.later', Date.now());

  const SCRIPTS = [

  const prep = App.prep = { state: 'idle', done: {}, frac: 0, mods: {}, error: '' };

  // 큰 파일은 한 번 받은 뒤 기기에 보관해 두고, 통신이 끊겨도 꺼내 쓴다
  function engine(key) {
    if (!enginePromises[key]) {
      enginePromises[key] = (async () => {
        if (STANDALONE) {
          // 앱 안에 들어 있으므로 따로 보관하지 않는다
          const r = await fetch(here(key));
          if (!r.ok) throw new Error(key + ' ' + r.status);
          prep.done[key] = true;
          return r.arrayBuffer();
        }
        let buf = null;
        try { buf = await DB.get('engines', key); } catch (e) { buf = null; }
        if (buf) { prep.done[key] = true; return buf; }
        const r = await fetch(here(key));
        if (!r.ok) throw new Error(key + ' ' + r.status);
        buf = await r.arrayBuffer();
        try { await DB.put('engines', buf, key); prep.done[key] = true; } catch (e) { /* 보관 실패해도 이번에는 쓴다 */ }
        return buf;
      })().catch(e => { delete enginePromises[key]; throw e; });
    }
    return enginePromises[key];
  }
  App.engine = engine;
  const modPromises = {};
  App.mod = (file) => {
    if (!modPromises[file]) modPromises[file] = import(here(file)).catch(e => { delete modPromises[file]; throw e; });
    return modPromises[file];
  };
  const scriptPromises = {};
  function loadScript(s) {
    if (s.ok()) return Promise.resolve();
    if (!scriptPromises[s.key]) {
      scriptPromises[s.key] = new Promise((res, rej) => {

        document.head.appendChild(el);

    return scriptPromises[s.key];

    cur.pts.push(p);
    if (cur.kind === 'dist' && cur.pts.length === 2) { S.meas.push(cur); S.cur = null; }
    renderCard(); redraw();
  }
  function finishArea() {
    const cur = S.cur;
    if (cur && cur.kind === 'area' && cur.pts.length >= 3) S.meas.push(cur);
    S.cur = null;
    renderCard(); redraw();
  }
  function undoPoint() {
    if (S.cur && S.cur.pts.length) { S.cur.pts.pop(); if (!S.cur.pts.length) S.cur = null; }
    else if (S.meas.length) S.meas.pop();
    renderCard(); redraw();
  }
  function clearMeasure() { S.meas = []; S.cur = null; S.lastSnap = null; renderCard(); redraw(); }
  function renderCard() {
    const measuring = S.mode === 'dist' || S.mode === 'area';
    if (!S.scene || (!measuring && !S.meas.length)) { mcard.hidden = true; return; }
    const last = S.cur && S.cur.pts.length ? S.cur : S.meas[S.meas.length - 1];
    const title = S.mode === 'dist' ? '거리 측정' : S.mode === 'area' ? '면적 측정' : '측정 결과';
    let hint = '';
    const tip = '손가락에 가려 안 보이면 <b>꾹 누르세요</b>. 돋보기가 뜨면 손가락을 움직여 맞추고 떼면 찍힙니다.';
    if (S.mode === 'dist') hint = !S.cur ? '재려는 첫 점을 누르세요. 가까운 끝점·교차점에 붙습니다. ' + tip : '두 번째 점을 누르세요. ' + tip;
    else if (S.mode === 'area') hint = !S.cur ? '경계의 첫 점을 누르세요. ' + tip : `점 ${S.cur.pts.length}개 · 첫 점을 다시 누르거나 '닫기'를 누르면 면적이 나옵니다.`;
    let rows = '';
    if (last) {
      if (last.kind === 'dist' && last.pts.length >= 2) {
        const a = last.pts[0], b = last.pts[1];
        const dx = b.x - a.x, dy = b.y - a.y;
        rows = `<dt>거리</dt><dd class="big">${fmtLen(Math.hypot(dx, dy))}</dd><dt>ΔX / ΔY</dt><dd>${nf(dx, decs())} / ${nf(dy, decs())}</dd><dt>각도</dt><dd>${deg(Math.atan2(dy, dx))}</dd>`;
      } else if (last.kind === 'area' && last.pts.length >= 3) {
        const st = polyStats(last.pts);
        rows = areaRows(st.area).map(([k, v, big]) => `<dt>${k}</dt><dd${big ? ' class="big"' : ''}>${v}</dd>`).join('') + `<dt>둘레</dt><dd>${fmtLen(st.perimeter)}</dd>`;
      }
    }
    const btns = [];
    if (S.mode === 'area' && S.cur && S.cur.pts.length >= 3) btns.push('<button class="btn sm primary" type="button" data-m="close">닫기</button>');
    if ((S.cur && S.cur.pts.length) || S.meas.length) btns.push('<button class="btn sm" type="button" data-m="undo">한 점 취소</button>');
    if (S.meas.length) btns.push(`<button class="btn sm danger" type="button" data-m="clear">모두 지우기</button>`);
    mcard.innerHTML = `<div class="h"><b>${title}</b>${S.meas.length ? `<span class="chip gray">${S.meas.length}개</span>` : ''}</div>` +
      (hint ? `<div class="hint">${hint}</div>` : '') + (rows ? `<dl>${rows}</dl>` : '') + (btns.length ? `<div class="acts">${btns.join('')}</div>` : '');
    mcard.hidden = false;
  }
  mcard.addEventListener('click', (e) => {
    const b = e.target.closest('[data-m]'); if (!b) return;
    if (b.dataset.m === 'close') finishArea(); else if (b.dataset.m === 'undo') undoPoint(); else clearMeasure();
  });
  mcard.addEventListener('pointerdown', (e) => e.stopPropagation());

  // ---------- 돋보기 조준 (손가락에 가린 선을 보며 점 찍기) ----------
  let aim = null;
  function startAim(id, p) {
    aim = { on: true, id, x: p.x, y: p.y, scr: null };
    lc.width = lc.height = Math.round(LOUPE * S.dpr);
    loupe.hidden = false;
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) { /* 무시 */ } }
    aimAt(p);
  }
  function aimAt(p) {
    aim.x = p.x; aim.y = p.y;
    const [wx, wy] = toWorld(p.x * S.dpr, p.y * S.dpr);
    const sn = findSnap(wx, wy, false);
    S.hover = sn;
    S.cursor = sn ? absPt(sn.x, sn.y) : absPt(wx, wy);
    aim.scr = sn ? toScr(sn.x, sn.y) : [p.x * S.dpr, p.y * S.dpr];
    $('#cad-loupe-t').textContent = sn ? (SNAP_KO[sn.type] || '') : '';
    // 손가락 위쪽에 띄우고, 위가 모자라면 옆으로
    const W = S.W / S.dpr, H = S.H / S.dpr, R = LOUPE / 2, gap = 34;
    let cx = p.x, cy = p.y - gap - R;
    if (cy - R < 6) { cy = Math.max(R + 6, p.y); cx = p.x + (p.x > W / 2 ? -1 : 1) * (gap + R + 24); }
    cx = Math.min(W - R - 6, Math.max(R + 6, cx)); cy = Math.min(H - R - 6, Math.max(R + 6, cy));
    loupe.style.left = (cx - R - 3) + 'px'; loupe.style.top = (cy - R - 3) + 'px';
    updateCoords(S.cursor);
    redraw();
  }
  function drawLoupe() {
    const n = lc.width, src = n / LOUPE_ZOOM;
    const [ax, ay] = aim.scr;
    lctx.setTransform(1, 0, 0, 1, 0, 0);
    lctx.fillStyle = S.light ? '#FFFFFF' : '#0E1420';
    lctx.fillRect(0, 0, n, n);
    lctx.imageSmoothingEnabled = true;
    try {
      if (gl) lctx.drawImage(glc, ax - src / 2, ay - src / 2, src, src, 0, 0, n, n);
      lctx.drawImage(ovc, ax - src / 2, ay - src / 2, src, src, 0, 0, n, n);
    } catch (e) { /* 가장자리 등 */ }
    lctx.strokeStyle = '#FFB547'; lctx.lineWidth = 2 * S.dpr;
    lctx.beginPath(); lctx.arc(n / 2, n / 2, 7 * S.dpr, 0, Math.PI * 2); lctx.stroke();
  }
  function endAim() {
    if (!aim) return;
    aim = null;
    loupe.hidden = true;
    S.hover = null; S.cursor = null;
    redraw();
  }

  // ---------- 도구 ----------
  function setMode(m) {
    if (S.cur && S.cur.kind === 'area' && m !== 'area') finishArea();
    endAim();
    S.mode = m; S.cur = null; S.hover = null; S.lastSnap = null;
    document.querySelectorAll('[data-cadtool]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cadtool === m)));
    if (m === 'find') { showTab('search'); openPanel(true); setTimeout(() => $('#cad-q').focus(), 30); }
    else if (m === 'pick') { showTab('props'); }
    else if (S.tab === 'search' || S.tab === 'props') showTab('layers');
    stage.style.cursor = m === 'dist' || m === 'area' ? 'crosshair' : m === 'pick' ? 'pointer' : 'grab';
    renderCard(); redraw();
  }
  document.querySelectorAll('[data-cadtool]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.cadtool)));

  // ---------- 손가락 · 펜 · 마우스 ----------
  const ptrs = new Map();
  let drag = null, pinch = null;
  const local = (e) => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  stage.addEventListener('contextmenu', (e) => e.preventDefault());
  stage.addEventListener('pointerdown', (e) => {
    if (!S.scene) return;
    try { stage.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
    const p = local(e);
    ptrs.set(e.pointerId, p);
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
      if (drag) clearTimeout(drag.hold);
      drag = null;
      endAim();
      return;
    }
    if (ptrs.size > 2) return;
    drag = { x: p.x, y: p.y, sx: p.x, sy: p.y, btn: e.button, moved: e.button === 1, type: e.pointerType, id: e.pointerId };
    // 측정 중 손가락으로 꾹 누르면 돋보기 조준
    if ((S.mode === 'dist' || S.mode === 'area') && e.pointerType !== 'mouse') {
      const d0 = drag;
      d0.hold = setTimeout(() => { if (drag === d0 && !d0.moved && ptrs.size === 1) startAim(d0.id, { x: d0.x, y: d0.y }); }, HOLD_MS);
    }
  });
  stage.addEventListener('pointermove', (e) => {
    if (!S.scene) return;
    const p = local(e);
    if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, p);
    if (pinch && ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      S.view.cx -= (mx - pinch.mx) * S.dpr / S.view.s; S.view.cy += (my - pinch.my) * S.dpr / S.view.s;
      if (pinch.d > 0 && d > 0) zoomAt(mx * S.dpr, my * S.dpr, d / pinch.d);
      pinch = { d, mx, my };
      S.autoFit = false;
      redraw();
      return;
    }
    if (aim && aim.on && e.pointerId === aim.id) { aimAt(p); return; }
    const [wx, wy] = toWorld(p.x * S.dpr, p.y * S.dpr);
    if (drag) {
      const dx = p.x - drag.x, dy = p.y - drag.y;
      const slop = drag.type === 'touch' ? 10 : 5;
      if (!drag.moved && Math.hypot(p.x - drag.sx, p.y - drag.sy) > slop) { drag.moved = true; clearTimeout(drag.hold); }
      if (drag.moved) {
        S.view.cx -= dx * S.dpr / S.view.s; S.view.cy += dy * S.dpr / S.view.s;
        drag.x = p.x; drag.y = p.y; S.autoFit = false;
        S.hover = null;
        redraw();
        return;
      }
    }
    if (e.pointerType === 'mouse' && (S.mode === 'dist' || S.mode === 'area')) {
      S.hover = findSnap(wx, wy, false);
      S.cursor = S.hover ? absPt(S.hover.x, S.hover.y) : absPt(wx, wy);
      redraw();
      updateCoords(S.cursor);
    }
  });
  function endPtr(e) {
    ptrs.delete(e.pointerId);
    if (aim && aim.on && e.pointerId === aim.id) {
      const pt = S.cursor;
      const ok = e.type !== 'pointercancel' && pt;
      S.lastSnap = S.hover;
      endAim();
      drag = null;
      if (ok) { updateCoords(pt); addMeasurePoint(pt); }
      return;
    }
    if (drag) clearTimeout(drag.hold);
    if (pinch) { if (ptrs.size < 2) pinch = null; drag = null; return; }
    if (!drag) return;
    const d = drag; drag = null;
    if (e.type === 'pointercancel' || d.moved) return;
    if (d.btn === 2) { if (S.mode === 'area') finishArea(); return; }
    if (d.btn !== 0) return;
    const p = local(e);
    const [wx, wy] = toWorld(p.x * S.dpr, p.y * S.dpr);
    const touch = e.pointerType !== 'mouse';
    if (S.mode === 'dist' || S.mode === 'area') {
      const sn = findSnap(wx, wy, touch);
      S.lastSnap = sn;
      const pt = sn ? absPt(sn.x, sn.y) : absPt(wx, wy);
      S.cursor = touch ? null : pt;
      updateCoords(pt);
      addMeasurePoint(pt);
    } else if (S.mode === 'pick' || S.mode === 'find') {
      const id = pick(wx, wy, touch);
      select(id, { showProps: id >= 0 });
      updateCoords(absPt(wx, wy));
    } else updateCoords(absPt(wx, wy));
  }
  stage.addEventListener('pointerup', endPtr);
  stage.addEventListener('pointercancel', endPtr);
  stage.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && !drag) { S.hover = null; S.cursor = null; redraw(); } });
  stage.addEventListener('dblclick', () => {
    if (S.mode === 'area' && S.cur) {
      const p = S.cur.pts;
      if (p.length >= 2 && Math.hypot(p[p.length - 1].x - p[p.length - 2].x, p[p.length - 1].y - p[p.length - 2].y) < 1e-9) p.pop();
      finishArea();
    }
  });
  stage.addEventListener('wheel', (e) => {
    if (!S.scene) return;
    e.preventDefault();
    let dy = e.deltaY;
    if (e.deltaMode === 1) dy *= 16; else if (e.deltaMode === 2) dy *= 400;
    const p = local(e);
    zoomAt(p.x * S.dpr, p.y * S.dpr, Math.exp(-dy * 0.0016));
  }, { passive: false });
  function updateCoords(p) { $('#cad-xy').textContent = `X ${nf(p.x, decs())}   Y ${nf(p.y, decs())}`; }

  window.addEventListener('keydown', (e) => {
    if (App.view !== 'drawing' || !S.scene) return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (k === 'Escape') { if (S.cur) { S.cur = null; renderCard(); redraw(); } else if (S.sel !== null || S.selSet) select(-1, { showProps: false }); }
    else if (k === 'Enter' && S.mode === 'area') finishArea();
    else if (k === 'f' || k === 'F') fitAll();
    else if (k === 'd' || k === 'D') setMode('dist');
    else if (k === 'a' || k === 'A') setMode('area');
    else if (k === 'v' || k === 'V') setMode('pick');
    else if (k === 'h' || k === 'H') setMode('pan');
  });

  // ---------- 막대 버튼 ----------
  $('#cad-fit').addEventListener('click', fitAll);
  function applyBg() {
    stage.classList.toggle('light', S.light);
    $('#cad-bg').setAttribute('aria-pressed', String(S.light));
    colorCache.clear();
    if (S.scene) renderLayers();
    redraw();
  }
  $('#cad-bg').addEventListener('click', () => { S.light = !S.light; App.store.set('cad.light', S.light); applyBg(); });
  function snapUI() {
    $('#cad-snap').setAttribute('aria-pressed', String(S.snapOn));
    $('#cad-snap').textContent = S.snapOn ? '스냅 켜짐' : '스냅 꺼짐';
  }
  $('#cad-snap').addEventListener('click', () => { S.snapOn = !S.snapOn; App.store.set('cad.snap', S.snapOn); snapUI(); });
  const narrowQ = window.matchMedia('(max-width: 1100px)');
  function openPanel(on) {
    if (on && !narrowQ.matches) { panel.removeAttribute('data-closed'); return; }
    if (on) panel.removeAttribute('data-closed'); else panel.setAttribute('data-closed', '');
    $('#cad-panel-btn').setAttribute('aria-pressed', String(!panel.hasAttribute('data-closed')));
  }
  $('#cad-panel-btn').addEventListener('click', () => openPanel(panel.hasAttribute('data-closed')));

  // ---------- 패널 ----------
  function showTab(name) {
    S.tab = name;
    document.querySelectorAll('[data-cadtab]').forEach(t => t.setAttribute('aria-selected', String(t.dataset.cadtab === name)));
    for (const n of ['layers', 'blocks', 'search', 'props']) $('#cad-p-' + n).hidden = n !== name;
  }
  document.querySelectorAll('[data-cadtab]').forEach(t => t.addEventListener('click', () => showTab(t.dataset.cadtab)));

  function layerUsed(i) {
    const sc = S.scene, L = sc.layers[i];
    return L.entCount > 0 || (sc.lines.ranges[i] && sc.lines.ranges[i][1] > 0) || (sc.tris.ranges[i] && sc.tris.ranges[i][1] > 0) || sc.texts.some(t => t.layer === i);
  }
  function renderLayers() {
    const sc = S.scene, box = $('#cad-p-layers');
    if (!sc) { box.innerHTML = ''; return; }
    if (!sc._used) sc._used = sc.layers.map((L, i) => layerUsed(i));
    let vis = 0, tot = 0;
    sc._used.forEach((u, i) => { if (u) { tot++; if (S.layerVis[i]) vis++; } });
    const rows = [];
    sc.layers.forEach((L, i) => {
      if (!sc._used[i]) return;
      const on = S.layerVis[i];
      const note = L.frozen ? ' · 동결' : (L.off ? ' · 꺼진 채 저장됨' : '');
      rows.push(`<div class="layer${on ? '' : ' off'}"><button class="tg" type="button" data-li="${i}" aria-pressed="${on}" title="${esc(L.name)}${note}">
        <span class="sw" style="background:${cssColor(L.color)}"></span><span class="nm">${esc(L.name)}</span><span class="st">${on ? '켜짐' : '꺼짐'}</span></button>
        <button class="iso" type="button" data-iso="${i}" aria-label="${esc(L.name)}만 보기" title="이 레이어만 보기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/></svg></button></div>`);
    });
    box.innerHTML = `<div class="ph"><span>레이어 ${tot}개 · 눌러서 켜고 끄기</span><button class="linkbtn" type="button" data-allon>${vis === tot ? '모두 끄기' : '모두 켜기'}</button></div>` + rows.join('');
  }
  $('#cad-p-layers').addEventListener('click', (e) => {
    const sc = S.scene; if (!sc) return;
    const t = e.target.closest('[data-li]');
    if (t) { const i = +t.dataset.li; S.layerVis[i] = !S.layerVis[i]; renderLayers(); redraw(); return; }
    const iso = e.target.closest('[data-iso]');
    if (iso) {
      const i = +iso.dataset.iso;
      const only = S.layerVis.every((v, j) => (j === i) === !!v || !sc._used[j]);
      S.layerVis = S.layerVis.map((v, j) => only ? true : j === i);
      renderLayers(); redraw();
      App.toast(only ? '모든 레이어를 다시 켰습니다.' : `${sc.layers[i].name} 레이어만 보입니다. 다시 누르면 모두 켭니다.`);
      return;
    }
    if (e.target.closest('[data-allon]')) {
      const allOn = sc.layers.every((L, i) => !sc._used[i] || S.layerVis[i]);
      S.layerVis = sc.layers.map(() => !allOn);
      renderLayers(); redraw();
    }
  });

  function renderBlocks() {
    const sc = S.scene, box = $('#cad-p-blocks');
    if (!sc) { box.innerHTML = ''; return; }
    if (!sc.blocks.length) { box.innerHTML = '<p class="empty">이 도면에는 블록 참조가 없습니다.</p>'; return; }
    const top = sc.blocks.reduce((s, b) => s + b.top, 0);
    box.innerHTML = `<div class="ph"><span>블록 ${nf(sc.blocks.length, 0)}종 · 배치 ${nf(top, 0)}개</span><button class="linkbtn" type="button" data-bcopy>표 복사</button></div>
      <table class="tbl"><thead><tr><th>블록 이름</th><th class="n">배치</th><th class="n">전체</th></tr></thead><tbody>` +
      sc.blocks.map(b => `<tr class="click${S.activeBlock === b.name ? ' active' : ''}" data-b="${esc(b.name)}" tabindex="0"><td style="word-break:break-all">${esc(b.name)}${b.dynamic ? ' <span class="chip gray">동적</span>' : ''}</td><td class="n">${nf(b.top, 0)}</td><td class="n">${nf(b.all, 0)}</td></tr>`).join('') +
      '</tbody></table><p class="meta" style="font-size:13px;color:var(--muted)">행을 누르면 도면에서 위치를 표시합니다. 전체는 다른 블록 안에 들어간 것까지 셉니다.</p>';
  }
  function activateBlock(name) {
    const b = S.scene.blocks.find(x => x.name === name);
    if (!b) return;
    if (!b.ents.length) { App.toast(`'${name}' 블록은 다른 블록 안에만 들어 있어 따로 표시할 수 없습니다.`); return; }
    select(-1, { set: new Set(b.ents), block: name, zoom: true, showProps: false });
    showTab('blocks');
  }
  $('#cad-p-blocks').addEventListener('click', (e) => {
    if (e.target.closest('[data-bcopy]')) {
      const tsv = '블록 이름\t배치\t전체\n' + S.scene.blocks.map(b => `${b.name}\t${b.top}\t${b.all}`).join('\n');
      App.copy(tsv, '블록 수량표를 복사했습니다. 엑셀에 붙여 넣을 수 있습니다.');
      return;
    }
    const tr = e.target.closest('tr[data-b]'); if (tr) activateBlock(tr.dataset.b);
  });
  $('#cad-p-blocks').addEventListener('keydown', (e) => { if (e.key === 'Enter') { const tr = e.target.closest('tr[data-b]'); if (tr) activateBlock(tr.dataset.b); } });

  let searchT = 0;
  function runSearch() {
    const sc = S.scene;
    const q = $('#cad-q').value.trim();
    const box = $('#cad-q-hits');
    if (!sc) { box.innerHTML = ''; return; }
    if (!q) { $('#cad-q-meta').textContent = `도면 안의 문자 ${nf(sc.texts.length, 0)}개를 찾습니다.`; box.innerHTML = ''; return; }
    const ql = q.toLowerCase(), hits = [];
    for (let i = 0; i < sc.texts.length; i++) if (sc.texts[i].str.toLowerCase().indexOf(ql) >= 0) hits.push(i);
    $('#cad-q-meta').textContent = hits.length ? `${nf(hits.length, 0)}건${hits.length > 300 ? ' (앞 300건)' : ''}` : '일치하는 문자가 없습니다.';
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    box.innerHTML = hits.slice(0, 300).map(i => {
      const t = sc.texts[i];

    if (!lib) throw new Error('PDF 엔진을 불러오지 못했습니다. 네트워크 연결을 확인해 주세요.');
    await App.pdfWorker();
    const task = lib.getDocument({
      data: bytes.slice(), isEvalSupported: false, enableXfa: false,
      CMapReaderFactory: KoCMapFactory
    });
    task.onPassword = (cb, reason) => askPassword(reason === 2).then(cb, () => task.destroy());
    const pdf = await task.promise;
    const n = pdf.numPages;
    const pages = new Array(n), sizes = new Array(n);
    for (let i = 0; i < n; i += 24) {
      const ks = []; for (let k = i; k < Math.min(n, i + 24); k++) ks.push(k);
      await Promise.all(ks.map(async k => {
        const p = await pdf.getPage(k + 1);
        const vp = p.getViewport({ scale: 1 });
        pages[k] = p; sizes[k] = { w: vp.width, h: vp.height };
      }));
      if (progress) progress((i + ks.length) / n);
    }
    return {
      kind: 'pdf', pdf, n, sizes, pages,
      render(i, canvas, scale, region) {
        const page = pages[i];
        const vp = page.getViewport({ scale });
        let w = vp.width, h = vp.height, transform = null;
        if (region) { w = region.w * scale; h = region.h * scale; transform = [1, 0, 0, 1, -region.x * scale, -region.y * scale]; }
        canvas.width = Math.max(1, Math.ceil(w)); canvas.height = Math.max(1, Math.ceil(h));
        const ctx = canvas.getContext('2d', { alpha: false });
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        return page.render({ canvasContext: ctx, viewport: vp, transform });
      },
      async text(i) {
        const page = pages[i];
        const vp = page.getViewport({ scale: 1 });
        const tc = await page.getTextContent();
        const out = [];
        for (const it of tc.items) {
          if (!it.str || !it.str.trim()) continue;
          const t = lib.Util.transform(vp.transform, it.transform);
          const fh = Math.hypot(t[2], t[3]) || 10;
          const dirx = t[0], diry = t[1], dl = Math.hypot(dirx, diry) || 1;
          const wv = it.width * vp.scale;
          const ux = dirx / dl, uy = diry / dl;
          // 가로쓰기 기준 사각형 (회전된 글은 근사)
          const x0 = t[4], y0 = t[5];
          const xs = [x0, x0 + ux * wv, x0 - uy * -fh, x0 + ux * wv - uy * -fh];
          const ys = [y0, y0 + uy * wv, y0 - fh * (Math.abs(ux) > 0.5 ? 1 : 0), y0 + uy * wv - fh * (Math.abs(ux) > 0.5 ? 1 : 0)];
          out.push({ str: it.str, x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs) || wv, h: Math.max(...ys) - Math.min(...ys) || fh, horiz: Math.abs(ux) > 0.5 });
        }
        return mergeRuns(out);
      },
      mapper(i) {
        const vp = pages[i].getViewport({ scale: 1 });
        return (x, y) => vp.convertToPdfPoint(x, y);
      },
      async canvasFor(i, pxPerPt) {
        const c = document.createElement('canvas');
        await this.render(i, c, pxPerPt).promise;
        return c;
      },
      destroy() { try { pdf.destroy(); } catch (e) { /* 무시 */ } }
    };
  }

  // 한글 CMap(글꼴 미포함 PDF용)을 JSON 묶음에서 읽는다
  let cmapPack = null;
  class KoCMapFactory {
    constructor() { /* 옵션 없음 */ }
    async fetch({ name }) {
      if (!cmapPack) cmapPack = App.engine('cmaps-ko.json').then(buf => JSON.parse(new TextDecoder().decode(buf))).catch(e => { cmapPack = null; throw e; });
      const pack = await cmapPack;
      const b64 = pack[name];
      if (!b64) throw new Error('지원하지 않는 문자표: ' + name);
      const bin = atob(b64), u = new Uint8Array(bin.length);
      for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k);
      return { cMapData: u, compressionType: 1 };
    }
  }

  // 글자 조각을 줄 단위로 이어 붙여 검색이 되게 한다 (글자별 x 위치 보존)
  function mergeRuns(items) {
    const out = [];
    let cur = null;
    for (const it of items) {
      const n = it.str.length;
      const cx = []; for (let k = 0; k <= n; k++) cx.push(it.w * k / n);
      if (cur && it.horiz && cur.horiz) {
        const h = Math.max(cur.h, it.h), end = cur.x + cur.w, gap = it.x - end;
        if (Math.abs(it.y - cur.y) < h * 0.35 && gap > -h * 0.6 && gap < h * 1.6) {
          let off = it.x - cur.x;
          if (gap > h * 0.22) { cur.str += ' '; cur.cx.push(end - cur.x + gap); off = it.x - cur.x; }
          cur.cx.pop();
          for (const v of cx) cur.cx.push(off + v);
          cur.str += it.str;
          cur.w = Math.max(cur.w, it.x + it.w - cur.x);
          cur.y = Math.min(cur.y, it.y); cur.h = Math.max(cur.h, it.h);
          continue;
        }
      }
      cur = { str: it.str, x: it.x, y: it.y, w: it.w, h: it.h, horiz: it.horiz, cx };
      out.push(cur);
    }
    return out;
  }

  function askPassword(wrong) {
    busy(false);
    return App.sheet({
      title: '암호가 걸린 PDF',
      body: `<p>${wrong ? '암호가 맞지 않습니다. 다시 입력해 주세요.' : '문서를 열려면 암호를 입력해 주세요.'}</p><input class="field" id="pw-in" type="password" autocomplete="off" aria-label="암호" autofocus>`,
      actions: [{ label: '취소' }, { label: '열기', kind: 'primary', value: (b) => $('#pw-in', b).value }],
      onMount(b, close) { $('#pw-in', b).addEventListener('keydown', (e) => { if (e.key === 'Enter') close(e.target.value); }); }
    }).then(v => { if (v === null) throw new Error('cancel'); busy(true, 'PDF 여는 중', 0.2); return v; });
  }

  // ---------------- 한글(HWP/HWPX) 백엔드 ----------------
  let rhwpP = null;
  function loadRhwp() {
    if (!rhwpP) {
      rhwpP = (async () => {
        busy(true, '한글 문서 엔진 준비 중', 0.15, App.prep.done['rhwp_bg.wasm'] ? '' : '처음 한 번만 약 10MB를 받습니다.');
        const mod = await App.mod('rhwp.js');
        const buf = await App.engine('rhwp_bg.wasm');
        await mod.default({ module_or_path: buf.slice(0) });
        return mod;
      })().catch(e => { rhwpP = null; throw e; });
    }
    return rhwpP;
  }
  async function openHwp(bytes, progress) {
    const mod = await loadRhwp();
    busy(true, '한글 문서 해석 중', 0.4);
    await tick();
    // 대체 글꼴이 준비된 뒤 조판해야 줄바꿈이 덜 어긋난다
    try { await Promise.race([Promise.all(['16px "Noto Serif KR"', '16px "Noto Sans KR"'].map(f => document.fonts.load(f, '가나다라ABC123'))), new Promise(r => setTimeout(r, 2500))]); } catch (e) { /* 무시 */ }
    let d;
    try { d = new mod.HwpDocument(new Uint8Array(bytes)); }
    catch (e) {
      const m = String(e && (e.message || e));
      if (/password|암호|encrypt/i.test(m)) throw new Error('암호가 걸린 한글 문서는 열 수 없습니다. 한글에서 암호를 해제한 뒤 열어 주세요.');
      throw new Error('한글 문서를 해석하지 못했습니다. (' + m.slice(0, 80) + ')');
    }
    const n = d.pageCount();
    const sizes = [];
    for (let i = 0; i < n; i++) {
      let info = {};
      try { info = JSON.parse(d.getPageInfo(i)); } catch (e) { /* 기본 A4 */ }
      sizes.push({ w: (info.width || 793.7) * 0.75, h: (info.height || 1122.5) * 0.75 });
      if (progress && (i & 15) === 15) progress(i / n);
    }
    return {
      kind: 'hwp', d, n, sizes,
      svg(i) { return prepSvg(d.renderPageSvg(i), i); },
      async canvasFor(i, pxPerPt) {
        const c = document.createElement('canvas');
        d.renderPageToCanvas(i, c, pxPerPt * 0.75);
        return c;
      },
      async text(i) {
        let L;
        try { L = JSON.parse(d.getPageTextLayout(i)); } catch (e) { return []; }
        return (L.runs || []).filter(r => r.text && r.text.trim()).map(r => ({
          str: r.text, x: r.x * 0.75, y: r.y * 0.75, w: r.w * 0.75, h: r.h * 0.75, cx: (r.charX || []).map(v => v * 0.75), horiz: true
        }));
      },
      mapper(i) { const h = sizes[i].h; return (x, y) => [x, h - y]; },
      destroy() { try { d.free(); } catch (e) { /* 무시 */ } }
    };
  }
  function prepSvg(str, i) {
    const pre = 'p' + i + '-';
    str = str.replace(/\bid="([^"]+)"/g, (m, id) => `id="${pre}${id}"`)
      .replace(/url\(#([^)]+)\)/g, (m, id) => `url(#${pre}${id})`)
      .replace(/((?:xlink:)?href)="#([^"]+)"/g, (m, a, id) => `${a}="#${pre}${id}"`);
    const dom = new DOMParser().parseFromString(str, 'image/svg+xml');
    const svg = dom.documentElement;
    if (!svg || svg.nodeName.toLowerCase() !== 'svg') return null;
    svg.querySelectorAll('script, foreignObject, iframe').forEach(n => n.remove());
    const it = dom.createTreeWalker(svg, 1);
    let el = svg;
    while (el) {
      for (const a of Array.from(el.attributes)) {
        if (/^on/i.test(a.name) || (/href$/i.test(a.name) && /^\s*javascript:/i.test(a.value))) el.removeAttribute(a.name);
      }
      el = it.nextNode();
    }
    svg.removeAttribute('width'); svg.removeAttribute('height');
    svg.setAttribute('preserveAspectRatio', 'none');
    return document.importNode(svg, true);
  }


  // ---------------- 배치 · 화면 ----------------
  function computeLayout() {
    D.cum = []; let acc = 0, mw = 1;
    for (const s of D.sizes) { D.cum.push(acc); acc += s.h; mw = Math.max(mw, s.w); }
    D.totalH = acc; D.maxW = mw;
  }
  const pageTop = (i) => PAD + D.cum[i] * V.z + i * GAP;
  const contentW = () => D.maxW * V.z + 2 * PAD;
  const contentH = () => 2 * PAD + D.totalH * V.z + Math.max(0, D.n - 1) * GAP;
  const pageLeft = (i) => (Math.max(contentW(), V.W) - D.sizes[i].w * V.z) / 2;
  function pageAtY(wy) {
    let lo = 0, hi = D.n - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (pageTop(mid) <= wy) lo = mid; else hi = mid - 1; }
    return lo;
  }
  function clampScroll() {
    V.sx = clamp(V.sx, 0, Math.max(0, contentW() - V.W));
    V.sy = clamp(V.sy, 0, Math.max(0, contentH() - V.H));
  }
  function applyT() { world.style.transform = `translate3d(${-V.sx}px, ${-V.sy}px, 0)`; }
  function layout() {
    for (let i = 0; i < D.n; i++) {
      const el = PE[i].el, s = D.sizes[i];
      el.style.left = pageLeft(i) + 'px'; el.style.top = pageTop(i) + 'px';
      el.style.width = s.w * V.z + 'px'; el.style.height = s.h * V.z + 'px';
    }
    world.style.width = Math.max(contentW(), V.W) + 'px';
    world.style.height = contentH() + 'px';
    relayoutDetails();
  }
  function measureStage() {
    const r = stage.getBoundingClientRect();
    V.rect = r; V.W = Math.max(1, r.width); V.H = Math.max(1, r.height);
  }
  // 화면 좌표(클라이언트) → 페이지 좌표(pt)
  function hitPage(cx, cy, loose) {
    if (!D.n) return null;
    const wx = cx - V.rect.left + V.sx, wy = cy - V.rect.top + V.sy;
    let i = pageAtY(wy);
    if (i < D.n - 1 && wy > pageTop(i) + D.sizes[i].h * V.z + GAP / 2) i++;
    const x = (wx - pageLeft(i)) / V.z, y = (wy - pageTop(i)) / V.z;
    const s = D.sizes[i];
    if (!loose && (x < 0 || y < 0 || x > s.w || y > s.h)) return null;
    return { i, x, y };
  }
  function toPage(i, cx, cy) {
    return { x: (cx - V.rect.left + V.sx - pageLeft(i)) / V.z, y: (cy - V.rect.top + V.sy - pageTop(i)) / V.z };
  }
  function setZoom(z, fx, fy) {
    commitEditor();
    z = clamp(z, minZoom(), 8);
    if (fx === undefined) { fx = V.W / 2; fy = V.H / 2; }
    const a = hitPage(V.rect.left + fx, V.rect.top + fy, true);
    V.z = z;
    layout();
    if (a) {
      V.sx = pageLeft(a.i) + a.x * V.z - fx;
      V.sy = pageTop(a.i) + a.y * V.z - fy;
    }
    clampScroll();
    viewChanged(true);
  }
  const minZoom = () => Math.min(0.25, (V.W - 2 * PAD) / D.maxW * 0.5);
  function fitWidth(keep) {
    const z = clamp((V.W - 2 * PAD) / D.maxW, 0.2, 2.5);
    const cur = currentPage();
    const off = keep ? (V.sy - pageTop(cur)) / V.z : 0;
    V.z = z; layout();
    V.sy = pageTop(cur) + (keep ? off * V.z : -PAD / 2);
    clampScroll();
    V.auto = true;
    viewChanged(true);
  }
  function currentPage() {
    if (!D.n) return 0;
    return pageAtY(V.sy + V.H * 0.38);
  }
  function goPage(i) {
    i = clamp(i, 0, D.n - 1);
    V.sy = pageTop(i) - PAD / 2;
    clampScroll(); viewChanged();
  }
  function goRect(i, r) {
    const x = pageLeft(i) + (r.x + r.w / 2) * V.z, y = pageTop(i) + (r.y + r.h / 2) * V.z;
    V.sx = x - V.W / 2; V.sy = y - V.H * 0.42;
    clampScroll(); viewChanged();
  }

  let badgeT = 0, renderT = 0, lastPageShown = -1;
  function viewChanged(zoomed) {
    applyT();
    const cur = currentPage();
    if (cur !== lastPageShown) {
      lastPageShown = cur;
      const inp = $('#doc-page');
      if (document.activeElement !== inp) inp.value = cur + 1;
      $('#doc-badge').textContent = `${cur + 1} / ${D.n}`;
      markThumb(cur);
      if (D.key) saveSoon(true);
    }
    $('#doc-badge').classList.remove('hide');
    clearTimeout(badgeT); badgeT = setTimeout(() => $('#doc-badge').classList.add('hide'), 1200);
    $('#doc-zfit').textContent = Math.round(V.z / (96 / 72) * 100) + '%';
    if (zoomed && S.sel) drawSel(); else placeFloat();
    clearTimeout(renderT);
    renderT = setTimeout(renderPass, zoomed ? 120 : 60);
    if (!zoomed) requestRender();
  }
  let rafR = 0;
  function requestRender() { if (!rafR) rafR = requestAnimationFrame(() => { rafR = 0; renderPass(true); }); }

  // ---------------- 페이지 렌더링 ----------------
  function buildPages() {
    world.textContent = '';
    PE = D.sizes.map((s, i) => {
      const el = document.createElement('div');
      el.className = 'dpage';
      world.appendChild(el);
      return { el, i, base: null, canvas: null, scale: 0, task: null, want: 0, detail: null, detailKey: '', dtask: null, ink: null, svgDone: false };
    });
  }
  function visibleRange(margin) {
    if (!D.n) return [0, -1];
    const a = pageAtY(Math.max(0, V.sy - margin)), b = pageAtY(V.sy + V.H + margin);
    return [a, b];
  }
  function renderPass(light) {
    if (!D.be) return;
    const [a, b] = visibleRange(V.H * 0.5);
    const center = currentPage();
    const order = [];
    for (let i = a; i <= b; i++) order.push(i);
    order.sort((p, q) => Math.abs(p - center) - Math.abs(q - center));
    for (const i of order) { ensureInk(i); ensureBase(i, light); }
    if (!light) {
      for (let i = 0; i < D.n; i++) if (i < a - 3 || i > b + 3) unload(i);
      if (D.be.kind === 'pdf') for (const i of order) ensureDetail(i);
    }
    pumpQueue();
  }
  function fullScale(i) {
    const s = D.sizes[i];
    const want = V.z * DPR();
    const cap = Math.sqrt(MAXPX / (s.w * s.h));
    return Math.min(want, cap);
  }
  function ensureBase(i, light) {
    const pe = PE[i];
    if (!pe.base) {
      pe.base = document.createElement('div'); pe.base.className = 'base';
      pe.el.insertBefore(pe.base, pe.el.firstChild);
    }
    if (D.be.kind === 'hwp') {
      if (!pe.svgDone && !light) {
        pe.svgDone = true;
        let svg = null;
        try { svg = D.be.svg(i); } catch (e) { console.error(e); }
        pe.base.textContent = '';
        if (svg) pe.base.appendChild(svg);
        else pe.base.innerHTML = '<div class="loading">이 쪽을 그리지 못했습니다</div>';
      } else if (!pe.svgDone && !pe.base.firstChild) pe.base.innerHTML = '<div class="loading">불러오는 중</div>';
      return;
    }
    const s = fullScale(i);
    const q = Math.round(s * 20) / 20;
    if (!pe.canvas || Math.abs(pe.scale - q) / q > 0.1) {
      if (pe.want !== q) { pe.want = q; queue.add(i); }
    }
  }
  const queue = new Set();
  let active = 0;
  function pumpQueue() {
    if (!D.be || D.be.kind !== 'pdf') return;
    while (active < 2 && queue.size) {
      const center = currentPage();
      let best = -1;
      for (const i of queue) if (best < 0 || Math.abs(i - center) < Math.abs(best - center)) best = i;
      queue.delete(best);
      const pe = PE[best];
      if (!pe || !pe.want) continue;
      const scale = pe.want, be = D.be;
      const c = document.createElement('canvas');
      let task;
      try { task = be.render(best, c, scale); } catch (e) { continue; }
      if (pe.task) { try { pe.task.cancel(); } catch (e) { /* 무시 */ } }
      pe.task = task; active++;
      task.promise.then(() => {
        if (D.be !== be || pe.task !== task) return;
        pe.task = null;
        if (pe.canvas) pe.canvas.width = 0;
        pe.canvas = c; pe.scale = scale;
        if (pe.base) { pe.base.textContent = ''; pe.base.appendChild(c); }
      }, () => { /* 취소됨 */ }).finally(() => { active--; pumpQueue(); });
    }
  }
  function ensureDetail(i) {
    const pe = PE[i];
    const s = D.sizes[i];
    const want = V.z * DPR();
    const full = fullScale(i);
    if (want <= full * 1.15) { dropDetail(pe); return; }
    // 보이는 영역만 고해상도로
    const left = pageLeft(i), top = pageTop(i);
    let x0 = (V.sx - left) / V.z, y0 = (V.sy - top) / V.z, x1 = (V.sx + V.W - left) / V.z, y1 = (V.sy + V.H - top) / V.z;
    const mx = (x1 - x0) * 0.15, my = (y1 - y0) * 0.15;
    x0 = clamp(x0 - mx, 0, s.w); y0 = clamp(y0 - my, 0, s.h); x1 = clamp(x1 + mx, 0, s.w); y1 = clamp(y1 + my, 0, s.h);
    if (x1 - x0 < 1 || y1 - y0 < 1) { dropDetail(pe); return; }
    let sc = want;
    const area = (x1 - x0) * (y1 - y0) * sc * sc;
    if (area > MAXPX) sc = Math.sqrt(MAXPX / ((x1 - x0) * (y1 - y0)));
    const key = [sc.toFixed(3), x0.toFixed(0), y0.toFixed(0), x1.toFixed(0), y1.toFixed(0)].join(',');
    if (pe.detailKey === key) return;
    const reg = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
    if (pe.dtask) { try { pe.dtask.cancel(); } catch (e) { /* 무시 */ } }
    const c = document.createElement('canvas');
    c.className = 'detail';
    const be = D.be;
    const task = be.render(i, c, sc, reg);
    pe.dtask = task; pe.detailKey = key;
    task.promise.then(() => {
      if (D.be !== be || pe.dtask !== task) return;
      pe.dtask = null;
      c.style.left = reg.x * V.z + 'px'; c.style.top = reg.y * V.z + 'px';
      c.style.width = reg.w * V.z + 'px'; c.style.height = reg.h * V.z + 'px';
      c.dataset.z = V.z;
      if (pe.detail) { pe.detail.width = 0; pe.detail.remove(); }
      pe.detail = c;
      pe.el.insertBefore(c, pe.ink || null);
    }, () => { if (pe.detailKey === key) pe.detailKey = ''; });
  }
  function dropDetail(pe) {
    if (pe.dtask) { try { pe.dtask.cancel(); } catch (e) { /* 무시 */ } pe.dtask = null; }
    if (pe.detail) { pe.detail.width = 0; pe.detail.remove(); pe.detail = null; }
    pe.detailKey = '';
  }
  function unload(i) {
    const pe = PE[i];
    if (!pe.base && !pe.ink) return;
    if (pe.task) { try { pe.task.cancel(); } catch (e) { /* 무시 */ } pe.task = null; }
    queue.delete(i);
    dropDetail(pe);
    if (pe.canvas) { pe.canvas.width = 0; pe.canvas = null; }
    pe.scale = 0; pe.want = 0; pe.svgDone = false;
    if (pe.base) { pe.base.remove(); pe.base = null; }
    if (pe.ink && !(S.editor && S.editor.page === i)) { pe.ink.remove(); pe.ink = null; }
  }
  // 확대 후 이전 고해상도 조각 위치 보정
  function relayoutDetails() {
    for (const pe of PE) {

    document.querySelectorAll('[data-doctab]').forEach(t => t.setAttribute('aria-selected', String(t.dataset.doctab === name)));
    $('#doc-p-search').hidden = name !== 'search';
    $('#doc-p-notes').hidden = name !== 'notes';
    if (name === 'notes') renderNotes();
    if (name === 'search') setTimeout(() => $('#doc-q').focus(), 30);
  }
  document.querySelectorAll('[data-doctab]').forEach(t => t.addEventListener('click', () => showTab(t.dataset.doctab)));

  let searchT = 0, searchRun = 0;
  $('#doc-q').addEventListener('input', () => { clearTimeout(searchT); searchT = setTimeout(runSearch, 250); });
  $('#doc-q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { clearTimeout(searchT); runSearch(); } e.stopPropagation(); });
  async function runSearch() {
    const q = $('#doc-q').value.trim();
    const meta = $('#doc-q-meta'), box = $('#doc-q-hits');
    const run = ++searchRun;
    if (!q) { meta.textContent = ''; box.textContent = ''; D.found = null; redrawFound(); return; }
    if (!D.text) D.text = new Array(D.n);
    const be = D.be;
    for (let i = 0; i < D.n; i++) {
      if (!D.text[i]) {
        if ((i & 3) === 0) meta.textContent = `쪽 ${i + 1} / ${D.n} 읽는 중`;
        try { D.text[i] = await be.text(i); } catch (e) { D.text[i] = []; }
        if (run !== searchRun || D.be !== be) return;
      }
    }
    const ql = q.toLowerCase(), hits = [];
    for (let i = 0; i < D.n; i++) {
      for (const r of D.text[i]) {
        const low = r.str.toLowerCase();
        let at = low.indexOf(ql);
        while (at >= 0) {
          let x0, x1;
          if (r.cx && r.cx.length > r.str.length - 1) { x0 = r.x + (r.cx[at] || 0); x1 = r.x + (r.cx[at + ql.length] !== undefined ? r.cx[at + ql.length] : r.w); }
          else { x0 = r.x + r.w * at / r.str.length; x1 = r.x + r.w * (at + ql.length) / r.str.length; }
          const rect = r.horiz ? { x: x0, y: r.y, w: Math.max(2, x1 - x0), h: r.h } : { x: r.x, y: r.y, w: r.w, h: r.h };
          hits.push({ i, rect, str: r.str, at });
          at = low.indexOf(ql, at + Math.max(1, ql.length));
          if (hits.length > 2000) break;
        }
      }
    }
    D.found = { q, hits, cur: -1 };
    meta.textContent = hits.length ? `${hits.length.toLocaleString('ko-KR')}건 찾음` : '찾는 글자가 없습니다.';
    box.innerHTML = hits.slice(0, 400).map((h, k) => {
      const s = h.str, a = Math.max(0, h.at - 24), b = Math.min(s.length, h.at + q.length + 40);
      const snip = (a > 0 ? '…' : '') + esc(s.slice(a, h.at)) + '<mark>' + esc(s.substr(h.at, q.length)) + '</mark>' + esc(s.slice(h.at + q.length, b)) + (b < s.length ? '…' : '');
      return `<button class="hit" type="button" data-k="${k}"><span>${snip}</span><span class="l">${h.i + 1}쪽</span></button>`;
    }).join('');
    redrawFound();
  }
  $('#doc-q-hits').addEventListener('click', (e) => {
    const b = e.target.closest('[data-k]'); if (!b || !D.found) return;
    const h = D.found.hits[+b.dataset.k];
    D.found.cur = +b.dataset.k;
    if (V.z < 1.3) setZoom(Math.max(V.z, 1.3));
    goRect(h.i, h.rect);
    redrawFound();
    if (overlayDrawer()) openDrawer(false);
  });
  function redrawFound() { for (let i = 0; i < PE.length; i++) drawFound(i); }
  function drawFound(i) {
    const pe = PE[i]; if (!pe || !pe.foundG) return;
    pe.foundG.textContent = '';
    if (!D.found) return;
    D.found.hits.forEach((h, k) => {
      if (h.i !== i) return;
      pe.foundG.appendChild(mk('rect', { class: 'found' + (k === D.found.cur ? ' cur' : ''), x: h.rect.x - 1, y: h.rect.y - 1, width: h.rect.w + 2, height: h.rect.h + 2, rx: 1.5 }));
    });
  }

  let confirmClear = false;
  function renderNotes() {
    const box = $('#doc-p-notes');
    if (!D.annots.length) { box.innerHTML = '<p class="empty">아직 필기가 없습니다. 위 도구줄에서 펜이나 글자를 골라 문서에 적어 보세요.</p>'; return; }
    const by = new Map();
    for (const a of D.annots) { if (!by.has(a.p)) by.set(a.p, []); by.get(a.p).push(a); }
    let h = '';
    for (const p of [...by.keys()].sort((x, y) => x - y)) {
      h += `<div class="ph">${p + 1}쪽 · ${by.get(p).length}개</div>`;
      for (const a of by.get(p)) {
        const t = a.t === 'text' ? esc(a.text.replace(/\n/g, ' ')) : a.chk ? '체크' : TYPE_KO[a.t];
        h += `<button class="hit" type="button" data-id="${a.id}" style="grid-template-columns:20px minmax(0,1fr);align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:50%;background:${a.c}"></span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t}</span></button>`;
      }
    }
    h += confirmClear
      ? `<div class="card" style="padding:12px;display:grid;gap:8px"><span>이 문서의 필기 ${D.annots.length}개를 모두 지울까요? 실행 취소로 되돌릴 수 있습니다.</span><div class="acts"><button class="btn sm" type="button" data-clr="no">그대로 두기</button><button class="btn sm danger-fill" type="button" data-clr="yes">모두 지우기</button></div></div>`
      : '<button class="linkbtn danger" type="button" data-clr="ask">이 문서의 필기 모두 지우기</button>';
    box.innerHTML = h;
  }
  $('#doc-p-notes').addEventListener('click', (e) => {
    const c = e.target.closest('[data-clr]');
    if (c) {
      if (c.dataset.clr === 'ask') confirmClear = true;
      else if (c.dataset.clr === 'no') confirmClear = false;
      else { confirmClear = false; doOp({ k: 'del', as: D.annots.slice() }); }
      renderNotes();
      return;
    }
    const b = e.target.closest('[data-id]'); if (!b) return;
    const a = D.annots.find(x => x.id === b.dataset.id); if (!a) return;
    goRect(a.p, annBox(a));
    setTool('select');
    S.sel = a.id; requestAnimationFrame(() => { renderPass(); drawSel(); });
    if (overlayDrawer()) openDrawer(false);
  });

  // ---------------- 필기 저장 (이 기기) ----------------
  let saveT = 0;
  function saveSoon(silent) {
    if (!D.key) return;
    if (!silent) setSaveState('busy');
    clearTimeout(saveT);
    saveT = setTimeout(saveNow, 700);
  }
  async function saveNow() {
    if (!D.key) return;
    try {
      await App.DB.put('docmeta', { key: D.key, annots: D.annots, lastPage: currentPage(), updatedAt: Date.now() });
      setSaveState('ok');
    } catch (e) { setSaveState('off'); }
  }
  function setSaveState(st) {
    const el = $('#doc-save'); if (!el) return;
    el.querySelector('.dot').style.background = st === 'busy' ? '#C98A00' : st === 'off' ? '#8A92A3' : '';
    const where = App.pc ? '필기를 이 PC에' : '이 기기에';
    el.querySelector('.t').textContent = st === 'busy' ? '저장 중' : st === 'off' ? where + ' 저장할 수 없음' : `${where} 저장됨 ${App.hm(Date.now())}`;
  }

  // ---------------- 열기 ----------------
  function kindOf(name, bytes) {
    const b = bytes;
    if (b[0] === 0x25 && b[1] === 0x50 && b[2] === 0x44 && b[3] === 0x46) return 'pdf';
    if (b[0] === 0xD0 && b[1] === 0xCF && b[2] === 0x11 && b[3] === 0xE0) return 'hwp';
    if (b[0] === 0x50 && b[1] === 0x4B && /\.hwpx$/i.test(name)) return 'hwp';
    if (/\.pdf$/i.test(name)) return 'pdf';
    if (/\.hwpx?$/i.test(name)) return 'hwp';
    return null;
  }
  async function open(bytes, rec) {
    const name = rec.name;
    const kind = kindOf(name, bytes);
    if (!kind) { busy(false); toast('PDF 또는 한글(HWP·HWPX) 파일만 열 수 있습니다.', true); return; }
    commitEditor();
    busy(true, '문서 여는 중', 0.05, name);
    await tick();
    let be;
    try {
      if (kind === 'pdf') be = await openPdf(bytes, (f) => busy(true, 'PDF 여는 중', 0.1 + f * 0.8, name));
      else be = await openHwp(bytes, (f) => busy(true, '한글 문서 배치 중', 0.5 + f * 0.4, name));
    } catch (e) {
      console.error(e);
      busy(false);
      if (e && e.message === 'cancel') { App.go('home'); return; }
      let msg = e && e.message ? e.message : String(e);
      if (kind === 'hwp' && /import|module|fetch|wasm|WebAssembly|Failed/i.test(msg)) msg = navigator.onLine === false ? '한글 문서 엔진을 아직 받지 못했습니다. Wi-Fi에 연결한 뒤 다시 열어 주세요.' : '한글 문서 엔진을 불러오지 못했습니다. 한글에서 PDF로 저장해 넣어 주세요.';
      else if (kind === 'pdf' && /Invalid PDF|InvalidPDF/i.test(msg)) msg = '손상되었거나 PDF가 아닌 파일입니다.';
      toast(msg, true);
      if (!D.be) App.go('home');
      return;
    }
    if (!be.n) { busy(false); toast('페이지가 없는 문서입니다.', true); return; }
    if (D.be) { clearTimeout(saveT); if (D.key) await saveNow(); D.be.destroy(); }
    const key = rec.sha;
    let meta = null;
    try { meta = await App.DB.get('docmeta', key); } catch (e) { meta = null; }
    Object.assign(D, { be, n: be.n, sizes: be.sizes, name, key, kind: be.kind, size: bytes.length, rec, bytes: kind === 'pdf' ? bytes : null, text: null, found: null });
    D.annots = meta && Array.isArray(meta.annots) ? meta.annots : (rec.sample && kind === 'pdf' ? seedSample() : []);
    hist.undo = []; hist.redo = []; histUI();
    S.sel = null;
    queue.clear(); active = 0;
    computeLayout();
    buildPages();
    measureStage();
    V.z = clamp((V.W - 2 * PAD) / D.maxW, 0.2, 2.5); V.auto = true;
    layout();
    V.sx = 0; V.sy = 0;
    if (meta && meta.lastPage) V.sy = pageTop(clamp(meta.lastPage, 0, D.n - 1)) - PAD / 2;
    clampScroll();
    lastPageShown = -1;
    $('#doc-total').textContent = '/ ' + D.n + '쪽';
    $('#doc-name').textContent = name;
    const ext = App.extOf(name).toUpperCase();
    $('#doc-meta').innerHTML = `<span class="chip ${kind === 'pdf' ? 'red' : 'hwp'}">${ext}</span>${rec.trade ? `<span class="chip">${esc(rec.trade)}</span>` : ''}${rec.sample ? '<span class="chip warn">예시</span>' : ''}<span>${D.n}쪽</span><span id="doc-save" style="display:inline-flex;align-items:center;gap:6px"><span class="dot"></span><span class="t"></span></span>`;
    $('#doc-q').value = ''; $('#doc-q-meta').textContent = ''; $('#doc-q-hits').textContent = '';
    buildThumbs();
    annotsChanged();
    viewChanged(true);
    renderPass();
    busy(false);
    setSaveState('ok');
    if (!meta) saveSoon();
    else if (meta.annots && meta.annots.length && !rec.sample) toast(`${App.pc ? '이 PC' : '이 기기'}에 저장된 필기 ${meta.annots.length}개를 불러왔습니다.`);
  }

  // ---------------- PDF로 저장 ----------------
  const hexRgb = (h) => { const v = parseInt(h.slice(1), 16); return [((v >> 16) & 255) / 255, ((v >> 8) & 255) / 255, (v & 255) / 255]; };
  async function drawAnnotsPdf(pdfDoc, page, list, map, font) {
    const { rgb, LineCapStyle, BlendMode, degrees } = window.PDFLib;
    const toPath = (poly, close) => 'M' + poly.map(p => { const u = map(p[0], p[1]); return u[0].toFixed(3) + ' ' + (-u[1]).toFixed(3); }).join(' L') + (close ? ' Z' : '');
    for (const a of list) {
      const col = rgb(...hexRgb(a.c));
      const stroke = { x: 0, y: 0, borderColor: col, borderWidth: a.w, borderLineCap: LineCapStyle.Round };
      switch (a.t) {
        case 'pen': page.drawSvgPath(toPath(penOutline(a.pts, a.w), true), { x: 0, y: 0, color: col, borderWidth: 0 }); break;
        case 'hl': page.drawSvgPath(toPath(linePts(a.pts)), Object.assign({}, stroke, { borderOpacity: 0.42, blendMode: BlendMode.Multiply })); break;
        case 'line': page.drawSvgPath(toPath([[a.x1, a.y1], [a.x2, a.y2]]), stroke); break;
        case 'arrow': { const g = arrowGeom(a); page.drawSvgPath(toPath(g.shaft), stroke); page.drawSvgPath(toPath(g.head, true), { x: 0, y: 0, color: col, borderColor: col, borderWidth: a.w * 0.6 }); break; }
        case 'rect': page.drawSvgPath(toPath(rectPoly(a), true), stroke); break;
        case 'ellipse': page.drawSvgPath(toPath(ellipsePoly(a, 72), true), stroke); break;
        case 'text': {
          const lines = (a.text || '').split('\n');
          const o = map(0, 0), u = map(1, 0);
          const ang = Math.atan2(u[1] - o[1], u[0] - o[0]) * 180 / Math.PI;
          lines.forEach((l, j) => {
            if (!l) return;
            const p = map(a.x, a.y + a.s * 0.88 + j * a.s * 1.3);
            page.drawText(l, { x: p[0], y: p[1], size: a.s, font, color: col, rotate: degrees(ang) });
          });
          break;
        }
      }
    }
  }
  async function buildVector(font, pdfDoc) {
    const pages = pdfDoc.getPages();
    if (pages.length !== D.n) throw new Error('page mismatch');
    const byPage = new Map();
    for (const a of D.annots) { if (!byPage.has(a.p)) byPage.set(a.p, []); byPage.get(a.p).push(a); }
    let k = 0;
    for (const [p, list] of byPage) {
      busy(true, 'PDF 만드는 중', 0.2 + 0.7 * (k++ / byPage.size), `${p + 1}쪽에 필기 넣는 중`);
      await drawAnnotsPdf(pdfDoc, pages[p], list, D.be.mapper(p), font);
    }
    return pdfDoc.save();
  }
  async function buildRaster(font, pdfDoc) {
    for (let i = 0; i < D.n; i++) {
      busy(true, 'PDF 만드는 중', 0.1 + 0.85 * i / D.n, `${i + 1} / ${D.n}쪽`);
      const s = D.sizes[i];
      const c = await D.be.canvasFor(i, Math.min(2.2, Math.sqrt(MAXPX / (s.w * s.h))));
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.86));
      c.width = 0;
      const img = await pdfDoc.embedJpg(new Uint8Array(await blob.arrayBuffer()));
      const page = pdfDoc.addPage([s.w, s.h]);
      page.drawImage(img, { x: 0, y: 0, width: s.w, height: s.h });
      const list = D.annots.filter(a => a.p === i);
      if (list.length) await drawAnnotsPdf(pdfDoc, page, list, (x, y) => [x, s.h - y], font);
      await tick();
    }
    return pdfDoc.save();
  }
  async function exportPdf() {
    if (!D.be) return;
    commitEditor();
    busy(true, 'PDF 만드는 중', 0.05, '');
    let bytes;
    try {
      await App.loadPdfLib();
      const { PDFDocument } = window.PDFLib;
      const fontBytes = D.annots.some(a => a.t === 'text') ? await App.engine('NotoSansKR-Field.ttf') : null;
      const prepare = async (doc) => { doc.registerFontkit(window.fontkit); return fontBytes ? doc.embedFont(fontBytes.slice(0), { subset: true }) : null; };
      if (D.kind === 'pdf') {
        try {
          const doc = await PDFDocument.load(D.bytes, { ignoreEncryption: true, updateMetadata: false });
          bytes = await buildVector(await prepare(doc), doc);
        } catch (e) {
          console.warn('원본 위에 그리기 실패, 이미지로 저장', e);
          const doc = await PDFDocument.create();
          bytes = await buildRaster(await prepare(doc), doc);
        }
      } else {
        const doc = await PDFDocument.create();
        bytes = await buildRaster(await prepare(doc), doc);
      }
    } catch (e) {
      console.error(e); busy(false);
      toast(navigator.onLine === false && !window.PDFLib ? 'PDF 만들기 도구를 아직 받지 못했습니다. Wi-Fi에 연결한 뒤 다시 눌러 주세요.' : 'PDF를 만들지 못했습니다: ' + (e && e.message ? e.message : e), true);
      return;
    }
    busy(false);
    const base = D.name.replace(/\.(pdf|hwpx?)$/i, '').replace(/\s*\(예시\)$/, '');
    const rec = App.files.find(x => x.id === App.current.doc);
    await App.save(base + (D.annots.length ? '_필기' : '') + '.pdf', new Blob([bytes], { type: 'application/pdf' }), { kind: D.annots.length ? 'markup' : 'doc', trade: rec ? rec.trade : '' });
  }
  $('#doc-export').addEventListener('click', exportPdf);

  // ---------------- 시작 ----------------
  function onResize() {
    if (App.view !== 'doc') return;
    const r = stage.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return;
    const oldW = V.W;
    measureStage();
    if (!D.n) return;
    if (V.auto) fitWidth(true);
    else { layout(); clampScroll(); viewChanged(true); }
    if (Math.abs(oldW - V.W) > 1) placeFloat();
  }
  new ResizeObserver(() => onResize()).observe(stage);
  window.addEventListener('beforeunload', () => { if (D.key) saveNow(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && D.key) saveNow(); });
  narrowQ.addEventListener('change', () => { if (narrowQ.matches && !$('#doc-drawer').hidden) openDrawer(false); });

  setTool(S.tool);
  fingerUI();

  function seedSample() {
    // 예시 필기: 체크 표시, 형광펜, 메모
    const check = (cx, cy) => {
      const ctrl = [[cx - 4.6, cy - 0.6, 0.35], [cx - 1.4, cy + 3.6, 0.6], [cx + 6, cy - 6.4, 0.3]];
      const pts = [];
      for (let s = 0; s < 2; s++) {
        const a = ctrl[s], b = ctrl[s + 1];
        for (let k = (s ? 1 : 0); k <= 8; k++) { const t = k / 8; pts.push(f2(a[0] + (b[0] - a[0]) * t), f2(a[1] + (b[1] - a[1]) * t), a[2] + (b[2] - a[2]) * t); }
      }
      return { id: newId(), p: 0, t: 'pen', c: '#1F5FD1', w: 1.6, pts };
    };
    return [
      check(325.7, 226.4), check(325.7, 259.4), check(325.7, 286.4), check(371.6, 313.4),
      { id: newId(), p: 0, t: 'hl', c: '#FFD43B', w: 11, pts: [73, 313, 0.5, 232, 313, 0.5] },
      { id: newId(), p: 0, t: 'text', c: '#D92D20', s: 8, x: 446, y: 302.5, text: 'B동 3층 일부 미착용\n금일 중 조치 요청' }
    ];
  }

  // 근거로 열기: 그 쪽으로 가고, 찾는 말이 그 쪽에 있으면 표시
  async function jump(o) {
    o = o || {};
    if (!D.n) return;
    const pg = Math.max(1, Math.min(D.n, +o.page || 1)) - 1;
    goPage(pg);
    const qq = String(o.q || '').trim();
    const words = qq.split(/\s+/).filter(w => w.length >= 2).sort((a, b) => b.length - a.length);
    if (!words.length || !D.be || !D.be.text) return;
    openDrawer(true, 'search');
    const tries = (/\s/.test(qq) && qq.length <= 40 ? [qq] : []).concat(words.slice(0, 3)); // 말 그대로 먼저, 없으면 긴 낱말부터
    for (const w of tries) {
      $('#doc-q').value = w;
      await runSearch();
      const hits = D.found ? D.found.hits : [];
      let k = hits.findIndex(h => h.i === pg);
      if (k < 0 && !o.page) k = 0;
      if (k >= 0) { D.found.cur = k; if (V.z < 1.3) setZoom(Math.max(V.z, 1.3)); goRect(hits[k].i, hits[k].rect); redrawFound(); return; }
    }
    goPage(pg);
  }

  App.views.doc = {
    open, jump,
    show() { requestAnimationFrame(onResize); },
    hide() { commitEditor(); if (D.key) saveNow(); P.clear(); G = null; },
    state: { S, V, D }, exportPdf, setTool, setZoom, undo, redo
  };
})();

/* PDF 만들기: 사진대지 · 회의록 (pdf-lib + 한글 글꼴 내장) */
(function () {
  'use strict';
  const App = window.App;
  const A4 = [595.28, 841.89];
  const M = 40;
  const NAVY = [16 / 255, 32 / 255, 121 / 255], RED = [214 / 255, 7 / 255, 28 / 255];
  const INK = [0.08, 0.1, 0.18], MUTED = [0.36, 0.38, 0.44], LINE = [0.72, 0.75, 0.8], FILL = [0.95, 0.96, 0.98];

  async function begin() {
    await App.loadPdfLib();
    const L = window.PDFLib;
    const doc = await L.PDFDocument.create();
    doc.registerFontkit(window.fontkit);
    const fontBytes = await App.engine('NotoSansKR-Field.ttf');
    const font = await doc.embedFont(fontBytes.slice(0), { subset: true });
    let logo = null;
    try { logo = await doc.embedPng((await App.engine('logo.png')).slice(0)); } catch (e) { logo = null; }
    const c = (a) => L.rgb(a[0], a[1], a[2]);
    // 줄바꿈: 공백에서 먼저 끊고, 한 단어가 너무 길면 글자 단위로 끊는다
    function wrap(text, size, width) {
      const W = (s) => font.widthOfTextAtSize(s, size);
      const out = [];
      for (const para of String(text == null ? '' : text).split('\n')) {
        const toks = para.match(/\s+|[^\s]+/g) || [''];
        let cur = '';
        for (const tk of toks) {
          if (W(cur + tk) <= width) { cur += tk; continue; }
          if (/^\s+$/.test(tk)) { out.push(cur); cur = ''; continue; }
          if (cur.trim()) { out.push(cur.replace(/\s+$/, '')); cur = ''; }
          if (W(tk) <= width) { cur = tk; continue; }
          for (const ch of tk) { if (W(cur + ch) > width && cur) { out.push(cur); cur = ''; } cur += ch; }
        }
        out.push(cur.replace(/\s+$/, ''));
      }
      return out;
    }
    function text(page, s, x, y, size, color, bold) {
      if (!s) return;
      if (bold) page.pushOperators(L.pushGraphicsState(), L.setTextRenderingMode(L.TextRenderingMode.FillAndOutline), L.setLineWidth(size * 0.035), L.setStrokingColor(c(color || INK)));
      page.drawText(s, { x, y, size, font, color: c(color || INK) });
      if (bold) page.pushOperators(L.popGraphicsState());
    }
    const width = (s, size) => font.widthOfTextAtSize(s, size);
    function rect(page, x, y, w, h, o) {
      page.drawRectangle({ x, y, width: w, height: h, color: o.fill ? c(o.fill) : undefined, borderColor: o.border ? c(o.border) : undefined, borderWidth: o.border ? (o.bw || 0.6) : 0 });
    }
    function header(page, title, site, sub) {
      const [W, H] = A4;
      const top = H - M;
      if (logo) {
        const lh = 20, lw = logo.width / logo.height * lh;
        page.drawImage(logo, { x: M, y: top - lh, width: lw, height: lh });
      }
      const ts = 17;
      text(page, title, (W - width(title, ts)) / 2, top - 17, ts, INK, true);
      const rs = 8.5;
      const r1 = site || '';
      if (r1) text(page, r1, W - M - width(r1, rs), top - 9, rs, MUTED);
      if (sub) text(page, sub, W - M - width(sub, rs), top - 21, rs, MUTED);
      page.drawLine({ start: { x: M, y: top - 30 }, end: { x: W - M, y: top - 30 }, thickness: 1.6, color: c(NAVY) });
      return top - 44;
    }
    function footer(page, n, total, site) {
      const [W] = A4;
      const s = 8;
      const left = '무영씨엠건축사사무소' + (site ? ' · ' + site : '');
      text(page, left, M, 22, s, MUTED);
      const r = `${n} / ${total}`;
      text(page, r, W - M - width(r, s), 22, s, MUTED);
    }
    return { L, doc, font, logo, c, wrap, text, width, rect, header, footer };
  }

  async function shrinkJpeg(blob, maxSide, q) {
    let bmp;
    try { bmp = await createImageBitmap(blob); }
    catch (e) {
      bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(blob); });
    }
    const w0 = bmp.width, h0 = bmp.height, k = Math.min(1, maxSide / Math.max(w0, h0));
    const cv = document.createElement('canvas');
    cv.width = Math.round(w0 * k); cv.height = Math.round(h0 * k);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    if (bmp.close) bmp.close();
    const out = await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
    cv.width = 0;
    return { bytes: new Uint8Array(await out.arrayBuffer()), w: Math.round(w0 * k), h: Math.round(h0 * k) };
  }

  // 사진대지: 한 쪽에 두 장, 사진 아래 공종·위치·일시·내용 표
  async function photoSheet(photos, opts) {
    const P = await begin();
    const { doc, text, rect, wrap, width } = P;
    const [W] = A4;
    const site = opts.site || '';
    const per = 2, pages = Math.max(1, Math.ceil(photos.length / per));
    const blockH = 352, gapY = 14;
    const lw = 52, tw = W - 2 * M;
    for (let pi = 0; pi < pages; pi++) {
      const page = doc.addPage(A4);
      let y = P.header(page, opts.title || '현장 사진대지', site, opts.range || '');
      for (let k = 0; k < per; k++) {
        const idx = pi * per + k;
        const ph = photos[idx];
        if (!ph) break;
        App.busy(true, '사진대지 만드는 중', 0.05 + 0.9 * idx / photos.length, `${idx + 1} / ${photos.length}장`);
        const top = y - k * (blockH + gapY);
        const imgH = 238;
        // 사진 칸
        rect(page, M, top - imgH, tw, imgH, { fill: [0.93, 0.94, 0.96], border: LINE });
        const blob = ph.blob || await App.DB.get('blobs', 'ph:' + ph.id + ':full');
        if (blob) {
          const j = await shrinkJpeg(blob, 1700, 0.82);
          const img = await doc.embedJpg(j.bytes);
          const s = Math.min((tw - 8) / j.w, (imgH - 8) / j.h);
          const iw = j.w * s, ih = j.h * s;
          page.drawImage(img, { x: M + (tw - iw) / 2, y: top - imgH + (imgH - ih) / 2, width: iw, height: ih });
        }
        // 번호
        const no = String(idx + 1);
        rect(page, M, top - 18, 26, 18, { fill: NAVY });
        text(page, no, M + 13 - width(no, 9) / 2, top - 13, 9, [1, 1, 1], true);
        // 표
        let ty = top - imgH;
        const rowH = 22, fs = 9.5;
        const row = (cells) => {
          let x = M;
          for (const cl of cells) {
            rect(page, x, ty - rowH, cl.w, rowH, { fill: cl.label ? FILL : null, border: LINE });
            const s = cl.text || '';
            const lines = wrap(s, fs, cl.w - 12);
            text(page, lines[0] + (lines.length > 1 ? '…' : ''), cl.label ? x + (cl.w - width(s, fs)) / 2 : x + 6, ty - 15, fs, cl.label ? MUTED : INK, false);
            x += cl.w;
          }
          ty -= rowH;
        };
        const loc = [ph.dong, ph.floor, ph.part].filter(Boolean).join(' ') || '–';
        const half = (tw - 2 * lw) / 2;
        row([{ label: true, w: lw, text: '공종' }, { w: half, text: ph.trade || '–' }, { label: true, w: lw, text: '일시' }, { w: half, text: App.dateKo(ph.takenAt) + ' ' + App.hm(ph.takenAt) }]);
        row([{ label: true, w: lw, text: '위치' }, { w: tw - lw, text: loc }]);
        const memoLines = wrap(ph.memo || '', fs, tw - lw - 12).slice(0, 3);
        const mh = Math.max(rowH, 8 + memoLines.length * 14);
        rect(page, M, ty - mh, lw, mh, { fill: FILL, border: LINE });
        rect(page, M + lw, ty - mh, tw - lw, mh, { border: LINE });
        text(page, '내용', M + (lw - width('내용', fs)) / 2, ty - 15, fs, MUTED);
        memoLines.forEach((l, j) => text(page, l, M + lw + 6, ty - 15 - j * 14, fs, INK));
        if (!memoLines.length || !memoLines[0]) text(page, '–', M + lw + 6, ty - 15, fs, MUTED);
      }
      P.footer(page, pi + 1, pages, site);
    }
    return doc.save();
  }

  // 회의록: 개요 표 → 결정 사항 → 할 일 → 다음 회의 → 회의 기록

    dec.forEach((s, i) => {

    });

    heading('2. 할 일');
    const todos = (sm.todos || []).filter(t => t && (t.task || '').trim());
    const cols = [{ k: 'task', t: '내용', w: tw - 96 - 70 - 56 }, { k: 'owner', t: '담당', w: 96 }, { k: 'due', t: '기한', w: 70 }, { k: 'st', t: '상태', w: 56 }];
    if (!todos.length) { need(lh); text(page, '정리된 할 일이 없습니다.', M + 6, y - 10, fs, MUTED); y -= lh + 4; }
    else {
      need(24 + 24);
      let x = M;
      for (const cl of cols) { rect(page, x, y - 22, cl.w, 22, { fill: FILL, border: LINE }); text(page, cl.t, x + (cl.w - width(cl.t, fs)) / 2, y - 15, fs, MUTED); x += cl.w; }
      y -= 22;
      const ST = ['대기', '진행 중', '완료'];
      for (const t of todos) {
        const vals = { task: t.task || '', owner: t.owner || '', due: t.due || '', st: ST[t.st || 0] };
        const wrapped = cols.map(cl => wrap(vals[cl.k], fs, cl.w - 10));
        const h = Math.max(22, 8 + Math.max(...wrapped.map(w => w.length)) * lh);
        need(h);
        x = M;
        cols.forEach((cl, ci) => {
          rect(page, x, y - h, cl.w, h, { border: LINE });
          wrapped[ci].forEach((l, j) => text(page, l, ci === 0 ? x + 5 : x + (cl.w - width(l, fs)) / 2, y - 15 - j * lh, fs, INK));
          x += cl.w;

    y -= 16;
    heading('3. 다음 회의');

    text(page, (sm.next || '').trim() || '정해지지 않음', M + 6, y - 10, fs, (sm.next || '').trim() ? INK : MUTED);
    y -= lh + 14;
    const lines = (m.lines || []).filter(l => l.text && l.text.trim());
    if (lines.length && opts.withTranscript !== false) {
      heading('4. 회의 기록');
      for (const l of lines) {
        const who = [l.who, l.at].filter(Boolean).join(' · ');
        const body = wrap(l.text, 9.5, tw - 12);

        if (who) { text(page, who, M + 6, y - 10, 8.5, NAVY, true); y -= 13; }
        body.forEach((b, j) => text(page, b, M + 6, y - 10 - j * 14, 9.5, INK));

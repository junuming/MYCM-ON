<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MYCM-ON</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#102079"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MYCM-ON"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="format-detection" content="telephone=no"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>MYCM-ON</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts.css">
<style>
  /* 레이아웃: 태블릿 가로 한 화면 앱. 화면마다 위쪽 막대 + 아래 작업 영역(왼쪽 목록 · 가운데 내용 · 오른쪽 패널). 900px 아래에서는 옆 패널이 겹쳐 열린다.
     현장 햇빛 아래에서 읽히도록 밝은 화면 하나로 고정한다 (도면 캔버스만 어두운 바탕). */
  :root {
    --navy: #102079;
    --navy-ink: #0B1757;
    --navy-soft: #ECEEF7;
    --red: #D6071C;
    --red-ink: #A8061A;
    --red-soft: #FCE8EA;
    --ci-gray: #969697;
    --bg: #F3F5F9;
    --surface: #FFFFFF;
    --surface-2: #F6F7FB;
    --line: #DCE1EA;
    --line-2: #EEF1F6;
    --ink: #141A2E;
    --ink-2: #3A4152;
    --muted: #5B6170;
    --faint: #8A92A3;
    --ok: #1D6B3A;
    --ok-soft: #E8F3EC;
    --warn: #7A4F00;
    --warn-soft: #FFF1D1;
    --hwp: #1A5D9C;
    --hwp-soft: #E3EEFA;
    --cad-bg: #0E1420;
    --shadow: 0 1px 2px rgba(16, 24, 48, .10), 0 8px 24px rgba(16, 24, 48, .12);
    --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
    --font-doc: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --r: 12px;
    --gutter-l: max(20px, env(safe-area-inset-left, 0px));
    --gutter-r: max(20px, env(safe-area-inset-right, 0px));
    color-scheme: light;
  }
  html { height: 100%; box-sizing: border-box; -webkit-text-size-adjust: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font-ui); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  button:disabled { cursor: default; opacity: .45; }
  :focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  h1, h2, h3 { text-wrap: balance; }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .grow { flex: 1 1 auto; min-width: 0; }
  svg { flex: none; }

  .app { height: 100%; position: relative; }
  .view { height: 100%; display: flex; flex-direction: column; min-height: 0; }

  /* 공통 막대 */
  .bar { flex: none; min-height: 68px; display: flex; align-items: center; gap: 14px; background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 8px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); min-width: 0; }
  .bar.tall { min-height: 76px; }
  .home-btn { height: 48px; padding: 0 14px 0 8px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; color: var(--navy); flex: none; }
  .home-btn img { width: 32px; height: 32px; display: block; }
  .home-btn:hover { background: var(--surface-2); }
  .titleblock { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .titleblock h1 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.25; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .titleblock .sub { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; }

  .btn { min-height: 52px; padding: 0 18px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600; color: var(--navy); white-space: nowrap; flex: none; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--navy); border-color: var(--navy); color: #FFFFFF; }
  .btn.primary:hover { background: var(--navy-ink); }
  .btn.danger { color: var(--red-ink); }
  .btn.danger-fill { background: var(--red); border-color: var(--red); color: #FFFFFF; }
  .btn.sm { min-height: 44px; padding: 0 14px; font-size: 15px; }
  .btn.icon { width: 52px; padding: 0; }
  .btn.sm.icon { width: 44px; }
  .btn[aria-pressed="true"] { background: var(--navy-soft); border-color: var(--navy-soft); }
  .linkbtn { border: 0; background: none; padding: 8px 4px; color: var(--navy); font-weight: 600; font-size: 14.5px; }
  .linkbtn.danger { color: var(--red-ink); }

  .chip { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--navy-soft); color: var(--navy); white-space: nowrap; line-height: 20px; }
  .chip.gray { background: #ECEEF2; color: var(--ink-2); }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.red { background: var(--red-soft); color: var(--red-ink); }
  .chip.hwp { background: var(--hwp-soft); color: var(--hwp); }
  .badge { flex: none; width: 50px; height: 30px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; font-weight: 700; letter-spacing: .03em; }
  .badge.dwg, .badge.dxf { background: var(--navy); color: #FFFFFF; }
  .badge.pdf { background: var(--red-soft); color: var(--red-ink); }
  .badge.hwp, .badge.hwpx { background: var(--hwp-soft); color: var(--hwp); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; flex: none; }

  .pill { height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; flex: none; }
  .pill[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #FFFFFF; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }

  .seg { display: flex; padding: 4px; background: #E8EBF1; border-radius: var(--r); gap: 4px; flex: none; }
  .seg button { height: 44px; padding: 0 16px; border-radius: 9px; border: 0; background: transparent; font-size: 15px; font-weight: 500; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--navy); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
  .field { width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 0 12px; font-size: 16px; min-width: 0; }
  textarea.field { padding: 10px 12px; resize: none; line-height: 1.5; }
  .field:focus { outline: 2px solid var(--navy); outline-offset: -1px; background: var(--surface); }
  .lbl { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); min-width: 0; }
  .empty { color: var(--muted); font-size: 15px; padding: 14px 4px; }
  .empty-block { display: grid; justify-items: center; align-content: center; gap: 10px; text-align: center; color: var(--muted); padding: 28px 16px; }
  .empty-block b { color: var(--ink); font-size: 17px; }
  .scroll { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

  /* 홈 */
  .logo { height: 34px; width: auto; display: block; flex: none; }
  .vline { width: 1px; height: 36px; background: var(--line); flex: none; }
  .site-btn { min-height: 52px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); display: flex; align-items: center; gap: 12px; text-align: left; min-width: 0; max-width: 420px; }
  .site-btn .k { font-size: 12px; color: var(--muted); font-weight: 500; display: block; }
  .site-btn .v { font-size: 17px; font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .site-btn.unset .v { color: var(--red-ink); }
  .net { height: 40px; padding: 0 14px; border-radius: 999px; border: 0; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; background: var(--ok-soft); color: var(--ok); white-space: nowrap; flex: none; }
  .net .sub { font-weight: 400; opacity: .85; }
  .net.wait { background: var(--warn-soft); color: var(--warn); }
  .net.off { background: #E3E7EF; color: var(--ink-2); }
  .net.sync { cursor: pointer; }
  .net.sync.ok { background: var(--navy-soft); color: var(--navy); }
  .net.sync.up { background: var(--navy); color: #FFFFFF; }
  .net.sync.up svg { animation: syncup 1.2s ease-in-out infinite; }
  @keyframes syncup { 50% { transform: translateY(-2px); } }
  .sy-entry { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 72px; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); text-align: left; color: var(--ink); }
  .sy-entry .sy-ic { width: 44px; height: 44px; border-radius: 12px; background: var(--navy-soft); color: var(--navy); display: grid; place-items: center; flex: none; }
  .sy-entry .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .sy-entry .nm b { font-size: 16.5px; }
  .sy-entry .nm span { font-size: 14px; color: var(--muted); }
  .sy-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 18px; align-items: start; padding: 14px 16px; border-radius: 14px; background: var(--bg, #F3F5F9); }
  .sy-head #sy-state { font-size: 16px; line-height: 1.5; }
  .sy-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; background: var(--ok); vertical-align: 1px; }
  .sy-dot.up { background: var(--navy); } .sy-dot.wait { background: var(--warn); } .sy-dot.bad { background: var(--red); }
  .oblist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; padding: 2px 12px; }
  .obrow { display: flex; align-items: center; gap: 12px; min-height: 60px; border-bottom: 1px solid var(--line-2); }
  .obrow:last-child { border-bottom: 0; }
  .obrow .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .obrow .nm b { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .obrow .nm > span:not(.obbar) { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .obrow .obbar { height: 4px; border-radius: 2px; background: var(--line-2); overflow: hidden; margin-top: 4px; }
  .obrow .obbar i { display: block; height: 100%; background: var(--navy); transition: width .3s; }
  .obrow .st { font-size: 13.5px; color: var(--muted); white-space: nowrap; }
  .obrow .st.ok { color: var(--ok); } .obrow .st.bad { color: var(--red-ink); white-space: normal; max-width: 220px; text-align: right; }
  .sy-opt { display: flex; gap: 12px; align-items: flex-start; padding: 10px 2px; font-size: 15px; }
  .sy-opt input { width: 22px; height: 22px; accent-color: var(--navy); flex: none; margin-top: 1px; }
  .sy-opt span { display: flex; flex-direction: column; gap: 2px; }
  .sy-opt small { font-size: 13.5px; color: var(--muted); }
  .sy-more { border-top: 1px solid var(--line-2); padding-top: 10px; }
  .pcfind { display: flex; flex-direction: column; gap: 8px; }
  .qrscan { position: fixed; inset: 0; z-index: 200; background: #000; display: grid; place-items: center; }
  .qrscan video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .qrscan .qrframe { position: relative; width: min(62vmin, 420px); aspect-ratio: 1; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); border-radius: 18px; }
  .qrscan .qrframe i { position: absolute; width: 44px; height: 44px; border: 5px solid #FFFFFF; }
  .qrscan .qrframe i:nth-child(1) { left: -3px; top: -3px; border-right: 0; border-bottom: 0; border-top-left-radius: 18px; }
  .qrscan .qrframe i:nth-child(2) { right: -3px; top: -3px; border-left: 0; border-bottom: 0; border-top-right-radius: 18px; }
  .qrscan .qrframe i:nth-child(3) { left: -3px; bottom: -3px; border-right: 0; border-top: 0; border-bottom-left-radius: 18px; }
  .qrscan .qrframe i:nth-child(4) { right: -3px; bottom: -3px; border-left: 0; border-top: 0; border-bottom-right-radius: 18px; }
  .qrscan .qrtop { position: absolute; top: 28px; left: 0; right: 0; text-align: center; color: #FFFFFF; display: flex; flex-direction: column; gap: 4px; padding: 0 20px; }
  .qrscan .qrtop b { font-size: 20px; }
  .qrscan .qrtop span { font-size: 15px; opacity: .85; }
  .qrscan .qrbot { position: absolute; bottom: 32px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; }
  .pc-msg span:not(.spin) { flex: 1; }
  .pc-msg { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 12px; background: var(--bg); color: var(--ink-2); font-size: 14.5px; line-height: 1.55; }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--navy); animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pcitem { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 10px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); text-align: left; color: var(--ink); }
  .pcitem .pc-ic { width: 40px; height: 40px; border-radius: 10px; background: var(--navy-soft); color: var(--navy); display: grid; place-items: center; flex: none; }
  .pcitem .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .pcitem .nm b { font-size: 16px; }
  .pcitem .nm span { font-size: 13.5px; color: var(--muted); font-family: var(--font-mono); }
  .pcitem .pc-ok { font-size: 14px; font-weight: 700; color: var(--navy); }
  .pcitem[aria-pressed="true"] { border-color: var(--navy); background: var(--navy-soft); }
  .pcitem[aria-pressed="true"] .pc-ok::before { content: "✓ "; }
  .sy-more summary { font-weight: 600; color: var(--navy); cursor: pointer; padding: 6px 0; }
  .sy-more[open] { display: flex; flex-direction: column; gap: 4px; }
  @media (max-width: 900px) { .sy-head { grid-template-columns: minmax(0, 1fr); } }
  .net.bad { background: var(--red-soft); color: var(--red-ink); }
  .today { font-size: 16px; color: var(--ink-2); font-weight: 500; white-space: nowrap; flex: none; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--navy); color: #FFFFFF; display: grid; place-items: center; flex: none; font-weight: 700; font-size: 17px; }

  .home-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 392px; gap: 24px; padding-block: 14px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); overflow-y: auto; }
  .home-left { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .home-head h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  .home-head p { margin: 4px 0 0; font-size: 16px; color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 18px; flex: 1 0 auto; }
  .tile { min-height: 188px; padding: 22px 24px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: flex; flex-direction: column; gap: 8px; text-align: left; }
  .tile:hover { border-color: #C5CCDA; }
  .tile .ic { width: 56px; height: 56px; border-radius: 14px; background: var(--navy-soft); display: grid; place-items: center; color: var(--navy); }
  .tile .t { font-size: 24px; font-weight: 700; }
  .tile .d { font-size: 15px; color: var(--muted); }
  .tile .r { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--muted); min-width: 0; }
  .tile .r span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .r svg { color: var(--navy); }
  .tile.primary { background: var(--navy); border-color: var(--navy); color: #FFFFFF; }
  .tile.primary .ic { background: rgba(255,255,255,.14); color: #FFFFFF; }
  .tile.primary .d, .tile.primary .r { color: rgba(255,255,255,.84); }
  .tile.primary .r svg { color: #FFFFFF; }
  .quick { display: flex; gap: 14px; }
  .quick button { flex: 1; min-height: 64px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 600; color: var(--navy); }
  .quick .rec { width: 14px; height: 14px; border-radius: 50%; background: var(--red); }
  .home-right { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .recent { padding: 20px 20px 8px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .recent .pills { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 0 20px; }
  .recent .pills::-webkit-scrollbar { display: none; }
  .card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .card-h h2 { margin: 0; font-size: 19px; font-weight: 700; }
  .card-h .meta { font-size: 14px; color: var(--muted); }
  .frow { min-height: 62px; display: flex; align-items: center; gap: 12px; border: 0; border-bottom: 1px solid var(--line-2); background: none; text-align: left; padding: 0 2px; width: 100%; color: var(--ink); }
  .frow:last-child { border-bottom: 0; }
  .frow .nm { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
  .frow .nm b { font-size: 15.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frow .nm span { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .today-photos { padding: 16px 20px 16px; display: flex; flex-direction: column; gap: 12px; }
  .thumbs4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .thumb-sq { aspect-ratio: 1 / 1; max-width: 100%; border-radius: 10px; background: #DDE2EB; border: 0; padding: 0; overflow: hidden; display: grid; place-items: center; color: var(--muted); font-size: 11px; }
  .thumb-sq img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* 자료함 */
  .lib-body { flex: 1; min-height: 0; display: flex; }
  .sidenav { width: 188px; flex: none; background: var(--surface); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
  .sidenav .h { font-size: 13px; font-weight: 600; color: var(--muted); padding: 0 8px 4px; }
  .navbtn { min-height: 50px; padding: 0 12px; border-radius: 10px; border: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 16px; font-weight: 600; background: transparent; color: var(--ink-2); text-align: left; }
  .navbtn[aria-pressed="true"] { background: var(--navy); color: #FFFFFF; }
  .navbtn .n { font-variant-numeric: tabular-nums; opacity: .8; font-weight: 500; }
  .lib-main { flex: 1; min-width: 0; padding: 18px 20px; overflow-y: auto; }
  .lib-list { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 4px 16px; }
  .pick-head { display: flex; flex-direction: column; gap: 10px; }
  .pick-head .pills { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .pick-list { display: flex; flex-direction: column; min-height: 120px; }
  .pick-list .frow { min-height: 64px; padding: 0 6px; border-radius: 10px; }
  .pick-list .frow[aria-current="true"] { background: var(--navy-soft); }
  .pick-list .frow .now { font-size: 12.5px; font-weight: 700; color: var(--navy); white-space: nowrap; }
  .lrow { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line-2); }
  .lrow:last-child { border-bottom: 0; }
  .lrow .frow { border-bottom: 0; }

  /* 도면 */
  .cad-body { flex: 1; min-height: 0; display: flex; }

  .loupe .lt { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 1px 8px; border-radius: 999px; background: rgba(14,20,32,.88); color: #FFD594; font-size: 12.5px; font-weight: 600; white-space: nowrap; }

  .ptabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); flex: none; }
  .ptabs button { min-height: 50px; border: 0; background: none; font-size: 15px; font-weight: 500; color: var(--muted); border-bottom: 3px solid transparent; }
  .ptabs button[aria-selected="true"] { color: var(--navy); font-weight: 700; border-bottom-color: var(--navy); }
  .ppane { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 14px 18px; display: flex; flex-direction: column; gap: 8px; }
  .ppane .ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); padding: 0 2px 4px; }
  .layer { display: flex; align-items: center; gap: 4px; border-radius: 10px; background: var(--surface-2); }

  /* 문서 */

  .doc-tools::-webkit-scrollbar { display: none; }
  .ttool { min-height: 56px; min-width: 64px; padding: 0 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); font-size: 16px; font-weight: 600; color: var(--navy); flex: none; }
  .ttool[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #FFFFFF; }
  .tsep { width: 1px; height: 40px; background: var(--line); margin: 0 6px; flex: none; }
  .csw { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px #B8C0CF; margin: 0 2px; flex: none; padding: 0; }
  .csw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--navy); }
  .wbtn { width: 56px; height: 56px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; color: var(--ink); }
  .wbtn i { display: block; border-radius: 999px; background: currentColor; }
  .doc-body { flex: 1; min-height: 0; display: flex; position: relative; }
  .doc-rail { width: 132px; flex: none; background: var(--surface); border-right: 1px solid var(--line); padding: 16px 0; display: flex; flex-direction: column; align-items: center; gap: 16px; overflow-y: auto; overscroll-behavior: contain; }
  .pthumb { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); position: relative; }
  .pthumb .box { width: 84px; background: #FFFFFF; box-shadow: 0 0 0 1px var(--line); border-radius: 3px; overflow: hidden; display: grid; place-items: center; }
  .pthumb .box canvas { width: 100%; height: 100%; display: block; }
  .pthumb[aria-current="true"] { color: var(--navy); font-weight: 700; }
  .pthumb[aria-current="true"] .box { box-shadow: 0 0 0 2px var(--navy); }
  .pthumb .mk { position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px #FFFFFF; }
  .doc-stage { flex: 1; min-width: 0; position: relative; overflow: hidden; background: #D5DBE3; touch-action: none; -webkit-user-select: none; user-select: none; outline: none; }
  .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .dpage { position: absolute; background: #FFFFFF; box-shadow: 0 2px 10px rgba(16, 24, 32, .18); overflow: hidden; }
  .dpage .base, .dpage .base > canvas, .dpage .base > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .dpage .detail { position: absolute; display: block; pointer-events: none; }
  .dpage .ink { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .dpage .loading { position: absolute; inset: 0; display: grid; place-items: center; color: #9AA3AB; font-size: 13px; }
  .ink .hl-ann { mix-blend-mode: multiply; }
  .ink .found { fill: rgba(255, 196, 0, .38); mix-blend-mode: multiply; }
  .ink .found.cur { fill: rgba(255, 140, 0, .5); }
  .ink .selbox { fill: none; stroke: var(--navy); stroke-width: 1.5; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
  .editor { position: absolute; z-index: 5; border: 1.5px dashed var(--navy); background: rgba(255,255,255,.8); padding: 2px; margin: 0; resize: none; overflow: hidden; outline: none; line-height: 1.3; font-family: var(--font-doc); white-space: pre; min-width: 4em; }
  .float { position: absolute; z-index: 6; display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; box-shadow: var(--shadow); }
  .pagebadge { position: absolute; right: 14px; bottom: 14px; background: rgba(20, 26, 46, .8); color: #FFFFFF; font-size: 13.5px; padding: 4px 12px; border-radius: 999px; pointer-events: none; transition: opacity .3s; }
  .pagebadge.hide { opacity: 0; }
  .drawer { width: 320px; flex: none; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .drawer .ptabs { grid-template-columns: repeat(2, 1fr) 52px; }
  .pageind { min-height: 48px; padding: 0 14px; border-radius: var(--r); border: 1px solid var(--line); display: flex; align-items: center; gap: 2px; font-size: 16px; font-variant-numeric: tabular-nums; flex: none; background: var(--surface); }
  .pageind input { width: 2.6em; text-align: right; border: 0; background: transparent; padding: 0; outline: none; font-variant-numeric: tabular-nums; }
  .zoomv { width: 64px; text-align: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; border: 0; background: none; min-height: 48px; color: var(--ink); flex: none; }

  /* 사진 */
  .ph-body { flex: 1; min-height: 0; display: flex; position: relative; }

  /* 회의록 */

  @keyframes blink { 50% { opacity: .25; } }
  .rec-pill { position: fixed; z-index: 65; top: max(10px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--ink); color: #FFFFFF; font-size: 15px; font-weight: 600; box-shadow: var(--shadow); }
  .rec-pill .go { font-weight: 400; opacity: .75; margin-left: 4px; }
  .mt-card { flex: 1 0 auto; min-height: 340px; display: flex; flex-direction: column; overflow: hidden; }
  .mtabs { display: flex; gap: 4px; padding: 10px 14px 0; border-bottom: 1px solid var(--line); align-items: flex-end; }
  .mtabs [role="tab"] { min-height: 48px; padding: 0 18px; border: 0; background: none; font-size: 16px; font-weight: 500; color: var(--muted); border-bottom: 3px solid transparent; }
  .mtabs [role="tab"][aria-selected="true"] { color: var(--navy); font-weight: 700; border-bottom-color: var(--navy); }
  .mtabs .sp { flex: 1; }

  .mt-sum h2 { margin: 0 0 8px; font-size: 17px; font-weight: 700; color: var(--navy); }
  .dlist { display: flex; flex-direction: column; gap: 6px; }
  .ditem { display: flex; gap: 6px; align-items: flex-start; }
  .ditem .n { width: 22px; flex: none; padding-top: 12px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ditem textarea { flex: 1; min-height: 46px; resize: none; overflow: hidden; line-height: 1.5; }
  .ph-loc { grid-template-columns: minmax(0, .8fr) minmax(0, .8fr) minmax(0, 1.4fr); }
  .todo td { padding: 4px; }
  .todo input { min-height: 44px; font-size: 15px; }
  .stbtn { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 0; font-size: 13px; font-weight: 600; white-space: nowrap; }

  .stbtn.s2 { background: var(--ok-soft); color: var(--ok); }
  .xbtn { width: 40px; height: 40px; border: 0; border-radius: 10px; background: none; color: var(--faint); display: grid; place-items: center; }
  .xbtn:hover { color: var(--red-ink); background: var(--red-soft); }
  .next-meet { margin-top: 6px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--ink-2); }

  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }

  /* 시트 · 알림 */
  .sheet-back { position: fixed; inset: 0; background: rgba(8, 12, 20, .45); z-index: 40; display: grid; place-items: center; padding: 16px; }
  .sheet { width: min(560px, 100%); max-height: min(86vh, 760px); background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
  .sheet.wide { width: min(760px, 100%); }
  .sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  .sheet-h h2 { font-size: 19px; margin: 0; font-weight: 700; }
  .sheet-b { padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .sheet-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .sheet p { margin: 0; color: var(--ink-2); }
  .opt { min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; font-size: 16px; font-weight: 600; width: 100%; }
  .opt[aria-pressed="true"] { border-color: var(--navy); background: var(--navy-soft); color: var(--navy); }
  .opt .s { font-weight: 400; font-size: 13.5px; color: var(--muted); margin-left: auto; }
  .meter { height: 8px; border-radius: 4px; background: var(--line-2); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--navy); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 15px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .busy { position: fixed; inset: 0; z-index: 55; display: grid; place-items: center; background: rgba(8, 12, 20, .35); }
  .busy-card { width: min(380px, calc(100% - 32px)); background: var(--surface); border-radius: 16px; padding: 18px; display: grid; gap: 10px; box-shadow: var(--shadow); }
  .busy-t { font-weight: 700; }
  .track { height: 5px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--navy); transition: width .2s; }
  .busy-s { font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; }
  .toast { position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; max-width: min(600px, calc(100% - 32px)); background: var(--ink); color: #FFFFFF; border-radius: 12px; padding: 12px 16px; font-size: 15px; box-shadow: var(--shadow); display: flex; gap: 14px; align-items: center; }
  .toast.err { background: var(--red-ink); }
  .toast button { border: 0; background: none; color: inherit; text-decoration: underline; padding: 4px; white-space: nowrap; }
  .drop { position: fixed; inset: 12px; border: 3px dashed var(--navy); border-radius: 18px; background: rgba(16, 32, 121, .10); display: grid; place-items: center; font-size: 20px; font-weight: 700; color: var(--navy); z-index: 45; pointer-events: none; }
  .panel-toggle { display: none; }


  /* ===== AI (현장 PC를 거쳐) ===== */
  #home-alert:empty { display: none; }
  .halert { display: flex; gap: 14px; align-items: center; padding: 16px 18px; border-radius: 16px; border: 1px solid #F2B8BF; background: var(--red-soft); }
  .halert .ic { width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; color: var(--red-ink); display: grid; place-items: center; flex: none; }
  .halert .ic svg { width: 24px; height: 24px; }
  .halert .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; line-height: 1.5; color: var(--ink-2); }
  .halert .tx b { font-size: 17px; color: var(--red-ink); }
  .halert-btn { min-height: 56px; padding: 0 20px; font-size: 16.5px; flex: none; gap: 8px; }
  .aiq { display: flex; gap: 14px; }
  .aiq button { flex: 1; min-width: 0; min-height: 70px; border-radius: 14px; border: 1px solid #C9CFEA; background: linear-gradient(180deg, #F7F8FD, var(--navy-soft)); display: flex; align-items: center; gap: 12px; padding: 10px 16px; text-align: left; color: var(--navy); }
  .aiq .ic { width: 42px; height: 42px; border-radius: 12px; background: var(--navy); color: #FFFFFF; display: grid; place-items: center; flex: none; }
  .aiq .tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .aiq .tx b { font-size: 17px; }
  .aiq .tx span { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 말로 쓰기 */
  .vo { display: flex; flex-direction: column; gap: 14px; }
  .vo-hint { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--ink-2); }
  .vo-mic { display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface-2); text-align: left; min-height: 84px; }
  .vo-mic .ring { width: 58px; height: 58px; border-radius: 50%; background: var(--navy); color: #FFFFFF; display: grid; place-items: center; flex: none; }
  .vo-mic[data-mode="rec"] { border-color: #F2B8BF; background: var(--red-soft); }
  .vo-mic[data-mode="rec"] .ring { background: var(--red); animation: vopulse 1.4s ease-in-out infinite; }
  .vo-mic[data-mode="busy"] .ring { background: var(--faint); }
  .vo-tx { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .vo-tx b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .vo-tx span { font-size: 13.5px; color: var(--muted); }
  .vo-meter { width: 90px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; flex: none; }
  .vo-meter i { display: block; height: 100%; width: 0; background: var(--red); transition: width .08s; }
  @keyframes vopulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(214, 7, 28, .35); } 50% { box-shadow: 0 0 0 10px rgba(214, 7, 28, 0); } }
  .kvt { width: 100%; border-collapse: collapse; font-size: 15px; }
  .kvt th { width: 88px; text-align: left; vertical-align: top; color: var(--muted); font-weight: 600; padding: 9px 8px 9px 0; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
  .kvt td { padding: 9px 0; border-bottom: 1px solid var(--line-2); line-height: 1.55; }
  /* 사진 AI */
  .ph-ai { display: flex; gap: 8px; }
  .btn.ai { flex: 1; border-color: #C9CFEA; background: var(--navy-soft); color: var(--navy); gap: 8px; }
  .btn.ai:disabled { opacity: .7; }
  .ai-card { border: 1px solid #C9CFEA; background: #F8F9FE; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .ai-card .h { display: flex; align-items: center; gap: 8px; }
  .ai-card .h b { flex: 1; font-size: 15.5px; }
  .ai-card .spark { color: var(--navy); display: grid; }
  .ai-card .b { font-size: 14.5px; line-height: 1.55; color: var(--ink-2); }
  .ai-card .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .ai-card .f { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .ai-card .f .meta { font-size: 13px; color: var(--muted); flex: 1 1 100%; }
  .ai-card .f .grow { display: none; }
  .tag { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 700; font-style: normal; line-height: 20px; white-space: nowrap; background: var(--line-2); color: var(--ink-2); }
  .tag.red { background: var(--red-soft); color: var(--red-ink); }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  /* AI 묻기 */
  .ask-body { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
  .ask-main { flex: 1; min-height: 0; overflow-y: auto; padding: 20px var(--gutter-r) 12px var(--gutter-l); }
  .ask-thread { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  .ask-note { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; padding: 16px 18px; border-radius: 14px; background: var(--warn-soft); color: var(--warn); font-size: 14.5px; line-height: 1.55; }
  .ask-note b { font-size: 16px; }
  .ask-note .btn { margin-top: 6px; }
  .ask-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 40px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
  .ask-empty .spark { width: 56px; height: 56px; border-radius: 16px; background: var(--navy-soft); color: var(--navy); display: grid; place-items: center; }
  .ask-empty .spark svg { width: 30px; height: 30px; }
  .ask-empty b { font-size: 19px; }
  .ask-empty > span { max-width: 560px; font-size: 15px; line-height: 1.6; color: var(--muted); }
  .ask-empty .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }
  .ask-empty .chip { min-height: 40px; padding: 0 14px; font-size: 14.5px; border: 1px solid #C9CFEA; }
  .turn { display: flex; flex-direction: column; gap: 10px; }
  .turn > .qb { align-self: flex-end; max-width: 85%; background: var(--navy); color: #FFFFFF; border-radius: 16px 16px 4px 16px; padding: 10px 14px; font-size: 16px; line-height: 1.5; white-space: pre-wrap; }
  .ans { background: var(--surface); border: 1px solid var(--line); border-radius: 4px 16px 16px 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .ans.run { flex-direction: row; align-items: center; gap: 12px; }
  .ans.fail { flex-direction: row; align-items: center; gap: 10px; background: var(--red-soft); border-color: transparent; color: var(--red-ink); }
  .ans.fail span { flex: 1; }
  .asteps { flex: 1; display: flex; flex-direction: column; gap: 2px; font-size: 14px; color: var(--muted); }
  .asteps .now { color: var(--navy); font-weight: 600; }
  .atext { font-size: 16px; line-height: 1.7; }
  .cite { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 5px; margin: 0 2px; border-radius: 7px; border: 0; background: var(--navy-soft); color: var(--navy); font-size: 12.5px; font-weight: 700; vertical-align: 1px; }
  .srcs { display: flex; flex-direction: column; gap: 8px; }
  .srcs .h { font-size: 13px; color: var(--muted); font-weight: 600; }
  .src { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--surface-2); transition: background .3s; }
  .src.flash { background: var(--warn-soft); }
  .src .n { width: 24px; height: 24px; border-radius: 7px; background: var(--navy); color: #FFFFFF; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; flex: none; }
  .src .badge { width: 46px; height: 28px; }
  .src .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .src .nm b { font-size: 14.5px; overflow-wrap: anywhere; }
  .src .cq { font-size: 13.5px; color: var(--ink-2); line-height: 1.5; border-left: 3px solid #C9CFEA; padding-left: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .src .w { font-size: 12.5px; color: var(--muted); }
  .src .btn { flex: none; }
  .recs summary { cursor: pointer; font-size: 14px; color: var(--navy); font-weight: 600; min-height: 32px; display: flex; align-items: center; }
  .recs .rrow { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--line-2); font-size: 14px; }
  .recs .rrow span { color: var(--muted); font-size: 13px; }
  .afoot { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line-2); padding-top: 10px; }
  .ask-box { display: flex; gap: 8px; align-items: flex-end; padding: 10px var(--gutter-r) max(12px, env(safe-area-inset-bottom, 0px)) var(--gutter-l); background: var(--surface); border-top: 1px solid var(--line); }
  .ask-box textarea { flex: 1; min-height: 52px; max-height: 160px; resize: none; font-size: 16px; line-height: 1.45; padding: 13px 14px; }
  .ask-box .btn { min-height: 52px; flex: none; gap: 6px; }
  .ask-box .btn.icon { width: 52px; padding: 0; justify-content: center; }
  @media (max-width: 1500px) { .mt-sum { grid-template-columns: minmax(0, 1fr); gap: 18px; } }
  @media (max-width: 1400px) {
    .ttool { min-width: 56px; padding: 0 10px; font-size: 15px; }
    #doc-finger-l { display: none; }
  }
  @media (max-width: 1180px) {
    .home-main { grid-template-columns: minmax(0, 1fr) 340px; }
    .today { display: none; }
  }
  @media (max-width: 1100px) {
    .cad-panel, .ph-detail, .drawer { position: absolute; top: 0; right: 0; bottom: 0; z-index: 20; box-shadow: var(--shadow); }
    .cad-panel[data-closed], .ph-detail[data-closed], .drawer[data-closed] { display: none; }
    .panel-toggle { display: inline-flex; }
    .ttool { min-width: 56px; padding: 0 10px; font-size: 15px; }
  }
  @media (max-width: 900px) {
    .home-main { grid-template-columns: minmax(0, 1fr); }
    .net .sub { display: none; }
    .sidenav { width: 132px; }
    .doc-rail { display: none; }
    .mt-list { width: 220px; }
    .mt-sum { grid-template-columns: minmax(0, 1fr); }
    .tline { grid-template-columns: 100px minmax(0, 1fr) 40px; }
    .tline .at { display: none; }
    .hide-md { display: none !important; }
    .logo { height: 26px; }
  }
  @media (max-width: 640px) {
    :root { --gutter-l: max(16px, env(safe-area-inset-left, 0px)); --gutter-r: max(16px, env(safe-area-inset-right, 0px)); }
    .bar { flex-wrap: wrap; gap: 8px; }
    .tiles { grid-template-columns: minmax(0, 1fr); }
    .tile { min-height: 0; }
    .quick { flex-direction: column; }
    .aiq { flex-direction: column; gap: 10px; }
    .halert { flex-wrap: wrap; }
    .halert-btn { flex: 1 1 100%; }
    .lib-body, .ph-body, .mt-body { flex-direction: column; }
    .sidenav { width: auto; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 12px; }
    .sidenav .h { display: none; }
    .navbtn { min-height: 44px; flex: none; }
    .mt-list { width: auto; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); max-height: none; }
    .mitem { width: 220px; flex: none; }
    .mtabs { flex-wrap: wrap; padding: 6px 10px 0; }
    .mtabs [role="tab"] { padding: 0 12px; white-space: nowrap; }
    .mtabs .sp { flex-basis: 100%; }
    .mtabs .linkbtn, .mtabs .btn { margin-bottom: 8px; }
    .mt-sum, .tlines, .addline, .mt-foot { padding-left: 14px; padding-right: 14px; }
    .ph-loc { grid-template-columns: minmax(0, 1fr); }
    .cad-body { flex-direction: column-reverse; }
    .rail { width: auto; flex-direction: row; justify-content: center; border-right: 0; border-top: 1px solid var(--line); padding: 8px; overflow-x: auto; }
    .rtool { width: 64px; min-height: 64px; }
    .cad-panel, .ph-detail, .drawer { width: 100%; }
    .hide-sm { display: none !important; }
    .site-btn { max-width: 100%; flex: 1 1 100%; order: 5; }
    .grid3 { grid-template-columns: minmax(0, 1fr); }
    .ph-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (prefers-reduced-motion: reduce) { .fill, .pagebadge { transition: none; } .ai-wait .bar i { animation: none; width: 100%; } .dot { animation: none; } }

  /* ===== 휴대폰 웹앱 ===== */
  .pwa-banner { position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom, 0px)); z-index: 80; background: #FFFFFF; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 34px rgba(10, 16, 40, .22); padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 10px; max-width: 560px; margin: 0 auto; }
  .pwa-banner .tx { display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; line-height: 1.5; color: var(--ink-2); }

  .pwa-banner .acts { display: flex; gap: 8px; justify-content: flex-end; }

  .ws-acts { display: flex; gap: 10px; margin-top: 4px; }

  .sy-qrbig { min-height: 60px; font-size: 17px; justify-content: center; gap: 10px; }

  /* ===== 휴대폰 세로 화면 ===== */
  @media (max-width: 640px) {
    :root { --gutter-l: max(14px, env(safe-area-inset-left, 0px)); --gutter-r: max(14px, env(safe-area-inset-right, 0px)); }
    body { -webkit-text-size-adjust: 100%; }
    .bar, .bar.tall { min-height: 56px; padding-top: max(8px, env(safe-area-inset-top, 0px)); }

    #v-home .bar .avatar { order: 4; width: 38px; height: 38px; font-size: 15px; }
    #v-home .bar .site-btn { order: 5; flex: 1 1 100%; min-height: 50px; }
    .home-main { padding-top: 10px; gap: 14px; }
    .home-left { gap: 12px; }
    .home-head { order: 1; }
    .home-head h1 { font-size: 20px; }
    .home-head p { display: none; }
    .quick { order: 2; flex-direction: row; gap: 8px; }

    .aiq .tx b { font-size: 15px; }

    #home-alert { order: 0; }

    .ask-main { padding: 14px 12px 10px; }
    .src { flex-wrap: wrap; align-items: flex-start; }

    /* 사진: 고른 사진 정보는 아래에서 올라오는 판 */

    .ph-grid { gap: 10px; }

    .pcard .tx { padding: 8px 10px 10px; }

  function convLtype(g) {
    const T = { name: '', description: '', totalPatternLength: 0, pattern: [] };
    for (let i = 0; i < g.length; i += 2) {
      const c = g[i], v = g[i + 1];
      if (c === 2) T.name = v;
      else if (c === 3) T.description = v;
      else if (c === 40) T.totalPatternLength = parseFloat(v);
      else if (c === 49) T.pattern.push({ elementLength: parseFloat(v) });
    }
    return T;
  }

  function convBlockRecord(g) {
    const B = { name: '', handle: '', repBTag: null };
    let inRep = false;
    for (let i = 0; i < g.length; i += 2) {
      const c = g[i], v = g[i + 1];
      if (c === 2) B.name = v;
      else if (c === 5) B.handle = v.toUpperCase();
      else if (c === 1001) inRep = v === 'AcDbBlockRepBTag';
      else if (c === 1005 && inRep) B.repBTag = v.toUpperCase();
    }
    return B;
  }

  async function parseBlocks(r, db, maybeYield) {
    while (r.code !== -1 && !(r.code === 0 && r.val === 'ENDSEC')) {
      if (r.code === 0 && r.val === 'BLOCK') {
        const head = readRecord(r);
        const b = { name: '', handle: '', basePoint: { x: 0, y: 0 }, flags: 0, entities: [] };
        const g = head.g;
        for (let i = 0; i < g.length; i += 2) {
          const c = g[i], v = g[i + 1];
          if (c === 2) b.name = v;
          else if (c === 5) b.handle = v.toUpperCase();
          else if (c === 10) b.basePoint.x = parseFloat(v);
          else if (c === 20) b.basePoint.y = parseFloat(v);
          else if (c === 70) b.flags = parseInt(v, 10);
        }
        const recs = [];
        while (r.code !== -1 && !(r.code === 0 && (r.val === 'ENDBLK' || r.val === 'ENDSEC'))) {
          if (r.code === 0) { recs.push(readRecord(r)); await maybeYield(); }
          else r.next();
        }
        if (r.val === 'ENDBLK') readRecord(r);
        b.entities = assemble(recs, false);
        if (b.name) db.blockDefs[b.name.toUpperCase()] = b;
      } else r.next();
    }
    r.next();
  }

  // 레코드 목록 → 엔티티 (POLYLINE/VERTEX/SEQEND, INSERT/ATTRIB/SEQEND 묶기)
  function assemble(recs, modelOnly) {
    const out = [];
    for (let i = 0; i < recs.length; i++) {
      const rec = recs[i];
      let e = null;
      if (rec.type === 'POLYLINE') {
        const verts = [];
        while (i + 1 < recs.length && recs[i + 1].type === 'VERTEX') verts.push(recs[++i]);
        if (i + 1 < recs.length && recs[i + 1].type === 'SEQEND') i++;
        e = convPolyline(rec.g, verts);
      } else if (rec.type === 'INSERT') {
        const atts = [];
        while (i + 1 < recs.length && recs[i + 1].type === 'ATTRIB') atts.push(recs[++i]);
        if (atts.length && i + 1 < recs.length && recs[i + 1].type === 'SEQEND') i++;
        e = convInsert(rec.g, atts);
      } else if (rec.type === 'VERTEX' || rec.type === 'SEQEND' || rec.type === 'ATTRIB') {
        continue;
      } else {
        e = convEntity(rec.type, rec.g);
      }
      if (!e) continue;
      if (modelOnly && e.isInPaperSpace) continue;
      out.push(e);
    }
    return out;
  }

  function common(type, g) {
    const e = { type, handle: '', layer: '0', lineType: 'ByLayer', colorIndex: 256, color: undefined, lineTypeScale: 1, isVisible: true, isInPaperSpace: false };
    for (let i = 0; i < g.length; i += 2) {
      const c = g[i];
      if (c === 5) e.handle = g[i + 1].toUpperCase();
      else if (c === 8) e.layer = g[i + 1];
      else if (c === 6) e.lineType = g[i + 1];
      else if (c === 62) e.colorIndex = parseInt(g[i + 1], 10);
      else if (c === 420) e.color = parseInt(g[i + 1], 10);
      else if (c === 48) e.lineTypeScale = parseFloat(g[i + 1]);
      else if (c === 60) e.isVisible = g[i + 1].trim() !== '1';
      else if (c === 67) e.isInPaperSpace = g[i + 1].trim() === '1';
      else if (c === 101) break;
    }
    return e;
  }

  // 단일 값 그룹을 맵으로 (첫 등장 기준, 101 이후 무시)
  function firstMap(g) {
    const m = {};
    for (let i = 0; i < g.length; i += 2) {
      const c = g[i];
      if (c === 101) break;
      if (!(c in m)) m[c] = g[i + 1];
    }
    return m;
  }
  const num = (m, c, d) => (c in m ? parseFloat(m[c]) : d);
  const pt = (m, cx, d) => ({ x: num(m, cx, d || 0), y: num(m, cx + 10, d || 0), z: num(m, cx + 20, 0) });
  const ext = (m) => ({ x: num(m, 210, 0), y: num(m, 220, 0), z: num(m, 230, 1) });

  function textBase(m, valignCode) {
    return {
      text: m[1] || '',
      startPoint: pt(m, 10), endPoint: pt(m, 11),
      hasEndPoint: 11 in m,
      textHeight: num(m, 40, 1), rotation: num(m, 50, 0) * DEG,
      xScale: num(m, 41, 1), obliqueAngle: num(m, 51, 0) * DEG,
      styleName: m[7] || 'Standard', generationFlag: num(m, 71, 0) | 0,
      halign: num(m, 72, 0) | 0, valign: num(m, valignCode, 0) | 0,
      extrusionDirection: ext(m)
    };
  }

  function convInsert(g, atts) {
    const e = common('INSERT', g), m = firstMap(g);
    Object.assign(e, {
      name: m[2] || '', insertionPoint: pt(m, 10),
      xScale: num(m, 41, 1), yScale: num(m, 42, 1), zScale: num(m, 43, 1),
      rotation: num(m, 50, 0) * DEG,
      columnCount: num(m, 70, 1) | 0, rowCount: num(m, 71, 1) | 0,
      columnSpacing: num(m, 44, 0), rowSpacing: num(m, 45, 0),
      extrusionDirection: ext(m), attribs: []
    });
    for (const a of atts) {
      const ae = common('ATTRIB', a.g), am = firstMap(a.g);
      ae.tag = am[2] || '';
      ae.flags = num(am, 70, 0) | 0;
      ae.text = textBase(am, 74);
      e.attribs.push(ae);
    }
    return e;
  }

  function convPolyline(g, verts) {
    const e = common('POLYLINE', g), m = firstMap(g);
    const flag = num(m, 70, 0) | 0;
    e.flag = flag;
    e.extrusionDirection = ext(m);
    e.elevation = num(m, 30, 0);
    const vs = [];
    for (const v of verts) {
      const vm = firstMap(v.g);
      vs.push({ x: num(vm, 10, 0), y: num(vm, 20, 0), z: num(vm, 30, 0), bulge: num(vm, 42, 0), flag: num(vm, 70, 0) | 0,
        i1: num(vm, 71, 0) | 0, i2: num(vm, 72, 0) | 0, i3: num(vm, 73, 0) | 0, i4: num(vm, 74, 0) | 0 });
    }
    if (flag & 64) {
      e.type = 'POLYFACE';
      e.vertices = vs.filter(v => (v.flag & 64));
      e.faces = vs.filter(v => (v.flag & 128) && !(v.flag & 64)).map(v => [v.i1, v.i2, v.i3, v.i4]);
    } else if (flag & 16) {
      e.type = 'POLYMESH';
      e.m = num(m, 71, 0) | 0; e.n = num(m, 72, 0) | 0;
      e.vertices = vs;
    } else {
      e.type = (flag & 8) ? 'POLYLINE3D' : 'POLYLINE2D';
      // 스플라인 맞춤 폴리선: 제어점(16)은 빼고 맞춤 정점만 사용
      e.vertices = (flag & 4) ? vs.filter(v => !(v.flag & 16)) : vs;
    }
    return e;
  }

  function convEntity(type, g) {
    const m = firstMap(g);
    let e;
    switch (type) {
      case 'LINE':
        e = common(type, g);
        e.startPoint = pt(m, 10); e.endPoint = pt(m, 11); e.extrusionDirection = ext(m);
        return e;
      case 'CIRCLE':
        e = common(type, g);
        e.center = pt(m, 10); e.radius = num(m, 40, 0); e.extrusionDirection = ext(m);
        return e;
      case 'ARC':
        e = common(type, g);
        e.center = pt(m, 10); e.radius = num(m, 40, 0);
        e.startAngle = num(m, 50, 0) * DEG; e.endAngle = num(m, 51, 360) * DEG; e.extrusionDirection = ext(m);
        return e;
      case 'ELLIPSE':
        e = common(type, g);
        e.center = pt(m, 10); e.majorAxisEndPoint = pt(m, 11); e.axisRatio = num(m, 40, 1);
        e.startAngle = num(m, 41, 0); e.endAngle = num(m, 42, Math.PI * 2); e.extrusionDirection = ext(m);
        return e;
      case 'POINT':
        e = common(type, g);
        e.position = pt(m, 10);
        return e;
      case 'LWPOLYLINE': {
        e = common(type, g);
        e.flag = num(m, 70, 0) | 0; e.elevation = num(m, 38, 0); e.constantWidth = num(m, 43, 0);
        e.extrusionDirection = ext(m);
        const vs = []; let cur = null;
        for (let i = 0; i < g.length; i += 2) {
          const c = g[i];
          if (c === 10) { cur = { x: parseFloat(g[i + 1]), y: 0, bulge: 0 }; vs.push(cur); }
          else if (c === 20 && cur) cur.y = parseFloat(g[i + 1]);
          else if (c === 42 && cur) cur.bulge = parseFloat(g[i + 1]);
        }
        e.vertices = vs;
        return e;
      }
      case 'SPLINE': {
        e = common(type, g);
        e.flag = num(m, 70, 0) | 0; e.degree = num(m, 71, 3) | 0;
        e.knots = []; e.weights = []; e.controlPoints = []; e.fitPoints = [];
        let cp = null, fp = null;
        for (let i = 0; i < g.length; i += 2) {
          const c = g[i], v = g[i + 1];
          if (c === 40) e.knots.push(parseFloat(v));
          else if (c === 41) e.weights.push(parseFloat(v));
          else if (c === 10) { cp = { x: parseFloat(v), y: 0, z: 0 }; e.controlPoints.push(cp); }
          else if (c === 20 && cp) cp.y = parseFloat(v);
          else if (c === 11) { fp = { x: parseFloat(v), y: 0, z: 0 }; e.fitPoints.push(fp); }
          else if (c === 21 && fp) fp.y = parseFloat(v);
        }
        return e;
      }
      case 'TEXT':
        e = common(type, g);
        Object.assign(e, textBase(m, 73));
        return e;
      case 'ATTDEF':
        e = common(type, g);
        e.tag = m[2] || ''; e.prompt = m[3] || '';
        e.flags = num(m, 70, 0) | 0;
        e.text = textBase(m, 74);
        e.text.text = e.tag;
        return e;
      case 'MTEXT': {
        e = common(type, g);
        let s = '';
        for (let i = 0; i < g.length; i += 2) {
          const c = g[i];
          if (c === 101) break;
          if (c === 3 || c === 1) s += g[i + 1];
        }
        e.text = s;
        e.insertionPoint = pt(m, 10);
        e.textHeight = num(m, 40, 1);
        e.rectWidth = num(m, 41, 0);
        e.attachmentPoint = num(m, 71, 1) | 0;
        e.drawingDirection = num(m, 72, 1) | 0;
        e.lineSpacing = num(m, 44, 1);
        e.styleName = m[7] || 'Standard';
        e.direction = (11 in m) ? pt(m, 11) : null;
        e.rotation = num(m, 50, 0) * DEG;
        e.extrusionDirection = ext(m);
        return e;
      }
      case 'DIMENSION':
        e = common(type, g);
        e.name = m[2] || '';
        e.definitionPoint = pt(m, 10); e.textPoint = pt(m, 11);
        e.insertionPoint = pt(m, 12);
        e.dimensionType = num(m, 70, 0) | 0;
        e.measurement = num(m, 42, NaN);
        e.text = m[1] || '';
        e.styleName = m[3] || '';
        return e;
      case 'SOLID': case 'TRACE': case '3DFACE':
        e = common(type, g);
        e.corner1 = pt(m, 10); e.corner2 = pt(m, 11); e.corner3 = pt(m, 12);
        e.corner4 = (13 in m) ? pt(m, 13) : pt(m, 12);
        e.flag = num(m, 70, 0) | 0;
        e.extrusionDirection = ext(m);
        return e;
      case 'LEADER': {
        e = common(type, g);
        e.isArrowheadEnabled = num(m, 71, 1) === 1;
        e.vertices = [];
        let cur = null;
        for (let i = 0; i < g.length; i += 2) {
          const c = g[i];
          if (c === 10) { cur = { x: parseFloat(g[i + 1]), y: 0, z: 0 }; e.vertices.push(cur); }
          else if (c === 20 && cur) cur.y = parseFloat(g[i + 1]);
        }
        return e;
      }
      case 'HATCH':
        return convHatch(g);
      case 'ACAD_TABLE': {
        e = common('INSERT', g);
        const dx = num(m, 11, 1), dy = num(m, 21, 0);
        Object.assign(e, { name: m[2] || '', insertionPoint: pt(m, 10), xScale: 1, yScale: 1, zScale: 1,
          rotation: Math.atan2(dy, dx), columnCount: 1, rowCount: 1, columnSpacing: 0, rowSpacing: 0,
          extrusionDirection: { x: 0, y: 0, z: 1 }, attribs: [], isTable: true });
        return e;
      }
      case 'MULTILEADER': case 'MLEADER':
        return convMLeader(g);
      case 'MLINE': {
        e = common(type, g);
        e.vertices = [];
        e.closed = !!(num(m, 71, 0) & 2);
        let cur = null;
        for (let i = 0; i < g.length; i += 2) {
          const c = g[i];
          if (c === 11) { cur = { x: parseFloat(g[i + 1]), y: 0 }; e.vertices.push({ vertex: cur }); }
          else if (c === 21 && cur) cur.y = parseFloat(g[i + 1]);
        }
        return e;
      }
      default:
        e = common(type, g);
        return e;
    }
  }

  function convMLeader(g) {
    const e = common('MLEADER', g);
    e.textContent = ''; e.textPosition = null; e.textHeight = 0; e.lines = []; e.textDirection = { x: 1, y: 0 };
    e.textAttachment = 1;
    const stack = [];
    let line = null, lastLeaderPt = null, inCtx = false;
    for (let i = 0; i < g.length; i += 2) {
      const c = g[i], v = g[i + 1];
      if (c === 300 && v === 'CONTEXT_DATA{') { inCtx = true; continue; }
      if (c === 302 && v === 'LEADER{') { stack.push('L'); lastLeaderPt = null; continue; }
      if (c === 304 && v === 'LEADER_LINE{') { stack.push('LL'); line = []; e.lines.push(line); continue; }
      if (c === 305 || c === 303 || c === 301) {
        const top = stack.pop();
        if (top === 'L' && lastLeaderPt) {
          for (const ln of e.lines) if (ln._owner === undefined) { ln.push(lastLeaderPt); ln._owner = 1; }
        }
        line = null; continue;
      }
      const top = stack[stack.length - 1];
      if (top === 'LL' && line) {
        if (c === 10) line.push({ x: parseFloat(v), y: 0 });
        else if (c === 20 && line.length) line[line.length - 1].y = parseFloat(v);
      } else if (top === 'L') {
        if (c === 10) lastLeaderPt = { x: parseFloat(v), y: 0 };
        else if (c === 20 && lastLeaderPt) lastLeaderPt.y = parseFloat(v);
      } else if (inCtx && stack.length === 0) {
        if (c === 304) e.textContent = v;
        else if (c === 41) e.textHeight = parseFloat(v);
        else if (c === 12) e.textPosition = { x: parseFloat(v), y: 0 };
        else if (c === 22 && e.textPosition) e.textPosition.y = parseFloat(v);
        else if (c === 13) e.textDirection = { x: parseFloat(v), y: 0 };
        else if (c === 23) e.textDirection.y = parseFloat(v);
      }
    }
    // 리더 선은 마지막 점(텍스트 쪽)부터 화살표 쪽으로 저장되어 있으므로 그대로 둔다
    return e;
  }

  function convHatch(g) {
    const e = common('HATCH', g);
    const m = firstMap(g);
    e.patternName = m[2] || '';
    e.solidFill = num(m, 70, 0) | 0;
    e.extrusionDirection = ext(m);
    e.boundaryPaths = [];
    e.definitionLines = [];
    e.isGradient = false;
    let i = 0;
    const N = g.length;
    // 경계 시작(91)까지 이동
    while (i < N && g[i] !== 91) i += 2;
    if (i >= N) return e;
    const nPaths = parseInt(g[i + 1], 10); i += 2;
    const f = () => parseFloat(g[i + 1]);
    for (let p = 0; p < nPaths && i < N; p++) {
      while (i < N && g[i] !== 92) i += 2;
      if (i >= N) break;
      const flag = parseInt(g[i + 1], 10); i += 2;
      if (flag & 2) {
        let hasBulge = false, closed = true, nv = 0;
        const verts = [];
        while (i < N && g[i] !== 10 && g[i] !== 97 && g[i] !== 92) {
          if (g[i] === 72) hasBulge = g[i + 1].trim() === '1';
          else if (g[i] === 73) closed = g[i + 1].trim() === '1';
          else if (g[i] === 93) nv = parseInt(g[i + 1], 10);
          i += 2;
        }
        for (let k = 0; k < nv && i < N; k++) {
          const v = { x: 0, y: 0, bulge: 0 };
          if (g[i] === 10) { v.x = f(); i += 2; }
          if (g[i] === 20) { v.y = f(); i += 2; }
          if (hasBulge && g[i] === 42) { v.bulge = f(); i += 2; }
          verts.push(v);
        }
        e.boundaryPaths.push({ boundaryPathTypeFlag: flag, isClosed: closed, vertices: verts });
      } else {
        while (i < N && g[i] !== 93) i += 2;
        const ne = parseInt(g[i + 1], 10); i += 2;
        const edges = [];
        for (let k = 0; k < ne && i < N; k++) {
          while (i < N && g[i] !== 72) i += 2;
          const t = parseInt(g[i + 1], 10); i += 2;
          if (t === 1) {
            const ed = { type: 1, start: { x: 0, y: 0 }, end: { x: 0, y: 0 } };
            while (i < N && [10, 20, 11, 21].includes(g[i])) {
              const c = g[i];
              if (c === 10) ed.start.x = f(); else if (c === 20) ed.start.y = f();
              else if (c === 11) ed.end.x = f(); else ed.end.y = f();
              i += 2;
            }
            edges.push(ed);
          } else if (t === 2) {
            const ed = { type: 2, center: { x: 0, y: 0 }, radius: 0, startAngle: 0, endAngle: 0, isCCW: true };
            while (i < N && [10, 20, 40, 50, 51, 73].includes(g[i])) {
              const c = g[i];
              if (c === 10) ed.center.x = f(); else if (c === 20) ed.center.y = f();
              else if (c === 40) ed.radius = f(); else if (c === 50) ed.startAngle = f() * DEG;
              else if (c === 51) ed.endAngle = f() * DEG; else ed.isCCW = g[i + 1].trim() !== '0';
              i += 2;
            }
            edges.push(ed);
          } else if (t === 3) {
            const ed = { type: 3, center: { x: 0, y: 0 }, end: { x: 1, y: 0 }, lengthOfMinorAxis: 1, startAngle: 0, endAngle: 0, isCCW: true };
            while (i < N && [10, 20, 11, 21, 40, 50, 51, 73].includes(g[i])) {
              const c = g[i];
              if (c === 10) ed.center.x = f(); else if (c === 20) ed.center.y = f();
              else if (c === 11) ed.end.x = f(); else if (c === 21) ed.end.y = f();
              else if (c === 40) ed.lengthOfMinorAxis = f(); else if (c === 50) ed.startAngle = f() * DEG;
              else if (c === 51) ed.endAngle = f() * DEG; else ed.isCCW = g[i + 1].trim() !== '0';
              i += 2;
            }
            edges.push(ed);
          } else if (t === 4) {
            const ed = { type: 4, degree: 3, knots: [], controlPoints: [], fitDatum: [] };
            let cp = null, fp = null;
            while (i < N && [94, 73, 74, 95, 96, 40, 10, 20, 42, 97, 11, 21, 12, 22, 13, 23].includes(g[i])) {
              const c = g[i];
              if (c === 94) ed.degree = parseInt(g[i + 1], 10);
              else if (c === 40) ed.knots.push(f());
              else if (c === 10) { cp = { x: f(), y: 0, weight: 1 }; ed.controlPoints.push(cp); }
              else if (c === 20 && cp) cp.y = f();
              else if (c === 42 && cp) cp.weight = f();
              else if (c === 11) { fp = { x: f(), y: 0 }; ed.fitDatum.push(fp); }
              else if (c === 21 && fp) fp.y = f();
              i += 2;
            }
            edges.push(ed);
          }
        }
        e.boundaryPaths.push({ boundaryPathTypeFlag: flag, edges });
      }
      // 원본 경계 객체 참조(97, 330) 건너뜀
      if (i < N && g[i] === 97) {
        const ns = parseInt(g[i + 1], 10); i += 2;
        for (let k = 0; k < ns && i < N && g[i] === 330; k++) i += 2;
      }
    }
    // 패턴 정의
    for (; i < N; i += 2) {
      const c = g[i];
      if (c === 75) e.hatchStyle = parseInt(g[i + 1], 10);
      else if (c === 76) e.patternType = parseInt(g[i + 1], 10);
      else if (c === 52) e.patternAngle = parseFloat(g[i + 1]) * DEG;
      else if (c === 41) e.patternScale = parseFloat(g[i + 1]);
      else if (c === 450) e.isGradient = g[i + 1].trim() === '1';
      else if (c === 78) {
        const nl = parseInt(g[i + 1], 10); i += 2;
        for (let k = 0; k < nl && i < N; k++) {
          const dl = { angle: 0, base: { x: 0, y: 0 }, offset: { x: 0, y: 0 }, dashLengths: [] };
          while (i < N && g[i] !== 53) i += 2;
          dl.angle = parseFloat(g[i + 1]) * DEG; i += 2;
          while (i < N && [43, 44, 45, 46, 79, 49].includes(g[i])) {
            const cc = g[i], v = parseFloat(g[i + 1]);
            if (cc === 43) dl.base.x = v; else if (cc === 44) dl.base.y = v;
            else if (cc === 45) dl.offset.x = v; else if (cc === 46) dl.offset.y = v;
            else if (cc === 49) dl.dashLengths.push(v);
            i += 2;
          }
          e.definitionLines.push(dl);
        }
        i -= 2;
      }
    }
    return e;

    }

    function lb(li) {

    function emitPath(ctx, pts, closed, noDash) {

    }

      if (rw > 0) parts = wrapLines(parts, rw / h * 1.02, measure);

    function hatch(ctx, e) {

              ei = (ei + 1) % dash.length;

    }

    function arrow(ctx, x0, y0, x1, y1, size) {
      const L = Math.hypot(x1 - x0, y1 - y0);

            snap(cc, cx + r * Math.cos(e.startAngle), cy + r * Math.sin(e.startAngle), S_END);
            snap(cc, cx + r * Math.cos(e.startAngle + sw), cy + r * Math.sin(e.startAngle + sw), S_END);

            arrow(c, ln[0].x, ln[0].y, ln[1].x, ln[1].y, sz);

          if (e.textContent && e.textPosition) {

          }

        }

        }

    function insert(ctx, e, inBlock) {
      const b = blocks[(e.name || '').toUpperCase()];

      if ((b.flags & 4) && !b.entities.length) { warnings.add('외부 참조(XREF) 도면은 파일에 들어 있지 않아 표시하지 않습니다.'); return; }

      const om = ocs(e.extrusionDirection);
      const sx = e.xScale || 1, sy = e.yScale || 1;

    }

    const entBox = [];
    const t0 = Date.now();
    for (let i = 0; i < model.length; i++) {
      const e = model[i];
      const id = ents.length;
      bbReset();
      const li = addLayer(e.layer || '0');
      const ctx = Object.assign({}, root, { ent: id, layer: li });
      const startTexts = texts.length;
      try { emit(ctx, e, false); } catch (err) { warnings.add('일부 객체를 해석하지 못했습니다 (' + e.type + ').'); }
      layers[li].entCount++;
      ents.push({ src: e, type: e.type, layer: li, textFrom: startTexts, textTo: texts.length });
      entBox.push(bx0, by0, bx1, by1);

        if (onProgress) onProgress(i / model.length);

      }
    }
    if (truncated) warnings.add('객체가 너무 많아 일부만 표시합니다.');

    // ---------- 버퍼 결합 ----------
    const nL = layers.length;
    let totalSegs = 0, totalTris = 0;
    for (let li = 0; li < nL; li++) { const b = LB[li]; if (b) { totalSegs += b.le.n; if (b.te) totalTris += b.te.n; } }
    const linePos = new Float32Array(totalSegs * 4), lineCol = new Uint32Array(totalSegs * 2), lineEnt = new Uint32Array(totalSegs), lineLayer = new Uint16Array(totalSegs);
    const triPos = new Float32Array(totalTris * 6), triCol = new Uint32Array(totalTris * 3), triEnt = new Uint32Array(totalTris), triLayer = new Uint16Array(totalTris);
    const lineRanges = [], triRanges = [];
    let so = 0, to = 0;
    for (let li = 0; li < nL; li++) {
      const b = LB[li];

    for (let i = 0; i < ents.length; i++) {

      cxs.push((a + c) / 2); cys.push((b + d) / 2);
    }
    if (!isFinite(X0)) { X0 = -50; Y0 = -50; X1 = 50; Y1 = 50; }
    let fit = [X0, Y0, X1, Y1];
    if (cxs.length > 20) {
      const sx = cxs.slice().sort((a, b) => a - b), sy = cys.slice().sort((a, b) => a - b);
      const q = (arr, f) => arr[Math.min(arr.length - 1, Math.max(0, Math.floor(arr.length * f)))];
      const qq = sx.length < 500 ? 0.03 : 0.01;
      const ax = q(sx, qq), bx = q(sx, 1 - qq), ay = q(sy, qq), by = q(sy, 1 - qq);
      const wx = Math.max(bx - ax, 1e-6), wy = Math.max(by - ay, 1e-6);
      const W = Math.max(wx, wy);
      const lx = ax - W * 0.6, hx = bx + W * 0.6, ly = ay - W * 0.6, hy = by + W * 0.6;
      let f0 = Infinity, f1 = Infinity, f2 = -Infinity, f3 = -Infinity;
      for (let i = 0; i < ents.length; i++) {
        const a = entBox[i * 4], b = entBox[i * 4 + 1], c = entBox[i * 4 + 2], d = entBox[i * 4 + 3];

      const p = triPos;
      const k = i * 6;
      o[0] = Math.min(p[k], p[k + 2], p[k + 4]); o[2] = Math.max(p[k], p[k + 2], p[k + 4]);
      o[1] = Math.min(p[k + 1], p[k + 3], p[k + 5]); o[3] = Math.max(p[k + 1], p[k + 3], p[k + 5]);

    const snapIndex = gridIndex(sT.length, (i, o) => { o[0] = o[2] = sP[i * 2]; o[1] = o[3] = sP[i * 2 + 1]; }, idxBox);

    const blockList = Object.values(blockUse).sort((a, b) => b.all - a.all || a.name.localeCompare(b.name));

    if (onProgress) onProgress(1);
    return {
      origin: { x: OX, y: OY },
      layers, ents, entBox: Float64Array.from(entBox), texts,
      lines: { pos: linePos, col: lineCol, ent: lineEnt, layer: lineLayer, ranges: lineRanges, count: totalSegs },
      tris: { pos: triPos, col: triCol, ent: triEnt, layer: triLayer, ranges: triRanges, count: totalTris },
      snaps: { pos: sP, type: sT, ent: sE },
      index: { seg: segIndex, tri: triIndex, snap: snapIndex },
      extents: [X0, Y0, X1, Y1], fit,
      blocks: blockList,
      header,
      units: header.INSUNITS | 0,
      warnings: Array.from(warnings)
    };
  };

  // 균일 격자 인덱스 (CSR). 범위 밖은 가장자리 셀에 고정, 큰 항목은 big 목록
  function gridIndex(n, boxOf, ext) {
    const x0 = ext[0], y0 = ext[1];
    const W = Math.max(ext[2] - ext[0], 1e-9), H = Math.max(ext[3] - ext[1], 1e-9);
    const cellsTarget = Math.max(64, Math.min(1 << 20, n / 3));
    let gx = Math.max(4, Math.round(Math.sqrt(cellsTarget * W / H)));
    let gy = Math.max(4, Math.round(cellsTarget / gx));
    gx = Math.min(gx, 2048); gy = Math.min(gy, 2048);
    const cw = W / gx, ch = H / gy;
    const counts = new Uint32Array(gx * gy + 1);
    const o = [0, 0, 0, 0];
    const big = [];
    const cx = (x) => Math.max(0, Math.min(gx - 1, Math.floor((x - x0) / cw)));
    const cy = (y) => Math.max(0, Math.min(gy - 1, Math.floor((y - y0) / ch)));
    const isBig = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      boxOf(i, o);
      const a = cx(o[0]), b = cy(o[1]), c = cx(o[2]), d = cy(o[3]);
      if ((c - a + 1) * (d - b + 1) > 64) { isBig[i] = 1; big.push(i); continue; }
      for (let yy = b; yy <= d; yy++) for (let xx = a; xx <= c; xx++) counts[yy * gx + xx + 1]++;
    }
    for (let i = 1; i < counts.length; i++) counts[i] += counts[i - 1];
    const items = new Uint32Array(counts[counts.length - 1]);
    const fillp = counts.slice(0, gx * gy);
    for (let i = 0; i < n; i++) {
      if (isBig[i]) continue;
      boxOf(i, o);
      const a = cx(o[0]), b = cy(o[1]), c = cx(o[2]), d = cy(o[3]);
      for (let yy = b; yy <= d; yy++) for (let xx = a; xx <= c; xx++) items[fillp[yy * gx + xx]++] = i;
    }
    return { x0, y0, cw, ch, gx, gy, start: counts, items, big: Uint32Array.from(big) };
  }

  // 범위 질의: 콜백(i)
  CAD.queryGrid = function (g, qx0, qy0, qx1, qy1, cb) {
    const a = Math.max(0, Math.min(g.gx - 1, Math.floor((qx0 - g.x0) / g.cw)));
    const c = Math.max(0, Math.min(g.gx - 1, Math.floor((qx1 - g.x0) / g.cw)));
    const b = Math.max(0, Math.min(g.gy - 1, Math.floor((qy0 - g.y0) / g.ch)));
    const d = Math.max(0, Math.min(g.gy - 1, Math.floor((qy1 - g.y0) / g.ch)));
    for (let y = b; y <= d; y++) {
      for (let x = a; x <= c; x++) {
        const k = y * g.gx + x;
        for (let j = g.start[k]; j < g.start[k + 1]; j++) cb(g.items[j]);
      }
    }
    for (let j = 0; j < g.big.length; j++) cb(g.big[j]);
  };

  // ---------- DWG(libredwg-web) → 정규화 ----------
  CAD.fromDwg = function (db) {

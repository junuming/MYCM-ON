  // ---------------- 공통: 쪽 넘김·제목·표·글 상자·사진 ----------------
  function flow(P, title, site, sub) {
    const pages = [];
    const F = { page: null, y: 0 };
    F.newPage = () => { F.page = P.doc.addPage(A4); pages.push(F.page); F.y = P.header(F.page, title, site, sub); };
    F.need = (h) => { if (F.y - h < 48) F.newPage(); };
    F.finish = () => pages.forEach((pg, i) => P.footer(pg, i + 1, pages.length, site));
    F.newPage();
    return F;
  }
  const TW = A4[0] - 2 * M;
  function heading(P, F, s) { F.need(70); /* 제목만 쪽 끝에 홀로 남지 않게 */ P.text(F.page, s, M, F.y - 12, 12, NAVY, true); F.y -= 22; }
  // 칸: [[이름, 값], [이름, 값]] (하나면 한 줄 전체)
  function kvRows(P, F, rows) {
    const fs = 9.5, lh = 14, lw = 62;
    for (const cells of rows) {
      const cw = cells.length === 1 ? TW - lw : (TW - 2 * lw) / 2;
      const wrapped = cells.map(c => P.wrap(String(c[1] == null || c[1] === '' ? '–' : c[1]), fs, cw - 12));
      const h = Math.max(24, 10 + Math.max(...wrapped.map(w => w.length)) * lh);
      F.need(h);
      let x = M;
      cells.forEach((c, i) => {
        P.rect(F.page, x, F.y - h, lw, h, { fill: FILL, border: LINE });
        P.text(F.page, c[0], x + (lw - P.width(c[0], fs)) / 2, F.y - 16, fs, MUTED);
        P.rect(F.page, x + lw, F.y - h, cw, h, { border: LINE });
        wrapped[i].forEach((l, j) => P.text(F.page, l, x + lw + 6, F.y - 16 - j * lh, fs, INK));
        x += lw + cw;
      });
      F.y -= h;
    }
    F.y -= 14;
  }
  function grid(P, F, cols, rows, empty) {
    const fs = 9.5, lh = 14;
    const head = () => {
      let x = M;
      for (const c of cols) { P.rect(F.page, x, F.y - 22, c.w, 22, { fill: FILL, border: LINE }); P.text(F.page, c.t, x + (c.w - P.width(c.t, fs)) / 2, F.y - 15, fs, MUTED); x += c.w; }
      F.y -= 22;
    };
    if (!rows.length) { F.need(20); P.text(F.page, empty || '없음', M + 6, F.y - 10, 9.5, MUTED); F.y -= 26; return; }
    F.need(46); head();
    for (const r of rows) {
      const wrapped = cols.map((c, i) => P.wrap(String(r[i] == null ? '' : r[i]), fs, c.w - 10));
      const h = Math.max(22, 8 + Math.max(...wrapped.map(w => w.length)) * lh);
      if (F.y - h < 48) { F.newPage(); head(); }
      let x = M;
      cols.forEach((c, i) => {
        P.rect(F.page, x, F.y - h, c.w, h, { border: LINE, fill: r.bold ? FILL : null });
        wrapped[i].forEach((l, j) => {
          const tx = c.a === 'l' ? x + 5 : c.a === 'r' ? x + c.w - 5 - P.width(l, fs) : x + (c.w - P.width(l, fs)) / 2;
          P.text(F.page, l, tx, F.y - 15 - j * lh, fs, INK, !!r.bold);
        });
        x += c.w;
      });
      F.y -= h;
    }
    F.y -= 14;
  }
  function para(P, F, s, empty) {
    const fs = 10, lh = 15;
    const has = !!String(s || '').trim();
    const lines = P.wrap(has ? String(s).trim() : (empty || '–'), fs, TW - 16);
    let i = 0;
    while (i < lines.length) {
      F.need(Math.min(lines.length - i, 3) * lh + 12);
      const fit = Math.max(1, Math.floor((F.y - 48 - 12) / lh));
      const chunk = lines.slice(i, i + fit);
      const h = chunk.length * lh + 12;
      P.rect(F.page, M, F.y - h, TW, h, { border: LINE });
      chunk.forEach((l, j) => P.text(F.page, l, M + 8, F.y - 16 - j * lh, fs, has ? INK : MUTED));
      F.y -= h; i += chunk.length;
      if (i < lines.length) F.newPage();
    }
    F.y -= 14;
  }
  async function imageBox(P, page, blob, x, y, w, h) {
    P.rect(page, x, y, w, h, { fill: [0.93, 0.94, 0.96], border: LINE });
    if (!blob) { const t = '사진 없음'; P.text(page, t, x + (w - P.width(t, 9)) / 2, y + h / 2 - 3, 9, MUTED); return; }
    try {
      const j = await shrinkJpeg(blob, 1400, 0.8);
      const img = await P.doc.embedJpg(j.bytes);
      const k = Math.min((w - 6) / j.w, (h - 6) / j.h);
      page.drawImage(img, { x: x + (w - j.w * k) / 2, y: y + (h - j.h * k) / 2, width: j.w * k, height: j.h * k });
    } catch (e) { console.warn('사진 넣기 실패', e); }
  }
  const dash = (v) => (v === undefined || v === null || v === '' ? '' : v);

  // ---------------- 업무일지 ----------------
  async function daily(d, opts) {
    opts = opts || {};
    const P = await begin();
    const site = opts.site || '';
    const dt = new Date(String(d.date || '').length === 10 ? d.date + 'T00:00:00' : (d.date || Date.now()));
    const F = flow(P, '업무일지', site, App.dateKo(dt.getTime()));
    const info = opts.info || {};
    const w = d.weather || {};
    const temp = dash(w.tmin) !== '' || dash(w.tmax) !== '' ? `${dash(w.tmin)} ~ ${dash(w.tmax)}℃` : '';
    const wx = [w.sky, temp, w.rain ? `강수 ${w.rain}mm` : '', w.wind ? `바람 ${w.wind}m/s` : ''].filter(Boolean).join(' · ');
    const rows = [[['공사명', site]], [['일자', App.dateKo(dt.getTime())], ['날씨', wx]]];
    if (info.client || info.contractor) rows.push([['발주처', info.client], ['시공사', info.contractor]]);
    if (info.addr || info.period) rows.push([['위치', info.addr], ['공사 기간', info.period]]);
    rows.push([['작성', d.author], ['CM', info.manager || '무영씨엠건축사사무소']]);
    kvRows(P, F, rows);
    const mp = (d.manpower || []).filter(r => r && (String(r.trade || '').trim() || +r.today));
    heading(P, F, '1. 인원 현황');
    const n = (v) => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
    const sumT = mp.reduce((s, r) => s + n(r.today), 0), sumC = mp.reduce((s, r) => s + n(r.cum), 0);
    const mrows = mp.map(r => [r.trade || '', r.company || '', n(r.today) ? String(n(r.today)) : '0', String(n(r.cum))]);
    if (mrows.length) { const t = ['합계', '', String(sumT), String(sumC)]; t.bold = true; mrows.push(t); }
    grid(P, F, [{ t: '공종', w: 96 }, { t: '업체', w: TW - 96 - 150, a: 'l' }, { t: '금일(명)', w: 75 }, { t: '누계(명)', w: 75 }], mrows, '적은 인원이 없습니다.');
    const eq = (d.equipment || []).filter(r => r && String(r.name || '').trim());
    if (eq.length) { heading(P, F, '2. 장비 현황'); grid(P, F, [{ t: '장비명', w: 160, a: 'l' }, { t: '규격', w: TW - 160 - 75, a: 'l' }, { t: '대수', w: 75 }], eq.map(r => [r.name, r.spec || '', String(r.count || '')])); }
    const mt = (d.materials || []).filter(r => r && String(r.name || '').trim());
    if (mt.length) { heading(P, F, (eq.length ? '3' : '2') + '. 자재 반입'); grid(P, F, [{ t: '자재명', w: 160, a: 'l' }, { t: '규격', w: TW - 160 - 75 - 60, a: 'l' }, { t: '수량', w: 75 }, { t: '단위', w: 60 }], mt.map(r => [r.name, r.spec || '', String(r.qty || ''), r.unit || ''])); }
    let k = 2 + (eq.length ? 1 : 0) + (mt.length ? 1 : 0);
    heading(P, F, `${k++}. 금일 작업 내용`); para(P, F, d.work, '적은 내용이 없습니다.');
    heading(P, F, `${k++}. 명일 작업 계획`); para(P, F, d.plan, '적은 내용이 없습니다.');
    if (String(d.safety || '').trim()) { heading(P, F, `${k++}. 안전 관리`); para(P, F, d.safety); }
    heading(P, F, `${k++}. 특이 사항`); para(P, F, d.notes, '없음');
    const photos = d.photos || [];
    if (photos.length) {
      heading(P, F, `${k++}. 현장 사진`);
      const cw = (TW - 12) / 2, ih = 168, rowH = ih + 26;
      for (let i = 0; i < photos.length; i += 2) {
        F.need(rowH);

  async function letter(d, opts) {
    opts = opts || {};
    const P = await begin();
    const [W] = A4;
    const page = P.doc.addPage(A4);
    const pages = [page];
    let cur = page;
    let y = A4[1] - M;
    if (P.logo) { const lh = 18, lw = P.logo.width / P.logo.height * lh; cur.drawImage(P.logo, { x: M, y: y - lh, width: lw, height: lh }); }
    const from = d.from || '';

    const title = d.title || '공문';

    y -= 80;
    cur.drawLine({ start: { x: M, y }, end: { x: W - M, y }, thickness: 1.6, color: P.c(NAVY) });

    const lw = 62, cw = (TW - 2 * lw) / 2, rh = 22;
    const kv = (a, b, c2, d2) => {
      P.rect(cur, M, y - rh, lw, rh, { fill: FILL, border: LINE }); P.text(cur, a, M + (lw - P.width(a, 9.5)) / 2, y - 15, 9.5, MUTED);
      P.rect(cur, M + lw, y - rh, cw, rh, { border: LINE }); P.text(cur, P.wrap(b || '', 9.5, cw - 10)[0] || '', M + lw + 6, y - 15, 9.5, INK);
      P.rect(cur, M + lw + cw, y - rh, lw, rh, { fill: FILL, border: LINE }); P.text(cur, c2, M + lw + cw + (lw - P.width(c2, 9.5)) / 2, y - 15, 9.5, MUTED);
      P.rect(cur, M + 2 * lw + cw, y - rh, cw, rh, { border: LINE }); P.text(cur, P.wrap(d2 || '', 9.5, cw - 10)[0] || '', M + 2 * lw + cw + 6, y - 15, 9.5, INK);
      y -= rh;
    };
    kv('문서번호', d.docNo, '시행일자', d.date);
    kv('수신', d.to, '참조', d.cc);
    y -= 18;
    const need = (h) => { if (y - h < M + 30) { cur = P.doc.addPage(A4); pages.push(cur); y = A4[1] - M - 10; } };
    const lines = (s, size, indent, color, bold) => {
      for (const l of P.wrap(s, size, TW - indent)) { need(size + 7); P.text(cur, l, M + indent, y - size, size, color || INK, bold); y -= size + 7; }
    };
    lines('제목: ' + (d.subject || ''), 11.5, 0, INK, true);
    y -= 8;
    for (const p of d.body || []) {
      const t = String(p || '');
      const ind = /^\s*([가-하]\.|-|·|\(\d+\))/.test(t) ? 18 : 0;
      lines(t.trim(), 10.5, ind);
      y -= 3;
    }
    if (d.deadline) { y -= 6; lines('조치(회신) 기한: ' + d.deadline, 10.5, 0, RED, true); }
    y -= 6;
    const att = (d.attachments || []).filter(Boolean);
    lines(att.length ? `붙임  ${att.join(', ')}.  끝.` : '끝.', 10.5, 0);
    need(60);
    y -= 30;
    P.text(cur, from, W - M - P.width(from, 12), y - 12, 12, INK, true);
    y -= 30;
    // 붙임 사진
    const photos = opts.photos || [];
    if (photos.length) {
      cur = P.doc.addPage(A4); pages.push(cur); y = A4[1] - M;
      P.text(cur, '붙임: 현장 사진', M, y - 14, 12, NAVY, true); y -= 30;
      const cw2 = (TW - 12) / 2, ih = 190;
      for (let i = 0; i < photos.length; i += 2) {
        if (y - ih - 28 < M + 30) { cur = P.doc.addPage(A4); pages.push(cur); y = A4[1] - M; }
        for (let c = 0; c < 2; c++) {
          const ph = photos[i + c]; if (!ph) break;
          const x = M + c * (cw2 + 12);
          await imageBox(P, cur, ph.blob, x, y - ih, cw2, ih);
          P.text(cur, P.wrap(ph.caption || '', 8.5, cw2 - 4)[0] || '', x + 2, y - ih - 13, 8.5, MUTED);
        }
        y -= ih + 28;
      }
    }
    pages.forEach((pg, i) => P.footer(pg, i + 1, pages.length, d.site || ''));
    return P.doc.save();
  }

  App.pdfgen = { photoSheet, minutes, daily, issues, report, letter };
})();

/* 현장 사진: 찍기·가져오기, 공종·위치·메모, 사진대지 PDF */
(function () {

  async function capture() {

  function album() {

    inp.click();
  }
  async function decode(file) {
    try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch (e) {
      return await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('사진을 읽지 못했습니다')); im.src = URL.createObjectURL(file); });
    }
  }
  async function toJpeg(src, maxSide, q) {
    const w0 = src.width, h0 = src.height, k = Math.min(1, maxSide / Math.max(w0, h0));
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(w0 * k)); cv.height = Math.max(1, Math.round(h0 * k));
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(src, 0, 0, cv.width, cv.height);
    const b = await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
    const out = { blob: b, w: cv.width, h: cv.height };
    cv.width = 0;
    return out;
  }
  // 앱에서 찍은 사진을 기기 갤러리(사진/MYCM-ON 앨범)에도 남긴다 (설정에서 끌 수 있음)

    N.toGallery(file, name, p.takenAt).catch((e) => {

    });

        await App.DB.put('blobs', it.full.blob, 'ph:' + id + ':full');

  }

  // ---------- 그리기 ----------
  function render() {
    if (App.view !== 'photos') return;

          <span class="tx"><b>${esc(title(p))}</b><span><span class="chip">${esc(p.trade)}</span><span>${App.hm(p.takenAt)}</span></span></span>${p.inSheet ? '<span class="insheet">사진대지</span>' : ''}${p.issue ? '<span class="isflag">지적</span>' : ''}</button>`;

  let obs = null;
  function lazyThumbs() {
    if (obs) obs.disconnect();
    obs = new IntersectionObserver((ents) => {
      for (const en of ents) {
        if (!en.isIntersecting) continue;
        obs.unobserve(en.target);

      <button class="ph-prev" type="button" data-zoom aria-label="사진 크게 보기"><span style="color:var(--muted);font-size:14px">불러오는 중</span></button>

        <label class="lbl">층<input class="field" id="ph-floor" value="${esc(p.floor)}" list="ph-dl-floor" autocomplete="off" placeholder="3층"></label>
        <label class="lbl">부위<input class="field" id="ph-part" value="${esc(p.part)}" list="ph-dl-part" autocomplete="off" placeholder="슬래브"></label>

  // ---------- 이벤트 ----------
  $('#ph-range').addEventListener('click', (e) => { const b = e.target.closest('[data-range]'); if (!b) return; S.range = b.dataset.range; App.store.set('ph.range', S.range); render(); });
  $('#ph-trades').addEventListener('click', (e) => { const b = e.target.closest('[data-pt]'); if (b) { S.trade = b.dataset.pt; render(); } });
  $('#ph-capture').addEventListener('click', capture);

  $('#ph-grid').addEventListener('click', (e) => {

      if (!s || current() !== p) return;

      saveSoon(p); renderDetail();
      App.toast('메모에 넣었습니다. [AI로 지적사항 초안]을 누르면 메모와 사진으로 초안을 만듭니다.');
      return;
    }
    if (e.target.closest('[data-aiph]')) {
      const btn = e.target.closest('[data-aiph]');

      try {

      } catch (err) { App.toast(App.ai.msgOf(err), true, 9000); }

    }
    if (e.target.closest('[data-aino]')) { S.ai = null; const box = $('#ph-aibox'); if (box) box.innerHTML = ''; return; }
    if (e.target.closest('[data-aiyes]')) {
      const r = S.ai && S.ai.id === p.id ? S.ai.r : null; if (!r) return;
      if (r.trade && TRADES.includes(r.trade)) p.trade = r.trade;

  $('#ph-sheet').addEventListener('click', async () => {

    const v = await App.sheet({
      title: '사진대지 만들기',
      body: `<p>${fromView ? `사진대지에 넣은 사진이 없어, 지금 화면에 보이는 사진 <b>${list.length}장</b>으로 만듭니다.` : `사진대지에 넣은 사진 <b>${list.length}장</b>을 찍은 순서대로 한 쪽에 두 장씩 넣습니다.`}</p>
        <label class="lbl">제목<input class="field" id="ps-title" value="현장 사진대지" autocomplete="off"></label>
        <dl class="kv"><dt>현장</dt><dd>${esc(App.siteLabel() || '정하지 않음')}</dd><dt>기간</dt><dd>${esc(range)}</dd><dt>쪽 수</dt><dd>${Math.ceil(list.length / 2)}쪽</dd></dl>
        ${fromView ? '' : '<label style="display:flex;gap:10px;align-items:center;font-size:15px"><input type="checkbox" id="ps-clear" style="width:22px;height:22px"> 만든 뒤 사진대지 목록 비우기</label>'}`,
      actions: [{ label: '취소' }, { label: 'PDF 만들기', kind: 'primary', value: (b) => ({ title: $('#ps-title', b).value.trim() || '현장 사진대지', clear: !!($('#ps-clear', b) && $('#ps-clear', b).checked) }) }]
    });
    if (!v) return;

    let bytes;

      console.error(e); App.busy(false);
      App.toast(navigator.onLine === false && !window.PDFLib ? 'PDF 만들기 도구를 아직 받지 못했습니다. Wi-Fi에 연결한 뒤 다시 눌러 주세요.' : '사진대지를 만들지 못했습니다: ' + (e && e.message ? e.message : e), true);
      return;
    }
    App.busy(false);
    const d = new Date(lastT);
    const fname = `${v.title}_${d.getFullYear()}${App.pad2(d.getMonth() + 1)}${App.pad2(d.getDate())}.pdf`;
    const ok = await App.save(fname, new Blob([bytes], { type: 'application/pdf' }), { kind: 'photosheet' });
    if (ok && v.clear) {
      for (const p of list) { p.inSheet = false; await App.DB.put('photos', p).catch(() => {}); }
      render();
    }
  });

  narrowQ.addEventListener('change', renderDetail);

  App.views.photos = {
    show(opts) { if (opts && opts.select) { S.sel = opts.select; const p = App.photos.find(x => x.id === opts.select); if (p && !inRange(p)) S.range = 'all'; } render(); },
    hide() { clearTimeout(saveT); const p = current(); if (p) App.DB.put('photos', p).catch(() => {}); },
    capture, importFiles, render
  };
})();

  const PRESETS = ['주간 공정회의', '시공사 협의', '설계변경 협의', '안전 점검 회의'];
  const S = { sel: App.store.get('mt.sel', null), tab: 'sum', ai: null, aiFor: null, aiOk: null, audioUrl: null, audioId: null, sttOk: null, stt: null };
  let saveT = 0;
  // 앱 안 녹음 (설치형 앱에서만)
  const canRec = () => !!(App.standalone && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  const R = { on: false, mid: null, rec: null, stream: null, t0: 0, idx: 0, bytes: 0, mime: '', writes: Promise.resolve(), timer: 0 };
  const fmtDur = (ms) => { const t = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(t / 3600), mm = Math.floor((t % 3600) / 60), ss = t % 60; return (h ? h + ':' + App.pad2(mm) : mm) + ':' + App.pad2(ss); };
  const chunkKey = (id, i) => `mt:${id}:rec:${String(i).padStart(6, '0')}`;

  const emptySum = () => ({ decisions: [], todos: [], next: '' });
  const siteMeetings = () => App.meetings.filter(App.inSite).sort((a, b) => (b.date || 0) - (a.date || 0));
  const cur = () => App.meetings.find(m => m.id === S.sel) || null;
  const hasSum = (m) => !!(m.summary && ((m.summary.decisions || []).some(s => s.trim()) || (m.summary.todos || []).some(t => (t.task || '').trim()) || (m.summary.next || '').trim()));
  function when(m) { const d = new Date(m.date); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]}) ${App.hm(m.date)}`; }
  function status(m) {
    if (R.on && R.mid === m.id) return ['red', '녹음 중'];
    if (S.stt && S.stt.mid === m.id) return ['warn', '글로 바꾸는 중'];
    { const pj = App.sync && App.sync.sttJob ? App.sync.sttJob(m.id) : null; if (pj && ['send', 'wait', 'run'].includes(pj.status)) return ['warn', 'PC가 글로 바꾸는 중']; }
    if (m.sample) return ['gray', '예시'];
    if (hasSum(m)) return ['ok', '정리 완료'];
    if ((m.lines || []).length || m.audio) return ['warn', '기록 중'];
    return ['gray', '새 회의'];
  }
  function touch(m) {
    m.updatedAt = Date.now();
    clearTimeout(saveT);
    saveT = setTimeout(() => { App.DB.put('meetings', m).catch(() => App.toast('회의 기록을 저장하지 못했습니다. 저장 공간을 확인해 주세요.', true)); if (App.sync) App.sync.meetingChanged(m); }, 450);
  }
  function saveNow(m) { clearTimeout(saveT); m.updatedAt = Date.now(); if (App.sync) App.sync.meetingChanged(m); return App.DB.put('meetings', m).catch(() => App.toast('회의 기록을 저장하지 못했습니다.', true)); }

  // ---------- AI 사용 가능 여부 ----------
  function checkAi() {
    if (S.aiOk !== null) return;
    S.aiOk = 'wait';
    App.use('sample').then(s => { S.aiOk = s ? 'yes' : 'no'; if (App.view === 'minutes') renderMain(); });
  }

  // ---------- 목록 ----------
  function renderList() {

    if (!list.length) {

    box.innerHTML = list.map(m => {
      const [c, t] = status(m);
      return `<button class="mitem" type="button" data-mt="${esc(m.id)}" aria-current="${m.id === S.sel}"><span class="top"><b>${esc(m.title || '제목 없는 회의')}</b><span class="chip ${c}">${t}</span></span><span class="s">${esc(when(m))}${m.place ? ' · ' + esc(m.place) : ''}</span></button>`;
    }).join('');
  }

  // ---------- 본문 ----------
  function renderMain() {
    const main = $('#mt-main');
    const m = cur();
    if (!m) {
      main.innerHTML = `<div class="card empty-block" style="flex:1"><b>회의를 고르거나 새로 만드세요</b><span>녹음은 기기의 녹음 앱으로 하고, 글로 바꾼 기록을 붙여 넣으면 결정 사항과 할 일로 정리할 수 있습니다.</span><button class="btn primary" type="button" data-new>새 회의</button></div>`;
      return;
    }
    const lines = m.lines || [];
    const recHere = R.on && R.mid === m.id;
    const audioBox = recHere
      ? `<div class="rec-live" role="status"><b><i class="dot" aria-hidden="true"></i>녹음 중 <span id="mt-rec-time" class="num">${fmtDur(Date.now() - R.t0)}</span></b><span class="hint">녹음하는 동안 화면은 꺼지지 않습니다. 앱을 닫거나 다른 앱으로 넘어가지 마세요. 끝나면 버튼을 다시 누르세요.</span></div>`
      : R.on ? `<div class="hint">다른 회의를 녹음하고 있습니다. 그 회의에서 녹음을 멈춘 뒤 녹음할 수 있습니다.</div>`
      : m.audio
      ? `<audio controls preload="metadata" id="mt-audio-el"></audio>${S.sttOk === true ? `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn sm ${(m.lines || []).length ? '' : 'primary'}" type="button" data-stt${S.stt ? ' disabled' : ''}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M4 12h16M4 17h12"/></svg>녹음을 글로 바꾸기</button><span class="hint">인터넷 없이 기기 안에서 바꿉니다</span></div>` : pcSttHtml(m)}<div class="hint">${esc(m.audio.name)} · ${App.sizeKo(m.audio.size || 0)} <button class="linkbtn" type="button" data-audio-save>파일로 저장</button> <button class="linkbtn" type="button" data-audio-pick>바꾸기</button> <button class="linkbtn danger" type="button" data-audio-rm>지우기</button></div>`
      : `<div class="hint">${canRec() ? '빨간 버튼을 누르면 바로 녹음을 시작합니다.' : '빨간 버튼을 누르면 기기의 녹음 앱이 열리고, 녹음을 마치면 이 회의에 붙습니다.'} 이미 녹음한 파일은 <button class="linkbtn" type="button" data-audio-pick>파일에서 고르기</button></div>`;
    const aiBtn = S.aiOk === 'no' ? '' : `<button class="btn sm ${hasSum(m) ? '' : 'primary'}" type="button" data-ai${S.ai ? ' disabled' : ''}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>AI로 정리</button>`;
    main.innerHTML = `
      <section class="card mt-rec">
        <button class="recbtn${recHere ? ' on' : ''}" type="button" data-rec aria-label="${recHere ? '녹음 멈추기' : canRec() ? '녹음 시작' : '녹음 앱으로 녹음하기'}"${R.on && !recHere ? ' disabled' : ''}>${recHere ? '<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>' : '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>'}</button>
        <div class="mt-meta">
          <input class="ttl" id="mt-title" value="${esc(m.title)}" aria-label="회의 이름" autocomplete="off" maxlength="80">
          <div class="s">${esc(when(m))}${m.place ? ' · ' + esc(m.place) : ''}${m.attendees ? ' · ' + esc(m.attendees) : ''} <button class="linkbtn" type="button" data-info>정보 고치기</button></div>
        </div>
        <div class="mt-audio">${audioBox}</div>
      </section>
      <section class="card mt-card">
        <div class="mtabs" role="tablist">
          <button type="button" role="tab" data-tab="sum" aria-selected="${S.tab === 'sum'}">요약</button>
          <button type="button" role="tab" data-tab="lines" aria-selected="${S.tab === 'lines'}">전체 기록 <span class="num" style="color:var(--muted);font-weight:500">${lines.length}</span></button>
          <span class="sp"></span>
          <button class="linkbtn" type="button" data-paste>기록 붙여넣기</button>
          ${aiBtn}
        </div>
        <div id="mt-pane" style="flex:1"></div>
        <div class="mt-foot">
          <button class="btn primary" type="button" data-pdf><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>회의록 PDF 만들기</button>
          <button class="btn" type="button" data-copytodo>할 일 복사</button>
          <span class="grow"></span>
          <button class="btn danger" type="button" data-delmt>회의 지우기</button>
        </div>
      </section>`;
    renderPane();
    if (m.audio) loadAudio(m);
  }

  // ---------- 녹음을 글로 바꾸기 (설치형 앱, 인터넷 없이) ----------
  function checkStt() {
    if (S.sttOk !== null) return;
    S.sttOk = 'wait';
    const st = App.standalone && window.MYCM_NATIVE && window.MYCM_NATIVE.stt;
    if (!st) { S.sttOk = false; return; }
    st.info().then(i => { S.sttOk = !!(i && i.available); if (App.view === 'minutes') renderMain(); });
  }
  // ---------- 현장 PC에서 글로 바꾸기 (휴대폰 웹앱·엔진 없는 기기) ----------
  const LINES_IC = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M4 12h16M4 17h12"/></svg>';
  function pcSttHtml(m) {
    if (S.sttOk === true || !m.audio || m.recording) return '';
    const sy = App.sync;
    if (!sy || !sy.configured) return App.pwa ? `<div class="hint">현장 PC와 연결하면 PC가 이 녹음을 인터넷 없이 글로 바꿔 줍니다. <button class="linkbtn" type="button" data-pcstt-link>PC 연동</button></div>` : '';
    if (!sy.sttAvailable) return '';
    const j = sy.sttJob(m.id) || {};
    const sig = (j.status || 'none') + ':' + (m.lines || []).length;
    if (j.status === 'send' || j.status === 'wait' || j.status === 'run') {
      const pct = Math.round((j.progress || 0) * 100);
      const label = j.status === 'send' ? '녹음을 현장 PC로 보내는 중' : j.status === 'wait' ? `현장 PC 차례를 기다리는 중${j.ahead ? ` (앞에 ${j.ahead}개)` : ''}` : '현장 PC가 글로 바꾸는 중';
      return `<div class="stt-run" id="mt-pcstt" data-sig="${sig}" role="status"><div class="row"><b>${label}${j.status === 'run' ? ` · <span class="num" id="mt-pcstt-pct">${pct}%</span>` : ''}</b><button class="btn sm" type="button" data-pcstt-stop>멈추기</button></div>
        <div class="track"><div class="fill" id="mt-pcstt-fill" style="width:${j.status === 'run' ? pct : 0}%"></div></div>
        <span class="hint">다른 화면으로 가거나 앱을 닫아도 현장 PC가 계속 바꿉니다. 끝나면 이 회의 기록에 자동으로 들어옵니다.</span></div>`;
    }
    const fail = j.status === 'fail' ? `<span class="hint" style="color:var(--red-ink, #b3261e)">글로 바꾸지 못했습니다: ${esc(j.error || '')}</span>` : '';
    return `<div id="mt-pcstt" data-sig="${sig}" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn sm ${(m.lines || []).length ? '' : 'primary'}" type="button" data-pcstt>${LINES_IC}${j.status === 'done' ? 'PC에서 다시 글로 바꾸기' : 'PC에서 글로 바꾸기'}</button><span class="hint">${j.status === 'done' ? `현장 PC가 바꿨습니다 · ${j.segs || 0}줄` : '현장 PC가 인터넷 없이 바꿔서 돌려줍니다'}</span>${fail}</div>`;
  }
  async function runPcStt(m) {
    if (R.on && R.mid === m.id) { App.toast('녹음을 멈춘 뒤 글로 바꿀 수 있습니다.'); return; }
    let mode = '';
    if ((m.lines || []).length) {
      const v = await App.sheet({
        title: 'PC에서 글로 바꾸기',
        body: `<p style="margin:0">이 회의에는 이미 기록 ${(m.lines || []).length}줄이 있습니다. 현장 PC가 바꾼 글을 어떻게 넣을까요?</p>`,
        actions: [{ label: '취소' }, { label: '뒤에 붙이기', value: 'append' }, { label: '지금 기록 지우고 넣기', kind: 'primary', value: 'replace' }]
      });
      if (!v) return;
      mode = v;
    } else mode = 'replace';
    await App.sync.sttRequest(m, mode);
    App.toast('녹음을 현장 PC로 보냈습니다. PC가 글로 바꾸면 이 회의 기록에 자동으로 들어옵니다.', false, 6000);
    renderMain();
  }
  window.addEventListener('mycm:stt', () => {
    if (App.view !== 'minutes') return;
    const m = cur(); if (!m) return;
    const j = App.sync && App.sync.sttJob(m.id);
    const box = $('#mt-pcstt');
    const sig = ((j && j.status) || 'none') + ':' + (m.lines || []).length;
    const updPct = () => { const pct = Math.round(((j && j.progress) || 0) * 100), a = $('#mt-pcstt-pct'), f = $('#mt-pcstt-fill'); if (a) a.textContent = pct + '%'; if (f) f.style.width = pct + '%'; };
    if (box && box.dataset.sig === sig) { updPct(); return; }
    const main = $('#mt-main'), ae = document.activeElement;
    if (main && ae && main.contains(ae) && ae.matches('input, textarea, [contenteditable="true"]')) { updPct(); return; }
    renderList(); renderMain();
  });

  // 건설 용어집: 현장 PC에서 받은 것(설정 › 음성 인식에서 고친 목록), 없으면 앱에 든 기본 목록
  const sttTerms = () => (App.store.get('sttTerms', '') || window.MYCM_TERMS || '');
  function termList() {
    const out = [];
    for (const raw of sttTerms().split('\n')) {
      const l = raw.trim(); if (!l || l.startsWith('#')) continue;
      const i = l.indexOf('=>'); const t = (i >= 0 ? l.slice(i + 2) : l).trim();
      if (t && !out.includes(t)) out.push(t);
    }
    return out;
  }
  const clock = (sec) => { const t = Math.max(0, Math.floor(sec)); const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), ss = t % 60; return (h ? h + ':' + App.pad2(m) : App.pad2(m)) + ':' + App.pad2(ss); };
  function sttHtml(m) {
    if (!S.stt || S.stt.mid !== m.id) return '';
    const pct = Math.round((S.stt.frac || 0) * 100);
    const label = S.stt.phase === 'copy' ? '녹음 파일 준비 중' : pct < 8 ? '녹음 크기 재는 중' : '녹음을 글로 바꾸는 중';
    return `<div class="stt-run" role="status"><div class="row"><b>${label} · <span class="num" id="mt-stt-pct">${pct}%</span></b><button class="btn sm" type="button" data-stt-stop>멈추기</button></div>
      <div class="track"><div class="fill" id="mt-stt-fill" style="width:${pct}%"></div></div>
      <span class="hint">인터넷 없이 기기 안에서 바꿉니다. 1시간 녹음은 10~20분쯤 걸릴 수 있으니 화면을 켜 둔 채 기다려 주세요. 다른 화면으로 가도 계속됩니다.</span></div>`;
  }
  async function runStt(m) {
    if (S.stt) { App.toast('이미 다른 녹음을 글로 바꾸는 중입니다.'); return; }
    if (R.on) { App.toast('녹음을 멈춘 뒤 글로 바꿀 수 있습니다.'); return; }
    const blob = await App.DB.get('blobs', 'mt:' + m.id + ':audio').catch(() => null);
    if (!blob) { App.toast('녹음 파일을 찾지 못했습니다.', true); return; }
    let mode = 'append';
    if ((m.lines || []).length) {
      const v = await App.sheet({
        title: '녹음을 글로 바꾸기',
        body: `<p style="margin:0">이 회의에는 이미 기록 ${(m.lines || []).length}줄이 있습니다. 녹음에서 바꾼 글을 어떻게 넣을까요?</p>`,
        actions: [{ label: '취소' }, { label: '뒤에 붙이기', value: 'append' }, { label: '지금 기록 지우고 넣기', kind: 'primary', value: 'replace' }]
      });
      if (!v) return;
      mode = v;
    }
    const ext = ((m.audio && m.audio.name) || '').split('.').pop().toLowerCase() || 'm4a';
    const fresh = [];
    S.stt = { mid: m.id, frac: 0, phase: 'copy', t0: Date.now() };
    if (window.MYCM_NATIVE) window.MYCM_NATIVE.keepAwake(true);
    S.tab = 'lines';
    if (mode === 'replace') m.lines = [];
    if (App.view === 'minutes') renderMain();
    const upd = () => {
      if (App.view !== 'minutes' || S.sel !== m.id) return;
      const pct = Math.round((S.stt.frac || 0) * 100);
      const a = $('#mt-stt-pct'), f = $('#mt-stt-fill');
      if (a) a.textContent = pct + '%'; if (f) f.style.width = pct + '%';
    };
    try {
      const r = await window.MYCM_NATIVE.stt.transcribe(blob, ext, (ev) => {
        S.stt.phase = 'run';
        S.stt.frac = ev.frac || S.stt.frac;
        const segs = ev.segments || [];
        if (segs.length) {
          for (const sg of segs) { const l = { id: App.uid(), who: '', at: clock(sg.start), sec: Math.round(sg.start * 10) / 10, text: sg.text }; fresh.push(l); (m.lines = m.lines || []).push(l); }
          touch(m);
          if (App.view === 'minutes' && S.sel === m.id && S.tab === 'lines') renderPane(); else upd();
        } else upd();
      }, (f) => { S.stt.frac = 0; upd(); }, sttTerms());
      // 진행 알림으로 못 받은 줄이 있으면 마지막 결과로 맞춘다
      const all = (r && r.segments) || [];
      if (all.length > fresh.length) {
        for (const sg of all.slice(fresh.length)) { const l = { id: App.uid(), who: '', at: clock(sg.start), sec: Math.round(sg.start * 10) / 10, text: sg.text }; fresh.push(l); (m.lines = m.lines || []).push(l); }
      }
      if (m.sample) m.sample = false;
      await saveNow(m);
      const sec = Math.round((Date.now() - S.stt.t0) / 1000);
      const took = sec < 60 ? `${sec}초` : `약 ${Math.round(sec / 60)}분`;
      App.toast(fresh.length
        ? `글로 바꿨습니다: ${fresh.length}줄 (${took} 걸림). 말한 사람은 구분되지 않으니, 줄을 눌러 고쳐 주세요.${S.aiOk === 'yes' ? ' 요약 탭에서 AI로 정리할 수 있습니다.' : ''}`
        : '녹음에서 알아들을 수 있는 말을 찾지 못했습니다. 녹음 소리가 너무 작거나 잡음이 많을 수 있습니다.', !fresh.length, 9000);
    } catch (e) {
      const code = e && e.code;
      await saveNow(m);
      if (code === 'cancelled') App.toast(`멈췄습니다. 그때까지 바꾼 ${fresh.length}줄은 남겨 두었습니다.`);
      else if (code === 'no_model') App.toast('이 앱에는 음성 인식 모델이 들어 있지 않습니다. 새 버전을 설치해 주세요.', true);
      else if (code === 'memory') App.toast(e.message || '기기 메모리가 부족합니다. 다른 앱을 닫고 다시 해 주세요.', true, 9000);
      else App.toast('글로 바꾸지 못했습니다: ' + ((e && e.message) || e), true, 9000);
    } finally {
      S.stt = null;
      if (window.MYCM_NATIVE) window.MYCM_NATIVE.keepAwake(false);
      if (App.view === 'minutes') { renderList(); renderMain(); }
    }
  }

  function renderPane() {
    const pane = $('#mt-pane'); if (!pane) return;
    const m = cur(); if (!m) return;
    if (S.tab === 'lines') { pane.innerHTML = sttHtml(m) + linesHtml(m); const tl = pane.querySelector('.tlines'); if (S.stt && S.stt.mid === m.id && tl && tl.lastElementChild) tl.lastElementChild.scrollIntoView({ block: 'nearest' }); return; }
    if (S.ai && S.aiFor === m.id) {
      pane.innerHTML = `<div class="ai-wait" role="status"><b style="color:var(--ink);font-size:16px">AI가 회의 기록을 정리하고 있습니다</b><span>기록 ${(m.lines || []).length}줄을 읽고 결정 사항과 할 일을 뽑는 중입니다. 보통 30초에서 1분쯤 걸립니다.</span><div class="bar"><i></i></div><button class="btn sm" type="button" data-ai-stop>멈추기</button></div>`;
      return;
    }

    const hint = !hasSum(m)

    catch (e) {
      App.toast('마이크를 쓸 수 없습니다. 기기 설정 › 애플리케이션 › MYCM-ON › 권한에서 마이크를 허용해 주세요.', true, 10000);
      return;
    }
    const mime = ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(t => { try { return MediaRecorder.isTypeSupported(t); } catch (e) { return false; } }) || '';
    let rec;
    try { rec = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 64000 } : undefined); }
    catch (e) { stream.getTracks().forEach(t => t.stop()); App.toast('이 기기에서는 앱 안 녹음을 쓸 수 없습니다. 녹음 앱으로 녹음한 뒤 파일에서 골라 주세요.', true); return; }
    for (const k of await App.DB.keys('blobs', `mt:${m.id}:rec:`).catch(() => [])) await App.DB.del('blobs', k).catch(() => {});
    Object.assign(R, { on: true, mid: m.id, rec, stream, t0: Date.now(), idx: 0, bytes: 0, mime: rec.mimeType || mime || 'audio/webm', writes: Promise.resolve() });
    m.recording = { startedAt: R.t0, mime: R.mime };
    if (m.sample) m.sample = false;
    await saveNow(m);
    rec.ondataavailable = (e) => {
      if (!e.data || !e.data.size) return;
      const k = chunkKey(m.id, R.idx++), blob = e.data;
      R.bytes += blob.size;
      R.writes = R.writes.then(() => App.DB.put('blobs', blob, k)).catch(() => { App.toast('녹음을 저장하지 못하고 있습니다. 기기 저장 공간을 확인해 주세요.', true); });
    };

    stream.getAudioTracks().forEach(t => { t.onended = () => { if (R.on) stopRec(); }; });

  async function stopRec() {

    stream.getTracks().forEach(t => t.stop());

  async function finalizeRec(mid, durMs) {
    const m = App.meetings.find(x => x.id === mid);
    const keys = (await App.DB.keys('blobs', `mt:${mid}:rec:`).catch(() => [])).sort();
    if (!m) return null;
    if (!keys.length) { m.recording = null; await saveNow(m); return null; }
    const parts = [];
    for (const k of keys) { const b = await App.DB.get('blobs', k).catch(() => null); if (b) parts.push(b); }
    const mime = (m.recording && m.recording.mime) || 'audio/webm';
    const blob = new Blob(parts, { type: mime.split(';')[0] });
    await App.DB.put('blobs', blob, `mt:${mid}:audio`);
    for (const k of keys) await App.DB.del('blobs', k).catch(() => {});
    const d = new Date((m.recording && m.recording.startedAt) || Date.now());
    const ext = /mp4/.test(mime) ? 'm4a' : /ogg/.test(mime) ? 'ogg' : 'webm';
    const dur = durMs || (parts.length * 4000);
    m.audio = { name: `녹음_${safeName(m.title)}_${d.getFullYear()}${App.pad2(d.getMonth() + 1)}${App.pad2(d.getDate())}_${App.pad2(d.getHours())}${App.pad2(d.getMinutes())}.${ext}`, size: blob.size, type: blob.type, dur };
    m.recording = null;
    await saveNow(m);
    S.audioId = null;
    return { dur };
  }

  const TS = /^(.{0,24}?)\s*[\[(]?((?:\d{1,2}:)?\d{1,2}:\d{2})[\])]?\s*$/;
  function parseTranscript(raw) {
    const rows = raw.replace(/\r\n?/g, '\n').split('\n');
    const out = [];
    let curL = null;
    const isHeader = (s) => { const k = TS.exec(s.trim()); return k && s.trim().length <= 34 ? k : null; };
    const hasHeaders = rows.filter(r => isHeader(r)).length >= 2;
    for (const r0 of rows) {
      const r = r0.trim();
      if (!r) { if (curL && curL.text) curL = hasHeaders ? curL : null; continue; }
      if (hasHeaders) {
        const h = isHeader(r);
        if (h) { curL = { id: App.uid(), who: h[1].trim(), at: h[2], text: '' }; out.push(curL); continue; }
        if (!curL) { curL = { id: App.uid(), who: '', at: '', text: '' }; out.push(curL); }
        curL.text = curL.text ? curL.text + ' ' + r : r;
        continue;
      }
      const c = /^([^:：]{1,14})[:：]\s*(.+)$/.exec(r);
      if (c && !/^\d+$/.test(c[1])) out.push({ id: App.uid(), who: c[1].trim(), at: '', text: c[2].trim() });
      else out.push({ id: App.uid(), who: '', at: '', text: r });
    }
    return out.filter(l => l.text.trim());
  }

        ${had ? `<label style="display:flex;gap:10px;align-items:center;font-size:15px"><input type="checkbox" id="ps-replace" style="width:22px;height:22px"> 지금 기록 ${had}줄을 지우고 바꾸기</label>` : ''}`,

  function buildPrompt(m) {

건설 용어집: ${termList().slice(0, 400).join(', ')}

  const AI_MSG = {

    invalid_json: 'AI 정리 결과를 읽지 못했습니다. 한 번 더 눌러 주세요.',
    empty_completion: 'AI가 정리 결과를 내지 않았습니다. 기록을 확인한 뒤 다시 눌러 주세요.',
    refused: 'AI가 이 기록을 정리하지 않았습니다. 결정 사항과 할 일을 직접 적어 주세요.',
    session_expired: 'claude.ai 로그인이 끝났습니다. 다시 로그인한 뒤 눌러 주세요.',
    bad_key: 'AI 키가 맞지 않거나 사용이 막혀 있습니다. 설정에서 키를 확인해 주세요.',
    bad_model: 'AI 모델을 쓸 수 없습니다. 관리자에게 API 키 권한을 확인해 달라고 해 주세요.',
    offline: 'AI 정리는 인터넷 연결이 필요합니다. Wi-Fi가 되는 곳에서 눌러 주세요.'
  };
  const AI_OFF = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];
  async function runAi() {
    const m = cur(); if (!m || S.ai) return;
    if (!(m.lines || []).some(l => l.text.trim())) { App.toast('정리할 기록이 없습니다. 먼저 기록 붙여넣기로 내용을 넣어 주세요.'); S.tab = 'lines'; renderMain(); return; }
    if (navigator.onLine === false) { App.toast('AI 정리는 인터넷 연결이 필요합니다. Wi-Fi가 되는 곳에서 눌러 주세요.', true); return; }
    if (hasSum(m) && !m.sample) {
      const ok = await App.confirm('AI로 다시 정리', '지금 적혀 있는 결정 사항과 할 일을 AI 정리 결과로 바꿉니다.', '바꾸기');
      if (!ok) return;
    }
    const sample = await App.use('sample');
    if (!sample) { S.aiOk = 'no'; renderMain(); App.toast(App.standalone ? '설정에 AI 키를 넣어야 AI 정리를 쓸 수 있습니다.' : '이 화면에서는 AI 정리를 쓸 수 없습니다. 결정 사항과 할 일을 직접 적어 주세요.', true); return; }
    const ctl = new AbortController();
    S.ai = ctl; S.aiFor = m.id; S.tab = 'sum';
    renderMain();
    try {
      const r = await sample.json(buildPrompt(m), { signal: ctl.signal });
      const arr = (x) => Array.isArray(x) ? x : [];
      const str = (x) => (typeof x === 'string' ? x : x == null ? '' : String(x)).trim();
      const sum = {
        decisions: arr(r && r.decisions).map(str).filter(Boolean).slice(0, 12),
        todos: arr(r && r.todos).map(t => ({ task: str(t && t.task), owner: str(t && t.owner), due: str(t && t.due), st: 0 })).filter(t => t.task).slice(0, 15),
        next: str(r && r.next)
      };
      if (!sum.decisions.length && !sum.todos.length && !sum.next) throw { code: 'empty_completion' };
      m.summary = sum;
      // AI가 찾은 잘못 알아들은 말 고치기 (기록에 그대로 있는 2글자 이상만)
      let fixed = 0;
      for (const f of arr(r && r.fixes).slice(0, 30)) {
        const a = str(f && f.from), b = str(f && f.to);
        if (a.length < 2 || !b || a === b || b.length > a.length * 3 + 4) continue;
        for (const l of m.lines || []) { if (l.text && l.text.includes(a)) { const n = l.text.split(a).length - 1; l.text = l.text.split(a).join(b); fixed += n; } }
      }
      S.fixed = fixed;
      if (m.sample) m.sample = false;
      await saveNow(m);
      App.toast(S.fixed ? `AI 정리를 마쳤습니다. 잘못 알아들은 건설 용어 ${S.fixed}곳도 고쳤습니다. 내용을 확인해 주세요.` : 'AI 정리를 마쳤습니다. 내용을 확인하고 필요하면 고쳐 주세요.');
    } catch (e) {
      const code = e && e.code;
      if (code === 'cancelled') { /* 멈춤 */ }
      else if (AI_OFF.includes(code)) { S.aiOk = 'no'; App.toast(App.standalone ? '설정에 AI 키를 넣어야 AI 정리를 쓸 수 있습니다. 결정 사항과 할 일은 직접 적어도 됩니다.' : 'AI 정리를 허락하지 않아 쓸 수 없습니다. 결정 사항과 할 일을 직접 적어 주세요.', true); }
      else App.toast(AI_MSG[code] || (e && e.message) || 'AI 정리 중 연결이 끊겼습니다. Wi-Fi를 확인하고 다시 눌러 주세요.', true, 8000);
    } finally {
      if (S.ai === ctl) { S.ai = null; S.aiFor = null; }
      if (App.view === 'minutes') { renderList(); renderMain(); }
    }
  }

/* PC 연동: 기기에서 만든 사진대지·회의록·필기 PDF와 자료함 문서를 현장 PC(MYCM-ON 현장 PC 프로그램)로 올린다.

 * - 올릴 것은 기기 저장소(outbox)에 쌓아 두므로 앱을 꺼도 사라지지 않는다.
 * - 설치형 앱(APK)에서만 동작한다. */
(function () {
  'use strict';

  const HTTPS_PAGE = location.protocol === 'https:';

  const ONE_SHOT = 3 * 1048576;   // 이보다 작으면(사진 등) 한 번에, 크면 끊겨도 이어 올리게 2MB씩
  const b64url = (t) => btoa(unescape(encodeURIComponent(t))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const Lan = ON && window.Capacitor && window.Capacitor.registerPlugin ? window.Capacitor.registerPlugin('LanFind') : null;
  async function findPCs(scan, subnets) {
    if (!Lan) return { servers: [], wifi: true, none: true };

  // PC 주소가 바뀐 경우(공유기가 새 주소를 줌): 같은 PC를 다시 찾아 주소를 고친다
  let lastRelocate = 0;
  async function relocate() {
    if (!S.cfg || !S.cfg.serverId || !Lan || Date.now() - lastRelocate < 60e3) return false;
    lastRelocate = Date.now();
    const m = /^https?:\/\/(\d+\.\d+\.\d+\.)\d+/.exec(S.cfg.url || '');
    const r = await findPCs(true, m ? [m[1]] : []);

    return false;
  }
  // 현장 PC에 닿는 길 찾기: 방금 된 주소 → 사무실 주소 → 인터넷 주소 → (사무실에서 다시 찾기) → (알림 채널에서 새 인터넷 주소)

    const tried = new Set();

      const p = await call('/api/t/ping?user=' + encodeURIComponent(App.userName || ''), { base: u, timeout: to || (via === 'net' ? 12000 : 5000) }).catch(() => null);

  // 회의: 기록·결정 사항·할 일은 고칠 때마다 (마지막 것만), 녹음은 끝나면 한 번
  const mtgT = {};
  function meetingChanged(m) {

  // 자료함에 넣은 파일 (원본은 blobs에 이미 있으니 가리키기만)
  function addLibrary(rec) {

  // ---------------- 올리기 ----------------
  async function refresh() {
    let all = [];
    try { all = await App.DB.all('outbox'); } catch (e) { all = []; }
    S.counts.wait = all.filter(r => r.state === 'wait' || r.state === 'up').length;
    S.counts.err = all.filter(r => r.state === 'err').length;
    renderChip();
    return all;
  }
  function kick(ms) { if (S.running) { S.again = true; return; } clearTimeout(S.nextT); S.nextT = setTimeout(pump, ms || 0); }
  async function pump() {
    if (!configured() || S.running) return;
    if (!navigator.onLine || !onWifiRule()) { S.reach = navigator.onLine ? 'wifi' : 'offline'; renderChip(); return; }
    S.running = true;
    try {
      // 20초 안에 주고받은 길이 있으면 다시 확인(ping)하지 않고 바로 올린다
      const fresh = S.base && S.reach === 'ok' && Date.now() - (S.okAt || 0) < 20e3 && Date.now() - (S.pingAt || 0) < 300e3 && !(S.via === 'net' && !HTTPS_PAGE && Date.now() - (S.lanTryAt || 0) > 60e3);
      const hit = fresh ? { u: S.base, via: S.via, p: null } : await connect();
      if (!hit) { S.reach = 'down'; S.base = ''; S.lastErr = '현장 PC에 닿지 않습니다. 현장 PC가 켜져 있고 인터넷에 연결되어 있는지 확인해 주세요. 연결되면 바로 올립니다'; throw new Error('down'); }
      if (hit.revoked) { revoked(); return; }
      S.base = hit.u; S.via = hit.via;
      const pj = hit.p ? hit.p.j : {};
      if (hit.p) { S.waitOK = !!pj.wait; S.pingAt = Date.now(); }
      let dirty = false;
      if (pj.name && pj.name !== S.cfg.name) { S.cfg.name = pj.name; dirty = true; }
      if (pj.tunnel && pj.tunnel !== S.cfg.tunnel) { S.cfg.tunnel = pj.tunnel; dirty = true; }
      if (pj.relay && pj.relay !== S.cfg.relay) { S.cfg.relay = pj.relay; S.cfg.relayBase = pj.relayBase || ''; dirty = true; }
      if (dirty) App.store.set('sync', S.cfg);
      S.reach = 'ok'; S.lastErr = '';
      if (hit.p) setAI(pj);
      renderChip();
      waitLoop();
      for (;;) {
        const all = await refresh();
        const next = all.filter(r => r.state === 'wait' || r.state === 'up').sort((a, b) => a.createdAt - b.createdAt)[0];
        if (!next) break;
        await uploadOne(next);
      }
      await pullInbox().catch((e) => { if (e && e.message === 'revoked') throw e; console.warn('inbox', e); });
      await sttSync().catch((e) => console.warn('stt', e));
      S.backoff = 0;
      await prune();
    } catch (e) {
      if (e && e.message !== 'down') {
        const net = e.name === 'TypeError' || e.name === 'AbortError';
        S.lastErr = net ? '연결이 끊겼습니다. 다시 연결되면 이어서 올립니다' : (e.message || String(e));
        if (S.reach === 'ok') S.reach = navigator.onLine ? 'down' : 'offline';
      }
      // PC가 꺼져 있으면 천천히(30초~5분), 잠깐 끊긴 것이면 빨리(5·10·20초…최대 2분) 다시
      S.backoff = e && e.message === 'down' ? Math.min(300e3, (S.backoff || 15e3) * 2) : Math.min(120e3, S.backoff ? S.backoff * 2 : 5e3);
      clearTimeout(S.nextT); S.nextT = setTimeout(pump, S.backoff);

      renderSheet();
      if (S.again) { S.again = false; if (!S.backoff) kick(200); } // 올리는 동안 들어온 부탁(배포 취소 등)은 끝나고 바로 한 번 더
    }
  }
  // PC에서 파일을 보내면 바로 알도록 요청 하나를 걸어 둔다 (화면이 켜져 있을 때만, 25초마다 새로)
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  async function waitLoop() {
    if (S.waiting || !S.waitOK) return;
    S.waiting = true;
    let v = -1, fails = 0;
    try {
      while (configured() && S.waitOK && !document.hidden && S.base) {
        const st = await call('/api/t/wait?v=' + v, { timeout: 40000 }).catch(() => null);
        if (!st || !st.ok) {
          if (st && (st.status === 404 || st.status === 405)) { S.waitOK = false; break; }
          if (st && st.status === 401) { kick(0); break; }
          if (++fails >= 3) break;
          await sleep(5000); continue;
        }
        fails = 0;
        if (v !== -1 && st.j.v !== v) kick(150);
        v = st.j.v;
      }
    } finally { S.waiting = false; }
  }
  function revoked() {
    if (!S.cfg.revoked) S.cfg.revokedAt = Date.now();
    S.cfg.revoked = true; App.store.set('sync', S.cfg);
    S.reach = 'revoked'; S.lastErr = '현장 PC에서 이 기기의 연결을 끊었습니다';
    S.base = '';
    renderChip();
  }
  // 현장 PC의 AI 상태 (ping): 'on' 씀 · 'off' 키 없음/기기 끔 · 'old' AI가 없는 옛 PC 프로그램
  function setAI(pj) {
    const st = pj.ai === undefined ? 'old' : pj.ai ? 'on' : 'off';
    const docs = !!pj.docs;
    if (st === S.ai && docs === S.docs) return;
    S.ai = st; S.docs = docs;
    try { window.dispatchEvent(new CustomEvent('mycm:ai', { detail: { ai: st, docs } })); } catch (e) { /* 무시 */ }
  }
  // AI 부탁 전에: 지금 닿는 길이 없으면 찾는다
  async function ensure(force) {
    if (!configured()) return false;
    if (!force && S.reach === 'ok' && S.base) return true;
    const hit = await connect().catch(() => null);
    if (!hit) { if (S.reach === 'ok') S.reach = 'down'; renderChip(); return false; }
    if (hit.revoked) { revoked(); return false; }
    S.base = hit.u; S.via = hit.via; S.reach = 'ok';
    setAI(hit.p.j);
    renderChip();

  }
  async function fail(r, msg) { r.state = 'err'; r.err = msg; r.tries++; await App.DB.put('outbox', r); }
  // 다 보냈다고 적기 (보내는 사이에 새로 쌓였으면 그대로 둔다)
  async function finish(r) {
    const curR = await App.DB.get('outbox', r.id).catch(() => null);
    if (curR && curR.rev && curR.rev !== r.rev) return;
    r.state = 'done'; r.doneAt = Date.now(); r.sent = r.size || 0; delete r.blob; delete r.err;
    await App.DB.put('outbox', r);

  }
  const okOrThrow = (st) => { if (st.status === 401) { revoked(); throw new Error('revoked'); } if (!st.ok) throw new Error(st.j.error || ('현장 PC 오류 ' + st.status)); };
  async function sendMeta(r) {
    const p = App.photos.find(x => x.id === r.pid);
    if (!p) return finish(r);   // 기기에서 지운 사진
    const st = await call('/api/t/meta', { method: 'POST', json: { type: 'photo', id: p.id, meta: photoMeta(p) } });
    okOrThrow(st);
    if (st.j.missing) { await App.DB.del('outbox', 'ph:' + p.id).catch(() => {}); await addPhoto(p); }   // 현장 PC에 사진이 없으면 사진째 다시
    return finish(r);
  }
  async function sendMeeting(r) {
    const m = App.meetings.find(x => x.id === r.mid);
    if (!m) return finish(r);
    const body = { id: m.id, site: r.site, title: m.title || '회의', date: m.date || m.createdAt || Date.now(), place: m.place || '', attendees: m.attendees || '', author: m.author || '',
      lines: (m.lines || []).filter(l => l && l.text).map(l => ({ who: l.who || '', at: l.at || '', sec: typeof l.sec === 'number' ? l.sec : undefined, text: l.text })),
      summary: m.summary || null, audio: m.audio ? { name: m.audio.name, dur: m.audio.dur || 0 } : null, updatedAt: m.updatedAt || Date.now() };
    okOrThrow(await call('/api/t/meeting', { method: 'POST', json: body, timeout: 60000 }));
    return finish(r);
  }
  async function uploadOne(r) {
    S.cur = r; renderChip(); renderSheet();
    if (r.type === 'meta') return sendMeta(r);
    if (r.type === 'meeting') return sendMeeting(r);
    const blob = r.blob || (r.ref ? await App.DB.get('blobs', r.ref).catch(() => null) : null);
    if (!blob) return fail(r, '기기에서 원본을 찾지 못했습니다');
    r.size = blob.size;
    if (!r.sha) { r.sha = await sha256Hex(blob); await App.DB.put('outbox', r); }
    const ph = r.kind === 'photo' ? App.photos.find(x => x.id === r.pid) : null;
    if (r.kind === 'photo' && !ph) return finish(r);
    const meta = { name: r.name, size: r.size, sha256: r.sha, kind: r.kind, site: r.site, trade: ph ? (ph.trade || '') : r.trade, user: r.user, createdAt: ph ? ph.takenAt : r.createdAt };
    if (r.sref) meta.ref = r.sref;
    if (ph) meta.extra = photoMeta(ph);
    if (S.oneShot !== false && r.size <= ONE_SHOT) {   // 작은 파일(사진 등)은 한 번에
      r.state = 'up'; r.sent = 0; renderProgress(r);
      const one = await call('/api/t/up1?m=' + b64url(JSON.stringify(meta)), { method: 'POST', body: blob, headers: { 'Content-Type': 'application/octet-stream' }, timeout: 120000 });
      if (one.status === 404 || one.status === 405) S.oneShot = false;   // 옛 PC 프로그램 → 나눠 올리기
      else {
        if (one.status === 401) { revoked(); throw new Error('revoked'); }
        if (one.status === 413 || one.status === 400) return fail(r, one.j.error || '현장 PC가 받지 않았습니다');
        if (!one.ok) throw new Error(one.j.error || ('현장 PC 오류 ' + one.status));
        if (one.j.dup && ph) okOrThrow(await call('/api/t/meta', { method: 'POST', json: { type: 'photo', id: ph.id, meta: photoMeta(ph) } }));
        return finish(r);
      }
    }
    const st = await call('/api/t/up', { method: 'POST', json: meta });
    if (st.status === 401) { revoked(); throw new Error('revoked'); }
    if (st.status === 413 || st.status === 400) return fail(r, st.j.error || '현장 PC가 받지 않았습니다');
    if (!st.ok) throw new Error(st.j.error || ('현장 PC 오류 ' + st.status));
    if (!st.j.dup) {
      let have = st.j.have || 0;
      const step = Math.min(CHUNK, st.j.chunk || CHUNK);
      r.state = 'up'; r.sent = have; await App.DB.put('outbox', r);
      while (have < r.size) {
        const part = blob.slice(have, Math.min(r.size, have + step));
        const up = await call(`/api/t/up/${st.j.id}?offset=${have}`, { method: 'PUT', body: part, headers: { 'Content-Type': 'application/octet-stream' }, timeout: 120000 });
        if (up.status === 409 && typeof up.j.have === 'number') { have = up.j.have; continue; }
        if (up.status === 401) { revoked(); throw new Error('revoked'); }
        if (!up.ok) throw new Error(up.j.error || ('현장 PC 오류 ' + up.status));
        have = up.j.have; r.sent = have; S.cur = r;
        renderChip(); renderProgress(r);
      }
      const fin = await call(`/api/t/up/${st.j.id}/finish`, { method: 'POST', timeout: 120000 });
      if (fin.status === 422 || fin.status === 409) { r.sent = 0; await App.DB.put('outbox', r); throw new Error(fin.j.error || '다시 올립니다'); }
      if (!fin.ok) throw new Error(fin.j.error || ('현장 PC 오류 ' + fin.status));
    }
    else if (ph) {   // 이미 있는 사진이면 정보만 맞춘다
      const mt = await call('/api/t/meta', { method: 'POST', json: { type: 'photo', id: ph.id, meta: photoMeta(ph) } });
      okOrThrow(mt);
    }
    return finish(r);
  }
  async function prune() {   // 다 올린 파일은 최근 40개만 기록으로 남긴다 (사진·녹음은 다시 올리지 않게 표시만 작게 남김)
    const all = await App.DB.all('outbox').catch(() => []);
    const done = all.filter(r => r.state === 'done');
    const plain = done.filter(r => !/^(ph|aud|meta|mtg):/.test(r.id)).sort((a, b) => b.doneAt - a.doneAt);
    for (const r of plain.slice(40)) await App.DB.del('outbox', r.id).catch(() => {});
    for (const r of done.filter(r => /^(meta|mtg):/.test(r.id) && Date.now() - r.doneAt > 864e5)) await App.DB.del('outbox', r.id).catch(() => {});
  }

  // ---------------- 현장 PC에서 보낸 도면·문서 받기 ----------------
  async function getBlob(path) {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 300000);
    try {
      const r = await fetch((S.base || S.cfg.url) + path, { headers: { Authorization: 'Bearer ' + S.cfg.token }, signal: ctl.signal, cache: 'no-store' });
      if (r.status === 401) { revoked(); throw new Error('revoked'); }
      if (!r.ok) throw new Error('받지 못했습니다 (' + r.status + ')');
      return await r.blob();
    } finally { clearTimeout(t); }
  }
  async function pullInbox() {
    if (!App.addIncoming || S.cfg.inbox === false) return;
    const site = App.site ? App.site.name : '';
    const key = 'inbox:' + (S.cfg.serverId || '') + ':' + site;
    let since = App.store.get(key, 0);
    const st = await call('/api/t/inbox?since=' + since + '&site=' + encodeURIComponent(site));
    if (!st.ok) return;
    const got = [];
    for (const it of st.j.items || []) {
      if (it.removed) { await App.removeIncoming(it.id); }
      else {
        const have = App.files.find(f => f.pub === it.id);
        if (!have || (have.pubVer || 0) < it.ver) {
          S.cur = { id: 'in:' + it.id, name: it.name, size: it.size, sent: 0, kind: 'doc' }; renderChip();
          const blob = await getBlob('/api/t/inbox/' + encodeURIComponent(it.id) + '/file');
          await App.addIncoming({ pub: it.id, ver: it.ver, name: it.name, trade: it.trade, site: it.site, blob });
          got.push(it);
        }
      }
      since = Math.max(since, it.publishedAt || 0);
      App.store.set(key, since);
    }
    S.cur = null;
    if (got.length) App.toast(got.length === 1 ? `현장 PC에서 ${got[0].ver > 1 ? '새 판' : '파일'}이 왔습니다 · ${got[0].name}` : `현장 PC에서 파일 ${got.length}개가 왔습니다. 자료함에 넣었습니다.`, false, 6000);
  }

  // ---------------- 현장 PC가 회의 녹음을 글로 바꿔 준다 ----------------
  // 기기는 녹음만 올리면 된다. PC가 바꾸고 나면 그 글을 받아 회의 기록에 넣는다.
  const STT = { jobs: {}, ok: null, auto: true, engine: '', timer: null };
  const sttWants = () => App.store.get('sttWant', {});
  function sttJob(id) { return STT.jobs[id] || null; }
  // 'PC에서 글로 바꾸기': 녹음이 아직 안 올라갔으면 올린 뒤에 부탁한다
  async function sttRequest(m, mode) {
    if (!configured() || !m || !m.audio) return false;
    const w = sttWants(); w[m.id] = { mode: mode || '', at: Date.now() }; App.store.set('sttWant', w);
    STT.jobs[m.id] = Object.assign({}, STT.jobs[m.id] || {}, { id: m.id, status: 'send', progress: 0, error: '' });
    const aid = 'aud:' + m.id;
    const old = await App.DB.get('outbox', aid).catch(() => null);
    if (!old || old.name !== m.audio.name || old.state === 'err') {
      clearTimeout(mtgT[m.id]);
      await putItem({ id: 'mtg:' + m.id, type: 'meeting', kind: 'meeting', name: m.title || '회의', mid: m.id, site: siteNameOf(m.siteId) });
      await putItem({ id: aid, type: 'file', kind: 'audio', name: m.audio.name, ref: 'mt:' + m.id + ':audio', sref: m.id, site: siteNameOf(m.siteId) });
    }

    return true;
  }
  async function sttCancel(id) {
    const w = sttWants(); delete w[id]; App.store.set('sttWant', w);
    if (S.base) await call('/api/t/stt/cancel', { method: 'POST', json: { id } }).catch(() => {});
    if (STT.jobs[id]) STT.jobs[id].status = 'cancel';

  }
  function sttNotify() { try { window.dispatchEvent(new CustomEvent('mycm:stt')); } catch (e) { /* 무시 */ } }
  async function sttApply(j) {
    const m = (App.meetings || []).find(x => x.id === j.id);
    if (!m) return null;
    const lines = (j.lines || []).filter(l => l && l.text).map(l => ({ id: l.id || App.uid(), who: l.who || '', at: l.at || '', sec: l.sec, text: l.text }));
    if (!lines.length) return null;
    const had = (m.lines || []).length;
    if (j.mode === 'append') m.lines = (m.lines || []).concat(lines);
    else if (j.mode === 'replace' || !had) m.lines = lines;
    else return null; // 자동으로 바꾼 것인데 기기에 이미 기록이 있으면 그대로 둔다
    if (m.sample) m.sample = false;

    await App.DB.put('meetings', m);

    return { title: m.title || '회의', n: lines.length };
  }
  async function sttSync() {
    if (S.cfg.meetings === false) return;
    // 부탁해 둔 것 보내기 (녹음이 아직 PC에 없으면 다음에 다시)
    const w = sttWants();
    for (const id of Object.keys(w)) {
      const r = await call('/api/t/stt', { method: 'POST', json: { id, mode: w[id].mode } });
      if (r.status === 404 && !r.j.error) { STT.ok = false; break; } // 예전 PC 프로그램
      if (r.ok && r.j.ok) { delete w[id]; if (r.j.job) STT.jobs[id] = r.j.job; }
      else if (r.ok && r.j.code === 'no_audio') { if (Date.now() - w[id].at > 7 * 864e5) delete w[id]; }
      else if (r.status >= 400 && r.status < 500) { delete w[id]; STT.jobs[id] = { id, status: 'fail', error: r.j.error || '현장 PC가 부탁을 받지 못했습니다' }; }
    }
    App.store.set('sttWant', w);
    await sttPull();
    if (STT.ok && Date.now() - App.store.get('sttTermsAt', 0) > 3600e3) {
      const t = await call('/api/t/stt/terms', { timeout: 15000 }).catch(() => null);
      if (t && t.ok && typeof t.j.terms === 'string') { App.store.set('sttTerms', t.j.terms); App.store.set('sttTermsAt', Date.now()); }
    }
  }
  async function sttPull() {
    const key = 'sttSince:' + (S.cfg.serverId || '');
    const since = App.store.get(key, 0);
    const st = await call('/api/t/stt?since=' + since, { timeout: 20000 });
    if (st.status === 404) { STT.ok = false; return; }
    if (!st.ok) return;
    STT.ok = true; STT.auto = st.j.auto !== false; STT.engine = st.j.engine || '';
    let maxU = since;
    const got = [];
    for (const j of st.j.jobs || []) {
      const prev = STT.jobs[j.id];
      STT.jobs[j.id] = j;

    const had = gotDocs.get(f.fileId);
    if (had) { const b = await App.DB.get('blobs', 'f:' + had).catch(() => null); if (b) bytes = new Uint8Array(await b.arrayBuffer()); }
    if (!bytes) {
      App.busy(true, '현장 PC에서 문서 받는 중', 0.25, f.name);
      try { const blob = await pc('/api/t/doc/' + encodeURIComponent(f.fileId), { blob: true, timeout: 300000 }); bytes = new Uint8Array(await blob.arrayBuffer()); }
      catch (e) { App.busy(false); App.toast('문서를 받지 못했습니다: ' + msgOf(e), true, 8000); return; }
    }
    await App.openBytes(bytes, f.name);
    const rec = App.files.find(x => x.transient && x.name === f.name && x.size === bytes.length);
    if (rec) gotDocs.set(f.fileId, rec.sha);
    if (page && ['pdf', 'hwp', 'hwpx'].includes(ext) && App.views.doc && App.views.doc.jump) {
      try { await App.views.doc.jump({ page, q }); } catch (e) { /* 그 쪽만 못 찾음 */ }
    }
  }

  function notReady() {
    if (App.sync && App.sync.revoked) { App.confirm('현장 PC 연결이 끊겼습니다', MSG.revoked.replace("홈의 [QR로 다시 연결]을 눌러 주세요.", '현장 PC 화면의 QR을 다시 찍으면 바로 이어집니다.'), 'QR로 다시 연결').then(ok => { if (ok) App.sync.repair(); }); return; }
    App.confirm('현장 PC 연동이 필요합니다', 'AI는 현장 PC에 넣은 회사 AI 키로 씁니다. 이 기기를 현장 PC에 연결하면 사진 지적사항 초안, 말로 업무일지, AI 묻기를 쓸 수 있습니다.', 'PC 연동 켜기').then(ok => { if (ok && App.sync) App.sync.open(); });
  }

  // ---------------- 홈 단추 ----------------
  function renderHomeAI() {
    const row = $('#home-ai'); if (!row) return;
    row.hidden = !(ON && App.sync && (App.sync.configured || App.sync.revoked));
    const st = pcState();
    const n = App.store.get(PENDING, []).length;
    $('#q-voice-s').textContent = n ? `PC에 넣을 것 ${n}건` : (st === 'off' ? '현장 PC에서 AI 꺼짐' : st === 'old' ? '현장 PC 새 판 필요' : '말하면 인원·장비·작업 칸으로');
    $('#q-ask-s').textContent = st === 'off' ? '현장 PC에서 AI 꺼짐' : st === 'old' ? '현장 PC 새 판 필요' : '시방서·도면에서 근거와 함께';
  }

  function init() {
    if (!ON) return;
    document.addEventListener('click', (e) => {
      if (e.target.closest('#q-voice')) { voiceDaily(); return; }
      if (e.target.closest('#q-ask')) { App.go('ask'); return; }
    });
    window.addEventListener('mycm:ai', () => { renderHomeAI(); if (App.view === 'ask') renderAsk(); if (App.onAiChange) App.onAiChange(); runPending(); });
    window.addEventListener('online', () => setTimeout(runPending, 4000));
    setInterval(runPending, 120e3);
    setTimeout(runPending, 15000);
    const v = $('#v-ask');
    v.addEventListener('click', async (e) => {
      const t = e.target;
      const ex = t.closest('[data-aex]'); if (ex) { ask(ex.dataset.aex); return; }
      if (t.closest('[data-apair]')) { if (App.sync.revoked) App.sync.repair(); else App.sync.open(); return; }
      if (t.closest('#ask-new')) { A.thread = []; saveThread(); renderAsk(); return; }
      if (t.closest('#ask-mic')) { const s = await listen({ title: '말로 묻기', ok: '묻기', hint: '물어볼 것을 말해 주세요. 예: "삼층 슬래브 거푸집 언제 떼도 돼?"' }); if (s) ask(s); return; }
      const c = t.closest('[data-cite]');
      if (c) { const [i, k] = c.dataset.cite.split(':'); const s = $(`#asrc-${i}-${k}`); if (s) { s.scrollIntoView({ block: 'center', behavior: 'smooth' }); s.classList.add('flash'); setTimeout(() => s.classList.remove('flash'), 1400); } return; }
      const o = t.closest('[data-aopen]');
      if (o) { const [i, k] = o.dataset.aopen.split(':'); const th = A.thread[+i]; const s = th && th.answer && th.answer.sources[+k]; if (s) openRemote(s, s.page, hlTerm(th.q, s.cited)); return; }
      const fo = t.closest('[data-afile]');
      if (fo) { const [i, k] = fo.dataset.afile.split(':'); const f = A.thread[+i].answer.files[+k]; if (f) openRemote({ fileId: f.id, name: f.name, ext: f.ext }, 0, ''); return; }
      const cn = t.closest('[data-acancel]');
      if (cn) { const th = A.thread[+cn.dataset.acancel]; if (th && th.id) pc('/api/t/ask/' + encodeURIComponent(th.id) + '/cancel', { method: 'POST', json: {}, timeout: 10000 }).catch(() => {}); return; }
      const rt = t.closest('[data-aretry]'); if (rt) { const x = A.thread.splice(+rt.dataset.aretry, 1)[0]; saveThread(); ask(x.q); }
    });
    $('#ask-form').addEventListener('submit', (e) => { e.preventDefault(); ask($('#ask-in').value); });
    $('#ask-in').addEventListener('input', autoGrow);
    $('#ask-in').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.matchMedia('(min-width: 900px)').matches) { e.preventDefault(); ask(e.target.value); } });
    renderHomeAI();
  }

  App.views.ask = {
    show() { renderAsk(); scrollEnd(); for (const t of A.thread) if (t.status === 'run' && t.id) poll(t); if (paired()) App.sync.ensure().catch(() => {}); },
    hide() {}
  };
  App.ai = { pc, msgOf, listen, sampler, pickSampler, photoDraft, photoCard, voiceDaily, ask, runPending, paired, state: pcState, renderHome: renderHomeAI, init, SPARK, MIC };
})();


(() => { const hide = () => { const el = document.getElementById('intro'); if (!el || el.classList.contains('out')) return; el.classList.add('out'); setTimeout(() => el.remove(), 450); }; const el = document.getElementById('intro'); if (el) el.addEventListener('click', () => { if (window.App && App.started) hide(); }); const solo = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone; App.start().finally(() => { App.started = true; setTimeout(hide, solo ? Math.max(0, 2200 - performance.now()) : 0); if (window.MYCM_PWA) MYCM_PWA.boot(); }); })();

</script>
